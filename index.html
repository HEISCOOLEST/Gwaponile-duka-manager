<meta name="apple-mobile-web-app-capable" content="yes" />

<style>
  :root{
    --ink:#0f172a; --ink-2:#1e293b; --paper:#f6f8f6; --paper-line:#e2e8e4;
    --muted:#6b7280; --amber:#16a34a; --amber-dark:#15803d; --red:#dc2626; --green:#16a34a;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--paper);color:var(--ink);}
  .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;}
  a{color:inherit;}
  button{font-family:inherit;}

  /* ===== PWA install banner ===== */
  .pwa-install-banner{
    display:none;align-items:center;gap:10px;position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;
    background:var(--ink);color:#fff;border-radius:12px;padding:11px 12px;box-shadow:0 12px 30px rgba(0,0,0,0.35);
    max-width:420px;margin:0 auto;
  }
  .pwa-install-icon img{border-radius:8px;display:block;}
  .pwa-install-text{flex:1;min-width:0;}
  .pwa-install-title{font-size:13.5px;font-weight:700;}
  .pwa-install-sub{font-size:11.5px;color:#94a3b8;margin-top:1px;}
  .pwa-install-btn{background:var(--amber);color:var(--ink);border:none;border-radius:7px;padding:8px 13px;font-size:12.5px;font-weight:700;cursor:pointer;flex-shrink:0;}
  .pwa-dismiss-btn{background:none;border:none;color:#94a3b8;font-size:18px;line-height:1;cursor:pointer;padding:4px 2px;flex-shrink:0;}

  /* ===== Login screen ===== */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink);padding:20px;}
  .login-card{background:#fff;border-radius:12px;padding:32px 28px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,0.3);}
  .login-logo{width:44px;height:44px;border-radius:10px;background:var(--amber);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
  .login-logo svg{width:22px;height:22px;color:var(--ink);}
  .login-title{text-align:center;font-size:18px;font-weight:800;margin:0 0 4px;}
  .login-sub{text-align:center;font-size:12.5px;color:var(--muted);margin:0 0 22px;}
  .login-error{background:#fef2f2;color:var(--red);font-size:12.5px;padding:9px 12px;border-radius:7px;margin-bottom:14px;display:none;}
  .login-loading{text-align:center;color:var(--muted);font-size:13px;padding:60px 0;}

  /* ===== layout ===== */
  .app{display:flex;min-height:100vh;}
  .sidebar{width:250px;flex-shrink:0;background:#ffffff;border-right:1px solid var(--paper-line);display:flex;flex-direction:column;min-height:100vh;}
  .sidebar-head{padding:16px 18px;border-bottom:1px solid var(--paper-line);display:flex;align-items:center;gap:10px;}
  .logo-badge{width:34px;height:34px;border-radius:9px;background:var(--green);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .logo-badge svg{width:17px;height:17px;color:#fff;}
  .brand-name{color:var(--ink);font-weight:800;font-size:14px;line-height:1.2;letter-spacing:-0.01em;}
  .brand-sub{color:var(--muted);font-size:10px;font-family:monospace;}
  .sidebar-id-card{margin:12px 14px 4px;padding:10px 12px;border:1px solid var(--paper-line);border-radius:9px;background:var(--paper);}
  .sidebar-id-card .id-name{font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.25;}
  .sidebar-id-card .id-role{font-size:11px;color:var(--muted);margin-top:2px;}
  .sidebar-id-card .id-status{font-size:10.5px;color:var(--green);font-weight:700;margin-top:4px;}
  nav.sidebar-nav{flex:1;padding:12px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;}
  .nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border:none;border-left:3px solid transparent;background:none;border-radius:6px;color:#44403c;font-size:13.5px;font-weight:500;cursor:pointer;text-align:left;}
  .nav-item svg{width:17px;height:17px;flex-shrink:0;}
  .nav-item:hover{background:var(--paper);color:var(--ink);}
  .nav-item.active{background:#ecfdf3;color:var(--green);border-left:3px solid var(--green);font-weight:700;}
  .nav-badge{margin-left:auto;font-size:10.5px;font-family:monospace;padding:2px 6px;border-radius:5px;background:rgba(220,38,38,0.12);color:var(--red);}
  .nav-item.active .nav-badge{background:var(--green);color:#fff;}
  .sidebar-foot{padding:14px 18px;border-top:1px solid var(--paper-line);}
  .user-chip{display:flex;align-items:center;gap:9px;margin-bottom:10px;}
  .user-avatar{width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;flex-shrink:0;}
  .user-name{color:var(--ink);font-size:12.5px;font-weight:600;line-height:1.2;}
  .user-role{color:var(--muted);font-size:10.5px;}
  .logout-btn{width:100%;background:var(--paper);color:#44403c;border:1px solid var(--paper-line);border-radius:6px;padding:7px;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
  .logout-btn svg{width:15px;height:15px;flex-shrink:0;}
  .logout-btn:hover{background:#fef2f2;color:var(--red);border-color:#fecaca;}

  main{flex:1;min-height:100vh;}
  .view{padding:24px;max-width:1100px;}
  .view-header{margin-bottom:22px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .view-header h1{font-size:20px;font-weight:700;margin:0 0 3px;}
  .view-header p{font-size:13px;color:var(--muted);margin:0;}
  .view-eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--green);margin:0 0 4px;}
  .hero-cta{display:block;width:100%;background:var(--green);color:#fff;border:none;border-radius:10px;padding:14px 18px;font-size:14.5px;font-weight:700;cursor:pointer;text-align:center;margin-bottom:20px;box-shadow:0 6px 16px rgba(22,163,74,0.25);}
  .hero-cta:hover{background:var(--amber-dark);}
  .hero-cta svg{width:16px;height:16px;vertical-align:-3px;margin-right:6px;}

  .btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:7px;font-size:13.5px;font-weight:600;padding:9px 15px;cursor:pointer;}
  .btn svg{width:15px;height:15px;}
  .btn-dark{background:var(--ink);color:#fff;}
  .btn-dark:hover{background:var(--ink-2);}
  .btn-amber{background:var(--amber);color:#fff;}
  .btn-amber:hover{background:var(--amber-dark);}
  .btn-amber:disabled{background:#e7e5e4;color:#a8a29e;cursor:not-allowed;}
  .btn-block{width:100%;justify-content:center;}
  .btn-outline{background:#fff;border:1px solid #d6d3d1;color:var(--ink);}
  .btn-outline:hover{background:#f5f5f4;}
  .icon-btn{background:none;border:none;cursor:pointer;color:#a8a29e;padding:2px;display:inline-flex;}
  .icon-btn:hover{color:var(--ink);}
  .icon-btn.danger:hover{color:var(--red);}
  .icon-btn svg{width:15px;height:15px;}

  .kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:22px;}
  @media(min-width:900px){.kpi-grid{grid-template-columns:repeat(4,1fr);}}
  .kpi-card{background:#fff;border:1px solid var(--paper-line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;text-align:left;}
  .kpi-top{display:flex;align-items:center;justify-content:space-between;}
  .kpi-label{font-size:12px;color:var(--muted);font-weight:600;}
  .kpi-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;}
  .kpi-icon svg{width:15px;height:15px;}
  .kpi-icon.slate{background:#f1f5f9;color:var(--ink);}
  .kpi-icon.green{background:#ecfdf5;color:var(--green);}
  .kpi-icon.amber{background:#ecfdf5;color:var(--green);}
  .kpi-icon.red{background:#fef2f2;color:var(--red);}
  .kpi-value{font-family:inherit;font-size:23px;font-weight:800;line-height:1;}
  .kpi-sub{font-size:11.5px;color:var(--muted);}
  .kpi-sub.up{color:var(--green);}
  .kpi-sub.down{color:var(--red);}

  .grid-2{display:grid;grid-template-columns:2fr 1fr;gap:16px;}
  @media(max-width:900px){.grid-2{grid-template-columns:1fr;}}
  .card{background:#fff;border:1px solid var(--paper-line);border-radius:10px;padding:16px;}
  .card h2{font-size:13.5px;font-weight:700;margin:0 0 12px;}

  .ticker{background:#fff;border:1px solid var(--paper-line);border-radius:12px;padding:18px;color:var(--ink);}
  .ticker h2{color:var(--ink);font-size:15px;font-weight:700;margin:0 0 3px;display:flex;align-items:center;gap:7px;}
  .ticker h2 svg{width:15px;height:15px;color:var(--green);}
  .ticker-desc{font-size:12px;color:var(--muted);margin:0 0 14px;}
  .ticker-viewall{float:right;font-size:12px;color:var(--green);font-weight:700;background:none;border:none;cursor:pointer;padding:0;}
  .ticker-list{font-size:12.5px;display:flex;flex-direction:column;gap:0;max-height:280px;overflow-y:auto;}
  .ticker-row{border-bottom:1px solid var(--paper-line);padding:9px 0;}
  .ticker-row:last-child{border-bottom:none;}
  .ticker-row-top{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:3px;}
  .ticker-row-bottom{display:flex;justify-content:space-between;}
  .ticker-name{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px;}
  .ticker-amt{color:var(--green);font-weight:700;}
  .empty-note{color:#64748b;font-size:12px;}

  .search-wrap{position:relative;max-width:280px;margin-bottom:14px;}
  .search-wrap svg{position:absolute;left:10px;top:9px;width:15px;height:15px;color:#a8a29e;}
  input,select,textarea{border:1px solid #d6d3d1;border-radius:7px;padding:8px 12px;font-size:13.5px;font-family:inherit;width:100%;outline:none;background:#fff;color:var(--ink);}
  input:focus,select:focus{border-color:var(--amber);box-shadow:0 0 0 2px rgba(22,163,74,0.25);}
  .search-wrap input{padding-left:32px;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff;}
  .table-card{background:#fff;border:1px solid var(--paper-line);border-radius:10px;overflow:hidden;overflow-x:auto;}
  thead{background:#fafaf9;}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:0.04em;color:var(--muted);font-weight:700;padding:10px 14px;white-space:nowrap;}
  th.right,td.right{text-align:right;}
  tbody tr{border-top:1px solid #f5f5f4;}
  tbody tr:hover{background:#fafaf9;}
  td{padding:10px 14px;vertical-align:middle;}
  .cell-title{font-weight:600;}
  .cell-sub{font-size:11px;color:#a8a29e;font-family:monospace;}
  .pill-low{background:#fef2f2;color:var(--red);padding:1px 7px;border-radius:6px;font-family:monospace;}
  .pill-role{padding:2px 8px;border-radius:5px;font-size:11px;font-weight:700;}
  .pill-Administrator{background:#fef2f2;color:#b91c1c;}
  .pill-Manager{background:#eff6ff;color:#1d4ed8;}
  .pill-Cashier{background:#f0fdf4;color:#15803d;}
  .pill-Inventory{background:#fffbeb;color:#b45309;}
  .pill-disabled{background:#f5f5f4;color:#a8a29e;}
  .empty-row td{text-align:center;color:#a8a29e;padding:34px;font-size:13px;}
  .row-actions{display:flex;justify-content:flex-end;gap:8px;}
  tr.clickable{cursor:pointer;}

  .modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,0.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;}
  .modal{background:#fff;border-radius:10px;box-shadow:0 20px 50px rgba(0,0,0,0.25);width:100%;max-width:440px;max-height:85vh;overflow-y:auto;}
  .modal.wide{max-width:680px;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--paper-line);position:sticky;top:0;background:#fff;}
  .modal-head h3{margin:0;font-size:14.5px;font-weight:700;}
  .modal-body{padding:20px;}
  .field{display:block;margin-bottom:12px;}
  .field label{display:block;font-size:11.5px;font-weight:700;color:#57534e;margin-bottom:5px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .field-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:11px 18px;border-radius:8px;box-shadow:0 10px 25px rgba(0,0,0,0.2);z-index:210;max-width:90vw;text-align:center;}

  .sale-grid{display:grid;grid-template-columns:2fr 1fr;gap:18px;}
  @media(max-width:900px){.sale-grid{grid-template-columns:1fr;}}
  .product-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  @media(max-width:640px){.product-grid{grid-template-columns:repeat(2,1fr);}}
  .product-tile{text-align:left;background:#fff;border:1px solid var(--paper-line);border-radius:8px;padding:11px;cursor:pointer;}
  .product-tile:hover{border-color:var(--amber);box-shadow:0 2px 8px rgba(0,0,0,0.06);}
  .product-tile .pt-name{font-size:13px;font-weight:600;line-height:1.25;}
  .product-tile .pt-stock{font-size:11px;color:#a8a29e;font-family:monospace;margin-top:4px;}
  .product-tile .pt-price{font-family:monospace;font-size:13px;font-weight:700;color:var(--amber-dark);margin-top:4px;}

  .cart-panel{background:#fff;border:1px solid var(--paper-line);border-radius:10px;padding:16px;position:sticky;top:16px;height:fit-content;}
  .cart-title{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700;margin:14px 0 8px;}
  .cart-title svg{width:15px;height:15px;}
  .cart-list{max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;margin-bottom:10px;padding-right:2px;}
  .cart-row{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #f5f5f4;padding-bottom:9px;font-size:13px;}
  .cart-row-name{font-weight:600;color:#292524;line-height:1.2;}
  .qty-ctrl{display:flex;align-items:center;gap:6px;margin-top:6px;}
  .qty-btn{width:20px;height:20px;border-radius:5px;background:#f5f5f4;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .qty-btn svg{width:11px;height:11px;}
  .qty-val{font-family:monospace;font-size:12px;width:18px;text-align:center;}
  .discount-box{border-top:1px solid var(--paper-line);padding-top:10px;margin-bottom:10px;}
  .discount-row{display:flex;gap:8px;}
  .discount-row select{flex:0 0 74px;}
  .subtotal-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);padding:3px 0;}
  .cart-total-row{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--paper-line);padding-top:10px;margin-bottom:12px;}
  .cart-total-label{font-size:13.5px;font-weight:700;}
  .cart-total-val{font-family:monospace;font-size:19px;font-weight:800;}

  .chart-wrap{height:230px;}
  svg.chart{width:100%;height:100%;}

  .receipt{font-family:monospace;font-size:13px;}
  .receipt-head{text-align:center;margin-bottom:12px;padding-bottom:12px;border-bottom:1px dashed #d6d3d1;}
  .receipt-head .rname{font-weight:700;}
  .receipt-head .rmeta{font-size:11px;color:var(--muted);}
  .receipt-items{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
  .receipt-item{display:flex;justify-content:space-between;font-size:12px;}
  .receipt-sub{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding-top:6px;border-top:1px dashed #d6d3d1;}
  .receipt-total{display:flex;justify-content:space-between;border-top:1px dashed #d6d3d1;padding-top:8px;font-weight:800;margin-top:4px;}
  .receipt-thanks{text-align:center;font-size:10.5px;color:#a8a29e;margin-top:16px;}

  .locked-note{background:#fffbeb;border:1px solid #fde68a;color:#92400e;font-size:12.5px;padding:10px 13px;border-radius:8px;margin-bottom:16px;}
  .shift-required{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;font-size:12.5px;padding:11px 13px;border-radius:8px;margin-bottom:14px;}
  .shift-required strong{display:block;margin-bottom:3px;}

  .support-card{background:#fff;border:1px solid var(--paper-line);border-radius:10px;padding:16px;display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);margin-bottom:10px;}
  .support-card:hover{border-color:var(--amber);}
  .support-icon{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .support-icon svg{width:18px;height:18px;}
  .support-title{font-size:13.5px;font-weight:700;}
  .support-sub{font-size:12px;color:var(--muted);}

  .role-toggle{display:flex;gap:6px;margin-bottom:14px;}
  .role-chip{padding:6px 12px;border-radius:16px;font-size:12px;font-weight:600;border:1px solid var(--paper-line);background:#fff;cursor:pointer;}
  .role-chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}

  .spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ===== Barcode scanner modal ===== */
  .scanner-wrap{position:relative;background:#000;border-radius:8px;overflow:hidden;aspect-ratio:4/3;}
  .scanner-wrap video{width:100%;height:100%;object-fit:cover;display:block;}
  .scanner-frame{position:absolute;inset:15% 12%;border:2px solid var(--amber);border-radius:8px;pointer-events:none;}
  .scanner-hint{font-size:11.5px;color:var(--muted);text-align:center;margin-top:10px;}

  /* ===== Print receipt ===== */
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{position:absolute;top:0;left:0;width:100%;padding:12px;}
    .modal-head, #refundSaleBtn, #printReceiptBtn{display:none !important;}
  }

  .receipt-center-actions .btn{min-width:38px;padding:8px;}
  .receipt-center-actions{display:flex;flex-wrap:wrap;gap:6px;}

  /* ===== Phase 4 ===== */
  .connection-badge{position:static;flex-shrink:0;white-space:nowrap;order:99;padding:6px 10px;border-radius:999px;font-size:10px;font-weight:800;letter-spacing:.04em;background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}.connection-badge.offline{background:#fff7ed;color:#c2410c;border-color:#fed7aa}.card-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.stack{display:flex;flex-wrap:wrap;gap:8px}.muted{color:var(--muted);font-size:13px}@media(max-width:800px){.card-grid{grid-template-columns:1fr}.connection-badge{font-size:9px;padding:5px 8px}}

  /* ===== Mobile icon sidebar + expandable hamburger ===== */
  .mobile-menu-toggle{display:none;}
  .mobile-bottom-nav{display:none;}

  @media(max-width:700px){
    .app{min-height:100vh;}
    .sidebar{width:62px;min-width:62px;transition:width .22s ease, min-width .22s ease;overflow-x:hidden;overflow-y:auto;max-height:100vh;padding-bottom:140px;}
    .sidebar.expanded{width:230px;min-width:230px;}
    .sidebar-head{height:64px;padding:14px 13px;justify-content:center;}
    .sidebar-head .brand-name,.sidebar-head .brand-sub{display:none;}
    .sidebar.expanded .sidebar-head{justify-content:flex-start;padding-left:16px;}
    .sidebar.expanded .sidebar-head .brand-name,.sidebar.expanded .sidebar-head .brand-sub{display:block;}
    .logo-badge{width:36px;height:36px;flex-shrink:0;}
    nav.sidebar-nav{padding:10px 8px;gap:6px;}
    .nav-item{width:46px;height:46px;padding:0;margin:0 auto;justify-content:center;border-radius:9px;position:relative;}
    .nav-item svg{width:20px;height:20px;flex-shrink:0;}
    .nav-item > span{display:none;}
    .sidebar.expanded .nav-item{width:100%;padding:0 12px;justify-content:flex-start;gap:10px;}
    .sidebar.expanded .nav-item > span{display:block;white-space:nowrap;}
    .nav-badge{position:absolute;top:2px;right:1px;margin:0;min-width:16px;text-align:center;padding:1px 4px;font-size:9px;}
    .sidebar.expanded .nav-badge{position:static;margin-left:auto;}
    .sidebar-foot{padding:8px;position:fixed;left:0;bottom:60px;width:62px;z-index:85;background:#fff;border-top:1px solid var(--paper-line);transition:width .22s ease;}
    .sidebar.expanded .sidebar-foot{width:230px;}
    .user-chip{justify-content:center;margin:0 0 8px;}
    .user-chip > div:not(.user-avatar){display:none;}
    .sidebar.expanded .user-chip{justify-content:flex-start;padding-left:5px;}
    .sidebar.expanded .user-chip > div:not(.user-avatar){display:block;}
    .user-avatar{width:36px;height:36px;font-size:12px;flex-shrink:0;}
    .logout-btn{width:46px;height:38px;padding:0;margin:auto;display:flex;align-items:center;justify-content:center;font-size:0;}
    .sidebar.expanded .logout-btn{width:100%;font-size:13px;justify-content:flex-start;padding-left:13px;gap:10px;}
    .logout-btn svg{width:18px;height:18px;flex-shrink:0;}
    main{min-width:0;width:calc(100% - 62px);overflow-x:hidden;transition:width .22s ease;}
    .sidebar.expanded + main{width:calc(100% - 230px);}
    .view{padding:68px 12px 84px;max-width:none;}
    .mobile-bottom-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:80;background:#fff;border-top:1px solid var(--paper-line);box-shadow:0 -2px 10px rgba(15,23,42,.06);padding:6px 4px calc(6px + env(safe-area-inset-bottom));}
    .mobile-bottom-nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--muted);font-size:10.5px;font-weight:600;padding:5px 2px;cursor:pointer;}
    .mobile-bottom-nav-item svg{width:20px;height:20px;}
    .mobile-bottom-nav-item.active{color:var(--green);}
    .toast{bottom:76px;}
    .mobile-menu-toggle{display:flex;position:fixed;top:12px;left:74px;width:42px;height:42px;z-index:70;align-items:center;justify-content:center;border:1px solid var(--paper-line);border-radius:9px;background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(15,23,42,.08);cursor:pointer;}
    .sidebar.expanded ~ main .mobile-menu-toggle{left:242px;}
    .mobile-menu-toggle svg{width:22px;height:22px;}
    .view-header{margin-bottom:16px;}
    .view-header h1{font-size:19px;}
    .view-header p{font-size:12px;}
    .kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;}
    .kpi-card{padding:12px;min-width:0;}
    .kpi-value{font-size:19px;}
    .card{padding:13px;}
    .table-card{max-width:100%;}
    .sale-grid,.grid-2{grid-template-columns:1fr;}
  }

  @media(max-width:380px){
    .sidebar{width:56px;min-width:56px;}
    .sidebar.expanded{width:215px;min-width:215px;}
    main{width:calc(100% - 56px);}
    .sidebar.expanded + main{width:calc(100% - 215px);}
    .view{padding-left:9px;padding-right:9px;}
    .mobile-menu-toggle{left:66px;}
    .sidebar.expanded ~ main .mobile-menu-toggle{left:227px;}
    .nav-item{width:42px;height:44px;}
    .logout-btn{width:42px;}
    .sidebar-foot{width:56px;}
    .sidebar.expanded .sidebar-foot{width:215px;}
  }


  /* =========================================================
     V1.4 PROFESSIONAL THEME SYSTEM
     ========================================================= */
  :root{
    --bg:#f4f8f5;--surface:#ffffff;--surface-2:#f6faf7;--text:#172033;--muted:#64748b;
    --line:#e2e8e4;--ink:#0f172a;--accent:#16a34a;--accent-strong:#15803d;--success:#16a34a;
    --danger:#dc2626;--shadow:0 10px 30px rgba(15,23,42,.06);
  }
  html[data-theme="dark"]{
    --bg:#0b1120;--surface:#111827;--surface-2:#172033;--text:#e5e7eb;--muted:#94a3b8;
    --line:#263247;--ink:#050b16;--accent:#22c55e;--accent-strong:#16a34a;--success:#22c55e;
    --danger:#f87171;--shadow:0 14px 35px rgba(0,0,0,.28);
  }
  body{background:var(--bg);color:var(--text);transition:background .2s ease,color .2s ease}
  .card,.table-card,.kpi-card,.modal,.topbar,.sale-panel,.receipt-panel,.support-card{background:var(--surface)!important;color:var(--text);border-color:var(--line)!important;box-shadow:var(--shadow)}
  input,select,textarea{background:var(--surface)!important;color:var(--text)!important;border-color:var(--line)!important}
  input::placeholder,textarea::placeholder{color:var(--muted)!important}
  .muted,.view-header p,.kpi-label{color:var(--muted)!important}
  .theme-toggle{width:40px;height:40px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:12px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.05);transition:.18s}
  .theme-toggle:hover{transform:translateY(-1px);border-color:var(--accent)}
  .theme-toggle svg{width:19px;height:19px}

  /* ===== V17.4 SALES GRAPH + TARGET CELEBRATION ===== */
  .chart-wrap{position:relative;overflow:hidden;padding:4px 2px 0}
  .chart-stage{position:relative}
  .chart-replay-btn{position:absolute;right:10px;top:4px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:6px 10px;font-size:10px;font-weight:800;cursor:pointer;box-shadow:0 5px 14px rgba(15,23,42,.08);z-index:2}
  .chart-replay-btn:hover{transform:translateY(-1px);border-color:var(--accent);color:var(--accent)}
  .chart-target-line{pointer-events:none}
  svg.chart{overflow:visible}
  svg.chart .chart-line{stroke-dasharray:1800;stroke-dashoffset:1800;animation:chartDraw 3.2s cubic-bezier(.22,.61,.36,1) forwards}
  svg.chart .chart-line-glow{stroke-dasharray:1800;stroke-dashoffset:1800;animation:chartDraw 3.2s cubic-bezier(.22,.61,.36,1) forwards;animation-delay:.12s}
  svg.chart .chart-point{transform-box:fill-box;transform-origin:center;opacity:0;animation:chartPointIn .8s cubic-bezier(.34,1.56,.64,1) both}
  svg.chart .chart-point-ring{transform-box:fill-box;transform-origin:center;opacity:0;animation:chartRingIn .7s ease-out both}
  svg.chart .chart-point:hover{r:5.5;filter:drop-shadow(0 3px 8px color-mix(in srgb,var(--accent) 40%,transparent))}
  svg.chart .chart-grid{opacity:.5;animation:chartGridIn 1s ease both}
  svg.chart .chart-target-line{stroke-dasharray:7 6;animation:chartTargetIn 1.4s ease both}
  svg.chart .chart-target-label{font-weight:850;letter-spacing:.15px;animation:chartTargetIn .9s ease both}
  @keyframes chartDraw{to{stroke-dashoffset:0}}
  @keyframes chartPointIn{0%{transform:scale(0);opacity:0}55%{transform:scale(1.45);opacity:1}100%{transform:scale(1);opacity:1}}
  @keyframes chartRingIn{0%{transform:scale(.2);opacity:0}55%{transform:scale(1.5);opacity:.45}100%{transform:scale(1);opacity:0}}
  @keyframes chartGridIn{from{opacity:0}to{opacity:.5}}
  @keyframes chartTargetIn{from{opacity:0;stroke-dashoffset:26}to{opacity:.72;stroke-dashoffset:0}}
  .chart-stage.is-replaying svg.chart .chart-line,.chart-stage.is-replaying svg.chart .chart-line-glow,.chart-stage.is-replaying svg.chart .chart-target-line,.chart-stage.is-replaying svg.chart .chart-target-label{animation:none}
  .chart-stage.is-replaying svg.chart .chart-target-line{stroke-dashoffset:26}
  .chart-stage.is-replaying svg.chart .chart-target-label{opacity:0}
  .chart-stage.is-replaying svg.chart .chart-point,.chart-stage.is-replaying svg.chart .chart-point-ring{animation:none}
  .v17-target-card{position:relative;overflow:hidden;border:1px solid var(--line);background:linear-gradient(135deg,var(--surface),var(--soft));border-radius:16px;padding:17px 18px;margin:0 0 16px;box-shadow:var(--shadow);animation:targetIn .55s ease both}

  .v17-target-title{font-size:13px;font-weight:850;color:var(--text);display:flex;align-items:center;gap:8px}

  .v17-celebration{position:fixed;inset:0;z-index:1000;pointer-events:none;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at center,rgba(255,255,255,.72),rgba(255,255,255,0) 48%);animation:celebrateFade 4.8s ease forwards}
  .v17-celebration-box{padding:22px 28px;border:1px solid rgba(255,255,255,.72);border-radius:22px;background:rgba(255,255,255,.92);box-shadow:0 18px 60px rgba(15,23,42,.22);text-align:center;animation:celebratePop .8s cubic-bezier(.16,1,.3,1) both}

  @keyframes targetIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes targetShine{0%,45%{transform:translateX(-100%)}75%,100%{transform:translateX(100%)}}
  @keyframes targetPulse{50%{transform:scale(1.04)}}

  @media(max-width:700px){.v17-target-top{flex-direction:column}.v17-target-actions{width:100%;justify-content:space-between}.v17-target-amount{text-align:left}.v17-target-meta{flex-direction:column;gap:4px}}

  /* ===== V1.5 professional business UI ===== */
  .v15-role-badge{font-size:11px;font-weight:800;padding:7px 10px;border:1px solid var(--line);border-radius:999px;color:var(--text);background:var(--surface)}
  .v15-notify-wrap{position:relative}.v15-notify-btn{position:relative;width:40px;height:40px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:12px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}.v15-notify-btn svg{width:18px;height:18px}.v15-notify-btn span{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;border-radius:999px;font-size:9px;font-weight:800;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;border:2px solid var(--surface)}

  .v15-alert-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 0 16px}.v15-alert-card{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;text-align:left;cursor:pointer;box-shadow:var(--shadow)}.v15-alert-card b{display:block;font-size:24px}.v15-alert-card span{font-size:11px;color:var(--muted)}.v15-alert-card.warn{border-color:#fcd34d}.v15-alert-card.bad{border-color:#fca5a5}.v15-alert-card.good{border-color:#a7f3d0}

/* ============================================================
   STAFF CHAT
============================================================ */
.staff-chat{display:flex;flex-direction:column;height:calc(100vh - 150px);min-height:520px;background:var(--paper);border:1px solid var(--paper-line);border-radius:14px;overflow:hidden;}
.staff-chat-head{padding:14px 16px;background:#fff;border-bottom:1px solid var(--paper-line);display:flex;align-items:center;justify-content:space-between;gap:10px;}
.staff-chat-title{font-weight:800;color:var(--ink);font-size:15px;}
.staff-chat-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.staff-chat-online{font-size:11px;font-weight:700;color:var(--green);white-space:nowrap;}
.staff-chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;}
.chat-row{display:flex;gap:8px;align-items:flex-end;max-width:82%;}
.chat-row.mine{align-self:flex-end;flex-direction:row-reverse;}
.chat-avatar{width:30px;height:30px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0;}
.chat-bubble{background:#fff;border:1px solid var(--paper-line);border-radius:13px 13px 13px 4px;padding:8px 10px;box-shadow:0 1px 2px rgba(15,23,42,.04);min-width:90px;}
.chat-row.mine .chat-bubble{background:#ecfdf3;border-radius:13px 13px 4px 13px;}
.chat-sender{font-size:10px;font-weight:800;color:var(--green);margin-bottom:3px;}
.chat-text{font-size:13px;color:var(--ink);white-space:pre-wrap;word-break:break-word;}
.chat-meta{font-size:9px;color:var(--muted);margin-top:5px;text-align:right;}
.chat-tools{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap;}
.chat-reply-btn{border:0;background:transparent;color:var(--muted);font-size:10px;font-weight:800;cursor:pointer;padding:2px 4px;}
.chat-reply-btn:hover{color:var(--green);}
.chat-quoted{border-left:3px solid var(--green);background:rgba(16,185,129,.06);padding:5px 7px;border-radius:5px;margin-bottom:6px;}
.chat-quoted-name{font-size:10px;font-weight:800;color:var(--green);}
.chat-quoted-text{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px;}
.chat-reply-compose{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#f8fafc;border-top:1px solid var(--paper-line);padding:7px 10px;border-left:3px solid var(--green);font-size:11px;}
.chat-reply-compose strong{color:var(--green);display:block;margin-bottom:2px;}
.chat-reply-compose div div{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px;}
.chat-reply-compose button{border:0;background:transparent;font-size:20px;color:var(--muted);cursor:pointer;}
.chat-compose{background:#fff;border-top:1px solid var(--paper-line);padding:10px;display:flex;gap:8px;align-items:flex-end;}
.chat-compose textarea{flex:1;resize:none;min-height:42px;max-height:110px;border:1px solid var(--paper-line);border-radius:10px;padding:10px;font:inherit;font-size:13px;outline:none;}
.chat-compose textarea:focus{border-color:var(--green);box-shadow:0 0 0 2px rgba(16,185,129,.08);}
.chat-action{width:42px;height:42px;border:1px solid var(--paper-line);border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);}
.chat-action:hover{background:var(--paper);}
.chat-action.send{background:var(--green);color:#fff;border-color:var(--green);}
.chat-empty{text-align:center;color:var(--muted);padding:50px 20px;font-size:13px;}
@media(max-width:700px){.staff-chat{height:calc(100vh - 145px);min-height:430px;border-radius:10px}.chat-row{max-width:92%}.chat-compose{padding:8px}.chat-action{width:40px;height:40px}}

<style id="gwaponile-v17-3-animations">
/* ==========================================================
   V17.3 — PREMIUM SMOOTH ANIMATIONS
   Lightweight, business-friendly motion. Respects reduced motion.
========================================================== */
@keyframes gwFadeUp {
  from { opacity:0; transform:translateY(8px); }
  to   { opacity:1; transform:translateY(0); }
}
@keyframes gwFadeIn {
  from { opacity:0; }
  to   { opacity:1; }
}
@keyframes gwScaleIn {
  from { opacity:0; transform:scale(.985); }
  to   { opacity:1; transform:scale(1); }
}
@keyframes gwPulseSoft {
  0%,100% { transform:scale(1); box-shadow:0 0 0 0 rgba(220,38,38,0); }
  50% { transform:scale(1.035); box-shadow:0 0 0 5px rgba(220,38,38,.10); }
}
@keyframes gwShimmer {
  from { background-position:-220px 0; }
  to { background-position:220px 0; }
}

/* Page/view entrance */
.view { animation:gwFadeUp .36s cubic-bezier(.2,.7,.2,1) both; }
.view-header { animation:gwFadeIn .3s ease both; }

/* Dashboard/report surfaces */
.card, .kpi-card, .table-card, .support-card, .ticker,
.product-tile, .sale-panel, .cart-panel, .receipt-panel {
  animation:gwFadeUp .38s cubic-bezier(.2,.7,.2,1) both;
}

/* Give repeated cards a gentle stagger without requiring JS */
.kpi-card:nth-child(2), .card:nth-child(2), .product-tile:nth-child(2) { animation-delay:.04s; }
.kpi-card:nth-child(3), .card:nth-child(3), .product-tile:nth-child(3) { animation-delay:.08s; }
.kpi-card:nth-child(4), .card:nth-child(4), .product-tile:nth-child(4) { animation-delay:.12s; }

/* Buttons and navigation */
.btn, .theme-toggle, .icon-btn, .nav-item, .mobile-bottom-nav-item,
.qty-btn, .logout-btn, .v15-notify-btn {
  transition:transform .16s ease, box-shadow .16s ease, background-color .16s ease,
              border-color .16s ease, color .16s ease, opacity .16s ease;
}
.btn:hover, .theme-toggle:hover, .icon-btn:hover { transform:translateY(-1px); }
.btn:active, .theme-toggle:active, .icon-btn:active, .qty-btn:active { transform:scale(.97); }

/* Theme chooser / modal */
.modal-overlay { animation:gwFadeIn .12s ease both; }
.modal { animation:gwScaleIn .12s ease both; }
.theme-choice { transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease; }
.theme-choice:hover { transform:translateY(-3px); }

/* Warning notification: alert badge gently calls attention */
.v15-notify-btn.has-alert,
.v15-notify-btn[data-has-alert="true"] {
  animation:gwPulseSoft 1.8s ease-in-out infinite;
}

/* Holiday theme decorative layer, if present */
html[data-holiday-override="on"] .app-mainbar::after {
  content:"";
  position:absolute;
  inset:auto 0 0 0;
  height:2px;
  background:linear-gradient(90deg,var(--theme-a,#16a34a),var(--theme-b,#f4c430),var(--theme-c,#1683c8));
  background-size:220% 100%;
  animation:gwShimmer 4s linear infinite;
  pointer-events:none;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
    scroll-behavior:auto !important;
  }
}
</style>
</head>

<script>
  // Diagnostic: if the module script fails to load or throws, show the real error on screen
  // instead of leaving the page stuck on "Loading...".
  window.addEventListener("error", function(e){
    var root = document.getElementById("root");
    if(root) root.innerHTML = '<div style="padding:24px;font-family:monospace;font-size:13px;color:#b91c1c;background:#fef2f2;white-space:pre-wrap;">HITILAFU:\n' + (e.message||e) + '\n' + (e.filename? ('Faili: '+e.filename+':'+e.lineno) : '') + '</div>';
  });
  window.addEventListener("unhandledrejection", function(e){
    var root = document.getElementById("root");
    if(root) root.innerHTML = '<div style="padding:24px;font-family:monospace;font-size:13px;color:#b91c1c;background:#fef2f2;white-space:pre-wrap;">HITILAFU (Firebase/Network):\n' + (e.reason && e.reason.message ? e.reason.message : e.reason) + '</div>';
  });
  setTimeout(function(){
    var root = document.getElementById("root");
    if(root && root.innerHTML.indexOf("Loading...") !== -1){
      var offlineMsg = 'Huna mtandao kwa sasa. SALES MANAGEMENT SYSTEM inahitaji intaneti kusawazisha mauzo/stock. Tafadhali unganisha WiFi/Data kisha reload.';
      var blockedMsg = 'Mfumo umekwama ku-loading kwa zaidi ya sekunde 8.\nHii kwa kawaida ina maanisha mtandao wako unazuia www.gstatic.com (Firebase).\nJaribu mtandao mwingine (WiFi/Data), au wasiliana na msaada.';
      root.innerHTML = '<div style="padding:24px;font-family:-apple-system,sans-serif;font-size:13px;color:#92400e;background:#fffbeb;white-space:pre-wrap;">' + (navigator.onLine ? blockedMsg : offlineMsg) + '</div>';
    }
  }, 8000);

  // ===== PWA: sajili Service Worker (app shell caching + hisia ya "app" halisi wakati mtandao ni dhaifu) =====
  // Haihifadhi data za Firebase (mauzo/stock/wateja) — hizo zinabaki live kila wakati.
  // sw.js lazima ipakiwe kwenye folda ile ile na faili hili (index.html).

  // ===== PWA: banner ya "Sakinisha App" (Android/Chrome) =====
  let deferredInstallPrompt = null;
  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault();
    deferredInstallPrompt = e;
    var banner = document.getElementById("pwaInstallBanner");
    if (banner) banner.style.display = "flex";
  });
  window.addEventListener("appinstalled", function(){
    var banner = document.getElementById("pwaInstallBanner");
    if (banner) banner.style.display = "none";
    deferredInstallPrompt = null;
  });
  window.addEventListener("DOMContentLoaded", function(){
    var installBtn = document.getElementById("pwaInstallBtn");
    var dismissBtn = document.getElementById("pwaDismissBtn");
    var titleEl = document.getElementById("pwaInstallTitle");
    var subEl = document.getElementById("pwaInstallSub");
    var banner = document.getElementById("pwaInstallBanner");

    var isPhone = window.matchMedia("(max-width: 767px)").matches ||
                  /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || "");

    function isStandalone() {
      return window.matchMedia("(display-mode: standalone)").matches ||
             window.matchMedia("(display-mode: fullscreen)").matches ||
             window.navigator.standalone === true;
    }

    function setSmartCopy() {
      if (isPhone) {
        if (titleEl) titleEl.textContent = "📱 Sakinisha SALES MANAGEMENT SYSTEM";
        if (subEl) subEl.textContent = "Fungua kama app kwenye simu yako.";
      } else {
        if (titleEl) titleEl.textContent = "💻 Install SALES MANAGEMENT SYSTEM";
        if (subEl) subEl.textContent = "Fungua SALES MANAGEMENT SYSTEM kama app kwenye PC yako.";
      }
    }

    function showBanner() {
      if (banner && !isStandalone()) banner.style.display = "flex";
    }

    function hideBanner() {
      if (banner) banner.style.display = "none";
    }


    // Single-file build: no external sw.js is required.
    // Chrome's native install prompt is used whenever beforeinstallprompt fires.

    setSmartCopy();

    // Chrome/Edge sends this event when the PWA is installable.
    // Keep the event object until the user clicks Install App.
    window.addEventListener("beforeinstallprompt", function(event) {
      event.preventDefault();
      deferredInstallPrompt = event;
      showBanner();
    });

    window.addEventListener("appinstalled", function() {
      deferredInstallPrompt = null;
      hideBanner();
    });

    if (installBtn) {
      installBtn.title = isPhone
        ? "Install SALES MANAGEMENT SYSTEM"
        : "Install SALES MANAGEMENT SYSTEM using Chrome's native install prompt";

      installBtn.addEventListener("click", async function() {
        if (!deferredInstallPrompt) {
          // No alert and no "Add to Home screen" fallback.
          // The native button is only actionable when Chrome provides the prompt.
          return;
        }

        try {
          await deferredInstallPrompt.prompt();
          await deferredInstallPrompt.userChoice;
        } catch (e) {
          // User cancelled or browser rejected the prompt.
        } finally {
          deferredInstallPrompt = null;
          hideBanner();
        }
      });
    }

    if (dismissBtn) {
      dismissBtn.addEventListener("click", hideBanner);
    }

    // Do not display a dead install button. If Chrome has not supplied
    // beforeinstallprompt yet, wait for the event instead.
    if (isStandalone()) hideBanner();
  });
</script>

/* ============================================================
   PROFESSIONAL EXCEL EXPORT (.xlsx)
   Badala ya CSV ghafi (maneno/JSON yanayojipanga hovyo),
   hii inatengeneza faili la Excel lenye column zilizopangwa,
   header ya rangi, tarehe zinazosomeka na currency format.
============================================================ */
const XLSX_HEADER_LABELS = {
  id:"ID", number:"Number", date:"Date", supplierId:"Supplier ID", supplierName:"Supplier",
  customerId:"Customer ID", customerName:"Customer", productId:"Product ID", name:"Name",
  purchaseId:"Purchase ID", createdBy:"Recorded By", createdAt:"Recorded On", updatedAt:"Updated On",
  paymentMethod:"Payment Method", paymentStatus:"Payment Status", dueDate:"Due Date",
  paidAmount:"Amount Paid", balance:"Balance", total:"Total", amount:"Amount",
  lineTotal:"Line Total", unitCost:"Unit Cost", costPrice:"Cost Price", sellingPrice:"Selling Price",
  totalSpent:"Total Spent", phone:"Phone Number", category:"Category", stock:"Stock",
  items:"Items", actorName:"Actor", actorUid:"Actor ID", referenceId:"Reference ID",
  status:"Status", qty:"Quantity", orders:"Orders", notes:"Notes"
};
function xlsxHeaderLabel(k){
  if(XLSX_HEADER_LABELS[k]) return XLSX_HEADER_LABELS[k];
  const spaced=String(k).replace(/([a-z0-9])([A-Z])/g,"$1 $2").replace(/_/g," ");
  return spaced.charAt(0).toUpperCase()+spaced.slice(1);
}
function xlsxIsMoneyKey(k){ return /amount|total|balance|price|cost|revenue|expense|spent|paid/i.test(k); }
function xlsxIsIdKey(k){ return /(^id$|Id$|uid$|Uid$)/.test(k); }
function xlsxReadableValue(k,v){
  if(v===null||v===undefined) return "";
  if(typeof v==="object"){
    if(typeof v.toDate==="function"){ try{ return v.toDate(); }catch(e){} }
    if(typeof v.seconds==="number"){ return new Date(v.seconds*1000); }
    if(Array.isArray(v)){
      return v.map(it=>(it&&typeof it==="object")?`${it.name||it.productName||"Item"} x${it.qty??""}`.trim():String(it)).join(", ");
    }
    return JSON.stringify(v);
  }
  if(typeof v==="string" && /^\d{4}-\d{2}-\d{2}$/.test(v)) return new Date(v+"T00:00:00");
  return v;
}
async function exportRowsXlsx(filename, rows, sheetTitle){
  if(!rows || !rows.length){ showToast("Hakuna data ya ku-export"); return; }
  if(typeof ExcelJS==="undefined"){ showToast("Excel engine haijapakia — angalia mtandao wako kisha jaribu tena."); return; }
  const keys=[...new Set(rows.flatMap(r=>Object.keys(r)))];
  const wb=new ExcelJS.Workbook();
  wb.creator="SALES MANAGEMENT SYSTEM"; wb.created=new Date();
  const ws=wb.addWorksheet((sheetTitle||"Export").slice(0,31),{views:[{state:"frozen",ySplit:1}]});
  ws.columns=keys.map(k=>({header:xlsxHeaderLabel(k),key:k,width:16}));
  rows.forEach(r=>{
    const rowObj={}; keys.forEach(k=>{ rowObj[k]=xlsxReadableValue(k,r[k]); });
    const row=ws.addRow(rowObj);
    keys.forEach((k,i)=>{
      const cell=row.getCell(i+1), val=rowObj[k];
      if(val instanceof Date){ cell.numberFmt = /Date$|^date$/.test(xlsxHeaderLabel(k))&&!(String(r[k]||"").length>10) ? "dd/mm/yyyy" : "dd/mm/yyyy hh:mm"; cell.alignment={horizontal:"left"}; }
      else if(typeof val==="number" && xlsxIsMoneyKey(k)){ cell.numberFmt='#,##0 "TZS";[Red]-#,##0 "TZS"'; cell.alignment={horizontal:"right"}; }
      else if(typeof val==="number"){ cell.alignment={horizontal:xlsxIsIdKey(k)?"left":"right"}; }
      else { cell.alignment={horizontal:"left"}; }
    });
  });
  const header=ws.getRow(1);
  header.eachCell(cell=>{
    cell.font={bold:true,color:{argb:"FFFFFFFF"},size:11};
    cell.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FF0F172A"}};
    cell.alignment={vertical:"middle",horizontal:"center",wrapText:true};
    cell.border={bottom:{style:"medium",color:{argb:"FFFBBF24"}}};
  });
  header.height=24;
  ws.eachRow((row,rowNumber)=>{
    if(rowNumber===1) return;
    row.eachCell({includeEmpty:true},cell=>{
      cell.border={bottom:{style:"thin",color:{argb:"FFE7E5E4"}}};
      if(rowNumber%2===0) cell.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFFAFAF9"}};
    });
    row.height=19;
  });
  if(keys.length>0) ws.autoFilter={from:{row:1,column:1},to:{row:1,column:keys.length}};
  ws.columns.forEach((col,idx)=>{
    const k=keys[idx]; let maxLen=xlsxHeaderLabel(k).length;
    rows.forEach(r=>{
      const v=xlsxReadableValue(k,r[k]);
      const len = v instanceof Date ? 16 : String(v??"").length;
      if(len>maxLen) maxLen=len;
    });
    col.width=Math.min(Math.max(maxLen+3,12),42);
  });
  try{
    const buf=await wb.xlsx.writeBuffer();
    const blob=new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  }catch(err){ showToast("Excel export imeshindikana: "+err.message); }
}

/* ============================================================
   AUTH FLOW
============================================================ */
async function fetchUserProfileWithRetry(uid, attempts=3){
  let lastErr = null;
  for(let i=0;i<attempts;i++){
    try{
      return await getDoc(doc(db,"Users",uid));
    }catch(e){
      lastErr = e;
      // Errors that are typically transient (blocked/interrupted request, offline,
      // ad-blocker/extension interference, slow network) — worth retrying instead
      // of immediately kicking the user back to the login screen.
      const code = (e && e.code) || "";
      const transient = code.includes("unavailable") || code.includes("deadline-exceeded")
        || code.includes("network-request-failed") || code.includes("internal")
        || code.includes("cancelled") || !navigator.onLine;
      if(!transient || i === attempts-1) throw e;
      await new Promise(r=>setTimeout(r, 1200*(i+1)));
    }
  }
  throw lastErr;
}

onAuthStateChanged(auth, async (fbUser) => {
  clearListeners();
  if(!fbUser){
    state.user = null; state.profile = null;
    state.globalThemeOverride = null;
    state.themeControlLoaded = false;
    state.localTheme = getSavedTheme();
    refreshEffectiveTheme();
    state.authReady = true;
    render();
    return;
  }
  state.user = fbUser;
  try{
    const snap = await fetchUserProfileWithRetry(fbUser.uid);
    if(!snap.exists()){
      state.loginError = "Akaunti hii haijasajiliwa kwenye mfumo. Wasiliana na Admin.";
      await signOut(auth);
      state.authReady = true; render();
      return;
    }
    const profile = snap.data();
    // Normalize to tolerate stray whitespace / autocapitalized letters from mobile keyboards
    profile.status = (profile.status || "").toString().trim().toLowerCase();
    const roleRaw = (profile.role || "").toString().trim().toLowerCase();
    const matchedRole = ROLES.find(r => r.toLowerCase() === roleRaw);
    if(matchedRole) profile.role = matchedRole;

    if(profile.status !== "active"){
      state.loginError = "Akaunti yako imezimwa. Wasiliana na Admin.";
      await signOut(auth);
      state.authReady = true; render();
      return;
    }
    if(!matchedRole){
      state.loginError = "Role ya akaunti yako si sahihi. Wasiliana na Admin.";
      await signOut(auth);
      state.authReady = true; render();
      return;
    }
    state.profile = profile;
    state.profileLoadError = "";
    state.tab = "dashboard";
    state.localTheme = getSavedTheme();
    state.globalThemeOverride = null;
    state.themeControlLoaded = false;
    refreshEffectiveTheme();
    state.authReady = true;
    startListeners();
    requestNotifyPermission();
    render();
  }catch(e){
    console.error(e);
    // Do NOT force-logout on network/connection errors — that was kicking users
    // back to the login screen after brief network hiccups. Keep the Firebase
    // session alive and let them retry loading their profile instead.
    state.profileLoadError = "Imeshindwa kupakia akaunti yako: " + (e.code || e.message || e) + ". Angalia mtandao wako kisha jaribu tena.";
    state.authReady = true; render();
  }
});
async function retryProfileLoad(){
  if(!state.user) return;
  state.profileLoadError = "";
  render();
  try{
    const snap = await fetchUserProfileWithRetry(state.user.uid, 1);
    if(snap.exists()){
      const profile = snap.data();
      profile.status = (profile.status || "").toString().trim().toLowerCase();
      const roleRaw = (profile.role || "").toString().trim().toLowerCase();
      const matchedRole = ROLES.find(r => r.toLowerCase() === roleRaw);
      if(matchedRole) profile.role = matchedRole;
      if(profile.status === "active" && matchedRole){
        state.profile = profile;
        state.tab = "dashboard";
        state.localTheme = getSavedTheme();
        state.globalThemeOverride = null;
        state.themeControlLoaded = false;
        refreshEffectiveTheme();
        startListeners();
        requestNotifyPermission();
      }
    }
  }catch(e){
    state.profileLoadError = "Imeshindwa tena: " + (e.code || e.message || e) + ". Angalia mtandao wako.";
  }
  render();
}

function startListeners(){
  unsubs.push(onSnapshot(collection(db,"products"), snap=>{
    state.products = snap.docs.map(d=>({id:d.id, ...d.data()}));
    checkLowStockNotifications(state.products);
    render();
  }));
  // Rules: suppliers read = Admin/Manager/Inventory only. Cashier must not subscribe.
  if(CAN_MANAGE_SUPPLIERS(state.profile.role)){
    unsubs.push(onSnapshot(collection(db,"suppliers"), snap=>{
      state.suppliers = snap.docs.map(d=>({id:d.id, ...d.data()}));
      render();
    }));
  }
  // Rules: shifts read = Admin/Manager/Cashier only. Inventory must not subscribe.
  // Firestore rules only allow a Cashier to read shifts where cashierUid == their own uid.
  // Because that condition depends on resource.data, an unfiltered collection(db,"shifts")
  // query is rejected outright for Cashiers (Firestore denies queries that COULD return
  // documents the caller isn't allowed to see) — so a Cashier's shifts list never populates
  // and endShift() looks successful (the direct doc update is allowed) while the "My Shift"
  // screen keeps showing the shift as open, because state.shifts was never refreshed at all.
  // Fix: Cashiers subscribe to a query scoped with where("cashierUid","==", their uid),
  // which matches the rule and is allowed; Admin/Manager keep the full collection.
  if(CAN_READ_SHIFTS(state.profile.role)){
    const shiftsQuery = state.profile.role === "Cashier"
      ? query(collection(db,"shifts"), where("cashierUid","==", state.user.uid))
      : collection(db,"shifts");
    unsubs.push(onSnapshot(shiftsQuery, snap=>{
      state.shifts = snap.docs.map(d=>({id:d.id, ...d.data()}));
      render();
    }, err=>{
      console.warn("Shifts listener error:", err);
      showToast("Imeshindwa kupakia shift: "+(err.message||err));
    }));
  }
  if(CAN_EXPENSES(state.profile.role)){
    unsubs.push(onSnapshot(query(collection(db,"expenses"), orderBy("createdAt","desc")), snap=>{
      state.expenses = snap.docs.map(d=>({id:d.id, ...d.data()})); render();
    }));
  }
  if(CAN_PURCHASE(state.profile.role)){
    unsubs.push(onSnapshot(query(collection(db,"purchases"), orderBy("createdAt","desc")), snap=>{
      state.purchases = snap.docs.map(d=>({id:d.id, ...d.data()})); render();
    }));
    unsubs.push(onSnapshot(query(collection(db,"stockMoves"), orderBy("createdAt","desc")), snap=>{
      state.stockMoves = snap.docs.map(d=>({id:d.id, ...d.data()})); render();
    }));
  }
  // Rules: customers read = Admin/Manager/Cashier only. Inventory must not subscribe.
  if(CAN_SEE_CUSTOMERS(state.profile.role)){
    unsubs.push(onSnapshot(collection(db,"customers"), snap=>{
      state.customers = snap.docs.map(d=>({id:d.id, ...d.data()}));
      if(!state.saleCustomerId && state.customers[0]) state.saleCustomerId = state.customers[0].id;
      render();
    }));
  }
  // Rules: Admin/Manager can read all sales; Cashier can read ONLY their own sales.
  // IMPORTANT: the Cashier query must include cashierUid == current UID so Firestore
  // can prove every returned document is allowed by the security rules.
  if(CAN_SELL(state.profile.role)){
    const salesQuery = state.profile.role === "Cashier"
      ? query(collection(db,"sales"), where("cashierUid","==",state.user.uid))
      : query(collection(db,"sales"), orderBy("createdAt","desc"));
    unsubs.push(onSnapshot(salesQuery, snap=>{
      state.sales = snap.docs.map(d=>({id:d.id, ...d.data()}));
      state.sales.sort((a,b)=>{
        const ta = a.createdAt?.seconds ? a.createdAt.seconds : 0;
        const tb = b.createdAt?.seconds ? b.createdAt.seconds : 0;
        return tb-ta || String(b.date||"").localeCompare(String(a.date||""));
      });
      render();
    }, err=>{
      console.error("Sales listener:",err);
      showToast("Imeshindikana kupakia mauzo yako: "+err.message);
    }));
  }
  // Rules: auditLog read = Admin OR Manager. Users list = Admin only (Manage Users).
  if(CAN_MANAGE_USERS(state.profile.role)){
    unsubs.push(onSnapshot(collection(db,"Users"), snap=>{
      state.users = snap.docs.map(d=>({id:d.id, ...d.data()}));
      render();
    }));
  }
  if(CAN_VIEW_USERS(state.profile.role)){
    unsubs.push(onSnapshot(query(collection(db,"auditLog"), orderBy("createdAt","desc")), snap=>{
      state.auditLog = snap.docs.map(d=>({id:d.id, ...d.data()}));
      render();
    }));
  }
}

/* ============================================================
   LOW STOCK BROWSER NOTIFICATIONS
============================================================ */
function requestNotifyPermission(){
  if(typeof Notification === "undefined") return;
  if(Notification.permission === "default") Notification.requestPermission();
}
function checkLowStockNotifications(products){
  if(typeof Notification === "undefined" || Notification.permission !== "granted") return;
  if(!state.profile || !CAN_EDIT_PRODUCTS(state.profile.role)) return;
  products.forEach(p=>{
    const isLow = (p.stock||0) <= (p.reorder||0);
    if(isLow && !notifiedLowStockIds.has(p.id)){
      notifiedLowStockIds.add(p.id);
      try{
        new Notification("Stock ndogo — "+p.name, {
          body: `Kimebaki ${p.stock} tu (reorder ${p.reorder}). Agiza tena.`,
          tag: "lowstock-"+p.id
        });
      }catch(e){ /* ignore notification errors */ }
    } else if(!isLow && notifiedLowStockIds.has(p.id)){
      notifiedLowStockIds.delete(p.id); // stock replenished — allow re-alert if it drops again
    }
  });
}

async function logAudit(action, details){
  try{
    await addDoc(collection(db,"auditLog"), {
      action, details,
      actorUid: state.user?.uid || "",
      actorName: state.profile?.name || "System",
      date: todayISO(),
      time: new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}),
      createdAt: serverTimestamp()
    });
  }catch(e){ console.error("Audit log failed", e); }
}

async function doLogin(email, password){
  state.loginError = "";
  try{
    await signInWithEmailAndPassword(auth, email, password);
  }catch(e){
    state.loginError = "Email au password si sahihi.";
    render();
  }
}
async function doLogout(){
  clearListeners();
  await signOut(auth);
  state = {...state, tab:"dashboard", products:[], customers:[], sales:[], users:[], expenses:[], purchases:[], stockMoves:[], cart:[], globalThemeOverride:null, themeControlLoaded:false};
}

function updateConnectionBadge(){
  const el=document.getElementById("connectionBadge");
  if(!el) return;
  const online=navigator.onLine;
  el.textContent=online ? (offlineEnabled ? "ONLINE • SYNC READY" : "ONLINE") : "OFFLINE • LOCAL QUEUE";
  el.className="connection-badge "+(online?"online":"offline");
}
window.addEventListener("online", updateConnectionBadge);

/* ============================================================
   AUTOMATIC HOLIDAY THEME ENGINE
   Active window: 1 day before the holiday through 2 days after.
   Date is evaluated in Tanzania time (Africa/Dar_es_Salaam).
============================================================ */
const AUTO_HOLIDAY_FIXED = [
  ["newyear","01-01"],
  ["revolution","01-12"],
  ["union","04-26"],
  ["labour","05-01"],
  ["sabasaba","07-07"],
  ["naneNane","08-08"],
  ["nyerere","10-14"],

  ["christmas","12-25"],
  ["boxing","12-26"]
];

/* Lunar holidays can move with moon sighting, so yearly dates are kept
   in a small calendar table and can be updated when official dates change. */
const AUTO_HOLIDAY_MOVABLE = {
  2026: [
    ["eidfitr","2026-03-20"],
    ["eidadha","2026-05-27"],
    ["maulid","2026-08-25"]
  ],
  2027: [
    ["eidfitr","2027-03-09"],
    ["eidadha","2027-05-17"],
    ["maulid","2027-08-14"]
  ]
};

function tzTodayISO(){
  try{
    return new Intl.DateTimeFormat("en-CA",{
      timeZone:"Africa/Dar_es_Salaam",
      year:"numeric",month:"2-digit",day:"2-digit"
    }).format(new Date());
  }catch(e){
    return new Date().toISOString().slice(0,10);
  }
}
function isoAddDays(iso,days){
  const d=new Date(iso+"T00:00:00Z");
  d.setUTCDate(d.getUTCDate()+days);
  return d.toISOString().slice(0,10);
}
function easterSundayISO(year){
  const a=year%19,b=Math.floor(year/100),c=year%100,d=Math.floor(b/4),e=b%4,
    f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
    h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,
    l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
    month=Math.floor((h+l-7*m+114)/31),day=((h+l-7*m+114)%31)+1;
  return `${year}-${String(month).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
}
function autoHolidayThemeForToday(){
  const today=tzTodayISO();
  const year=Number(today.slice(0,4));
  const candidates=[];

  AUTO_HOLIDAY_FIXED.forEach(([theme,md])=>{
    candidates.push({theme,date:`${year}-${md}`,priority:10});
  });
  (AUTO_HOLIDAY_MOVABLE[year]||[]).forEach(([theme,date])=>{
    candidates.push({theme,date,priority:20});
  });

  // Good Friday and Easter Monday use the Easter theme.
  const easter=easterSundayISO(year);
  candidates.push({theme:"easter",date:isoAddDays(easter,-2),priority:30});
  candidates.push({theme:"easter",date:isoAddDays(easter,1),priority:30});

  // Valentine is included as a festive theme using the same requested window.
  candidates.push({theme:"valentine",date:`${year}-02-14`,priority:5});

  const matches=candidates.filter(x=>{
    const start=isoAddDays(x.date,-1);
    const end=isoAddDays(x.date,2);
    return today>=start && today<=end;
  }).sort((a,b)=>b.priority-a.priority || a.date.localeCompare(b.date));

  return matches.length && HOLIDAY_IDS.has(matches[0].theme) ? matches[0].theme : null;
}

function effectiveTheme(){
  // Automatic holiday mode has priority during its configured window.
  const autoHoliday=autoHolidayThemeForToday();
  if(autoHoliday) return autoHoliday;

  // Administrator-selected holiday themes must actually become the active
  // visual theme for everyone, not only change the header/icon.
  if(state.globalThemeOverride && HOLIDAY_IDS.has(state.globalThemeOverride)){
    return state.globalThemeOverride;
  }

  // When no holiday is active, everyone returns to their saved normal theme.
  return state.localTheme || getSavedTheme();
}

function applyTheme(theme){
  const t=(theme === "light" || theme === "dark") ? "ocean" : (isValidTheme(theme) ? theme : "ocean");
  document.documentElement.setAttribute("data-theme",t);
  if(!HOLIDAY_IDS.has(t)){
    state.localTheme=t;
    localStorage.setItem(getThemeStorageKey(),t);
  }
  document.documentElement.setAttribute(
    "data-holiday-override",
    (autoHolidayThemeForToday() || (state.globalThemeOverride && HOLIDAY_IDS.has(state.globalThemeOverride))) ? "on" : "off"
  );
}

async function setGlobalHolidayTheme(theme){
  if(state.profile?.role!=="Administrator" || !HOLIDAY_IDS.has(theme)) return;
  try{
    await setDoc(doc(db,"settings","themeControl"),{
      active:true, theme,
      updatedBy:state.user.uid,
      updatedByName:state.profile.name,
      updatedAt:serverTimestamp()
    },{merge:true});
    state.globalThemeOverride=theme;
    state.themeControlLoaded=true;
    refreshEffectiveTheme();
    closeThemeChooser();
    showToast(`${themeInfo(theme).icon} ${themeInfo(theme).name} imewashwa kwa wafanyakazi wote.`);
    render();
  }catch(e){
    console.error("Global theme save failed:",e);
    showToast("Theme haijahifadhiwa: "+(e.message||e));
  }
}

}

            ? notices.map(n => `<button class="v15-notify-row ${n.level||"amber"}" data-v15-notify-tab="${escapeHtml(n.tab||"dashboard")}">
                <b>${escapeHtml(n.title||"Warning")}</b>
                <small>${escapeHtml(n.text||"")}</small>
              </button>`).join("")
            : `<div class="v15-empty">Hakuna warning kwa sasa 🎉</div>`;
          return `<div class="v15-notify-wrap" id="v15NotifyWrap">
            <button class="v15-notify-btn" id="v15NotifyBtn" type="button" aria-label="Warnings na notifications" title="Warnings & Notifications">
              ${ICONS.alert}
              ${count ? `<span>${count > 99 ? "99+" : count}</span>` : ""}
            </button>
            <div class="v15-notify-panel" id="v15NotifyPanel" role="dialog" aria-label="Warnings na notifications">
              <div class="v15-notify-head"><b>Warnings & Notifications</b><span>${count} ${count===1?"alert":"alerts"}</span></div>
              ${rows}
            </div>
          </div>`;
        })()}

        <div id="connectionBadge" class="connection-badge online">ONLINE</div>
      </div>
      <div class="view">${viewHtml}</div>
      ${renderMobileBottomNav(role)}
    </main>
  </div>
  <div id="modalRoot"></div>`;
}

function renderMobileBottomNav(role){
  const btn=(key,label,icon,active)=>`<button class="mobile-bottom-nav-item ${active?'active':''}" data-bottom-tab="${key}">${ICONS[icon]}<span>${label}</span></button>`;
  let items=[btn("dashboard","Home","dashboard",state.tab==="dashboard")];
  if(role==="Cashier"){
    items.push(btn("sale","New sale","sale",state.tab==="sale"));
    items.push(btn("history","Sales","history",state.tab==="history"));
  }else if(role==="Inventory"){
    items.push(btn("inventory","Stock","inventory",state.tab==="inventory"));
    items.push(btn("purchases","Purchases","truck",state.tab==="purchases"));
  }else{
    items.push(btn("sale","New sale","sale",state.tab==="sale"));
    items.push(btn("history","Sales","history",state.tab==="history"));
  }
  items.push(`<button class="mobile-bottom-nav-item" id="bottomNavMore">${ICONS.menu || `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>`}<span>More</span></button>`);
  return `<nav class="mobile-bottom-nav">${items.join("")}</nav>`;
}

function bindAppEvents(){
  document.querySelectorAll(".nav-item").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.tab = btn.dataset.tab;
      state.cart=[];
      state.discountType="none";
      state.discountValue="";
      render();
    });
  });

  const logoutBtn = document.getElementById("logoutBtn");
  if(logoutBtn) logoutBtn.addEventListener("click", async ()=>{ await doLogout(); render(); });

  const dashNewSaleBtn = document.getElementById("dashNewSaleBtn");
  if(dashNewSaleBtn) dashNewSaleBtn.addEventListener("click", ()=>{ state.tab="sale"; render(); });

  const tickerViewAllBtn = document.getElementById("tickerViewAllBtn");
  if(tickerViewAllBtn) tickerViewAllBtn.addEventListener("click", ()=>{ state.tab="history"; render(); });

  const themeToggle = document.getElementById("themeToggle");
  if(themeToggle) themeToggle.addEventListener("click", toggleTheme);

  // Mobile hamburger: expand/collapse the existing sidebar.
  const mobileToggle = document.getElementById("mobileMenuToggle");
  const sidebar = document.querySelector(".sidebar");
  if(mobileToggle && sidebar){
    mobileToggle.addEventListener("click", ()=>{
      sidebar.classList.toggle("expanded");
    });
  }

  // Mobile bottom nav bar
  document.querySelectorAll(".mobile-bottom-nav-item[data-bottom-tab]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.tab = btn.dataset.bottomTab;
      state.cart=[];
      state.discountType="none";
      state.discountValue="";
      render();
    });
  });
  const bottomNavMore = document.getElementById("bottomNavMore");
  if(bottomNavMore && sidebar){
    bottomNavMore.addEventListener("click", ()=>{
      sidebar.classList.toggle("expanded");
    });
  }

  bindViewEvents();
}

function showToast(msg){
  const root = document.getElementById("toastRoot");
  if(!root) return;
  root.innerHTML = `<div class="toast">${escapeHtml(msg)}</div>`;
  setTimeout(()=>{ if(root) root.innerHTML=""; }, 2400);
}

function renderLineChart(data){
  const w=560,h=210,padL=42,padB=22,padT=10,padR=8;
  const target = Number(state.businessTarget)||0;
  // Include today's target in the scale so the target line is always visible.
  const max = Math.max(1, ...data.map(d=>Number(d.revenue)||0), target);
  const stepX = (w-padL-padR)/(data.length-1||1);
  const plotH = h-padT-padB;
  const points = data.map((d,i)=>({x:padL+i*stepX, y:padT+plotH*(1-(Number(d.revenue)||0)/max), ...d}));
  const path = points.map((p,i)=>(i===0?"M":"L")+p.x.toFixed(1)+" "+p.y.toFixed(1)).join(" ");
  const gridY=[0,0.5,1].map(f=>padT+plotH*f);
  const targetY = target>0 ? padT+plotH*(1-target/max) : null;
  const targetMarkup = targetY===null ? "" : `
        <line class="chart-target-line" x1="${padL}" y1="${targetY}" x2="${w-padR}" y2="${targetY}" stroke="var(--green,#16a34a)" stroke-width="1.8" stroke-opacity=".78"/>
        <rect x="${w-padR-66}" y="${Math.max(2,targetY-11)}" width="62" height="17" rx="8.5" fill="var(--surface)" stroke="var(--green,#16a34a)" stroke-opacity=".35"/>
        <text class="chart-target-label" x="${w-padR-35}" y="${Math.max(13,targetY+1)}" font-size="8.5" fill="var(--green,#16a34a)" text-anchor="middle">TARGET ${fmt(target).replace('TZS ','')}</text>`;
  return `<div class="chart-stage" id="revenueChartStage">
    <button type="button" class="chart-replay-btn" id="replayRevenueChart">▶ Play animation</button>
    <svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-label="Revenue chart ya siku 14">
      ${gridY.map(y=>`<line class="chart-grid" x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="currentColor" stroke-opacity=".12" stroke-width="1"/>`).join("")}
      ${targetMarkup}
      <path class="chart-line-glow" d="${path}" fill="none" stroke="var(--accent)" stroke-opacity=".16" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="chart-line" d="${path}" fill="none" stroke="var(--accent)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      ${points.map((p,i)=>`<circle class="chart-point-ring" cx="${p.x}" cy="${p.y}" r="8" fill="none" stroke="var(--accent)" stroke-width="1.6" style="animation-delay:${350+i*145}ms"></circle><circle class="chart-point" cx="${p.x}" cy="${p.y}" r="3.4" fill="var(--accent)" style="animation-delay:${350+i*145}ms"><title>${p.date}: ${fmt(p.revenue)}${target>0 ? ` • Target ${fmt(target)}` : ""}</title></circle>`).join("")}
      ${points.map((p,i)=> i%2===0 ? `<text x="${p.x}" y="${h-4}" font-size="8.5" fill="currentColor" opacity=".62" text-anchor="middle">${p.date}</text>` : "").join("")}
      <text x="${padL-6}" y="${padT+6}" font-size="8.5" fill="currentColor" opacity=".62" text-anchor="end">${fmt(max).replace('TZS ','')}</text>
      <text x="${padL-6}" y="${h-padB}" font-size="8.5" fill="currentColor" opacity=".62" text-anchor="end">0</text>
    </svg>
  </div>`;
}

/* ============================================================
   MY SHIFT (Shift Reconciliation)
============================================================ */
function currentOpenShift(){
  return state.shifts.find(s=> s.cashierUid===state.user.uid && s.status==="open");
}
function salesDuringShift(shift){
  if(!shift) return [];
  const start = new Date(shift.startTime).getTime();
  const end = shift.endTime ? new Date(shift.endTime).getTime() : Date.now();
  return state.sales.filter(s=>{
    if(s.cashierUid!==shift.cashierUid || s.status==="refunded") return false;
    const t = s.createdAt && s.createdAt.toDate ? s.createdAt.toDate().getTime() : new Date(s.date+"T"+s.time).getTime();
    return t>=start && t<=end;
  });
}
function renderMyShift(){
  const shift = currentOpenShift();
  if(!shift){
    const lastClosed = state.shifts.filter(s=>s.cashierUid===state.user.uid && s.status==="closed").sort((a,b)=> new Date(b.endTime)-new Date(a.endTime))[0];
    return `
      <div class="view-header"><div><h1>My Shift</h1><p>Anza shift yako kabla ya kuanza kuuza.</p></div></div>
      <div class="card" style="max-width:420px;">
        <h2>Anza Shift Mpya</h2>
        <div class="field"><label>Fedha taslimu mfukoni (Starting Cash)</label>
          <input type="number" min="0" id="startCashInput" placeholder="0" value="${escapeHtml(state.shiftStartCash)}"/></div>
        <button class="btn btn-amber btn-block" id="startShiftBtn">${ICONS.clock} Anza Shift</button>
      </div>
      ${lastClosed ? `
      <div class="card" style="max-width:420px;margin-top:16px;">
        <h2>Shift ya Mwisho</h2>
        <div class="subtotal-row"><span>Ilifungwa</span><span>${new Date(lastClosed.endTime).toLocaleString("en-GB")}</span></div>
        <div class="subtotal-row"><span>Tofauti (Difference)</span><span class="mono" style="color:${Math.abs(lastClosed.difference)<1?'var(--green)':'var(--red)'};">${fmt(lastClosed.difference)}</span></div>
      </div>` : ""}
    `;
  }
  const mySales = salesDuringShift(shift);
  const cashSales = mySales.filter(s=>s.paymentMethod==="Cash").reduce((sum,s)=>sum+s.total,0);
  const otherSales = mySales.reduce((sum,s)=>sum+s.total,0) - cashSales;
  const expectedCash = (shift.startCash||0) + cashSales;
  return `

============================================================ */
function computeSaleLines(){
  const lines = state.cart.map(c=>{
    const p = state.products.find(x=>x.id===c.productId);
    return {...c, product:p, lineTotal: p.price*c.qty};
  });
  const subtotal = lines.reduce((s,l)=>s+l.lineTotal,0);
  let discountAmount = 0;
  if(state.discountType==="percent"){
    const pct = Math.min(100, Math.max(0, Number(state.discountValue)||0));
    discountAmount = subtotal * pct/100;
  } else if(state.discountType==="amount"){
    discountAmount = Math.min(subtotal, Math.max(0, Number(state.discountValue)||0));
  }
  const total = Math.max(0, subtotal - discountAmount);
  return {lines, subtotal, discountAmount, total};
}

function updateDiscountPreview(){
  const {subtotal, discountAmount, total} = computeSaleLines();
  const totalEl = document.querySelector(".cart-total-val");
  if(totalEl) totalEl.textContent = fmt(total);
  const discountRows = document.querySelectorAll(".subtotal-row");
  if(discountRows.length >= 2){
    discountRows[0].querySelector(".mono").textContent = fmt(subtotal);
    discountRows[1].querySelector(".mono").textContent = "−" + fmt(discountAmount);
  }
  const paid = Number(state.amountPaid)||0;
  const changeEl = document.getElementById("changePreview");
  if(changeEl) changeEl.textContent = fmt(Math.max(0, paid-total));
}

/* ============================================================
   MONTHLY REPORT
============================================================ */
function renderReport(){
  const [y,m] = state.reportMonth.split("-").map(Number);
  const prevDate = new Date(y, m-2, 1);
  const prevKey = `${prevDate.getFullYear()}-${String(prevDate.getMonth()+1).padStart(2,"0")}`;

  const salesThis = state.sales.filter(s=>monthKey(s.date)===state.reportMonth);
  const salesPrev = state.sales.filter(s=>monthKey(s.date)===prevKey);

  const calc = (list)=>{
    let revenue=0, cogs=0;
    const productTotals = {};
    list.forEach(s=>{
      revenue += s.total;
      s.items.forEach(it=>{
        const cost = (it.cost||0)*it.qty;
        cogs += cost;
        productTotals[it.name] = (productTotals[it.name]||0) + it.lineTotal;
      });
    });
    const profit = revenue - cogs;
    return {revenue, cogs, profit, productTotals};
  };
  const cur = calc(salesThis);
  const prev = calc(salesPrev);

  const pctChange = (a,b)=> b===0 ? (a===0?0:100) : ((a-b)/b*100);
  const revChange = pctChange(cur.revenue, prev.revenue);
  const profitChange = pctChange(cur.profit, prev.profit);

  const topProducts = Object.entries(cur.productTotals).sort((a,b)=>b[1]-a[1]).slice(0,5);

  const monthOptions = [...Array(12)].map((_,i)=>{
    const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()-i);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
    const label = d.toLocaleDateString("en-GB",{month:"long", year:"numeric"});
    return `<option value="${key}" ${key===state.reportMonth?"selected":""}>${label}</option>`;
  }).join("");

  const trendBadge = (val)=> val>=0
    ? `<span class="kpi-sub up">▲ ${val.toFixed(1)}% vs last month</span>`
    : `<span class="kpi-sub down">▼ ${Math.abs(val).toFixed(1)}% vs last month</span>`;

  return `
    <div class="view-header">
      <div><h1>Monthly Report</h1><p>Faida na mauzo kwa mwezi uliochaguliwa.</p></div>
      <select id="reportMonthSelect" style="max-width:200px;">${monthOptions}</select>
    </div>
    <div class="kpi-grid">
      <div class="kpi-card"><div class="kpi-top"><span class="kpi-label">Revenue</span><div class="kpi-icon green">${ICONS.trend}</div></div><div class="kpi-value">${fmt(cur.revenue)}</div>${trendBadge(revChange)}</div>
      <div class="kpi-card"><div class="kpi-top"><span class="kpi-label">Cost of Goods</span><div class="kpi-icon slate">${ICONS.inventory}</div></div><div class="kpi-value">${fmt(cur.cogs)}</div></div>
      <div class="kpi-card"><div class="kpi-top"><span class="kpi-label">Net Profit</span><div class="kpi-icon amber">${ICONS.profit}</div></div><div class="kpi-value">${fmt(cur.profit)}</div>${trendBadge(profitChange)}</div>
      <div class="kpi-card"><div class="kpi-top"><span class="kpi-label">Sales Count</span><div class="kpi-icon slate">${ICONS.receipt}</div></div><div class="kpi-value">${salesThis.length}</div></div>
    </div>
    <div class="card">
      <h2>Bidhaa zinazouza zaidi (mwezi huu)</h2>
      ${topProducts.length===0 ? `<p class="empty-note">Hakuna mauzo mwezi huu.</p>` :
        `<table><tbody>${topProducts.map(([name,total])=>`<tr><td>${escapeHtml(name)}</td><td class="right mono">${fmt(total)}</td></tr>`).join("")}</tbody></table>`}
    </div>
  `;
}

function chatTime(ts){
  try{
    const d=ts?.toDate ? ts.toDate() : new Date(ts||Date.now());
    return d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
  }catch(e){ return ""; }
}

function chatMessageTimestamp(m){
  return m.createdAt || m.clientCreatedAt || Date.now();
}


function cancelChatReply(){
  state.chatReplyTo=null;
  render();
  requestAnimationFrame(()=>document.getElementById("staffChatInput")?.focus());
}

function chooseChatReply(messageId){
  const m=state.chatMessages.find(x=>x.id===messageId);
  if(!m) return;
  state.chatReplyTo={
    messageId:m.id,
    senderUid:m.senderUid||"",
    senderName:m.senderName||"Staff",
    text:String(m.text||"").slice(0,2000)
  };
  render();
  requestAnimationFrame(()=>{
    const input=document.getElementById("staffChatInput");
    input?.focus();
  });
}

      </div>
      ${state.chatReplyTo ? `<div class="chat-reply-compose">
        <div><strong>Unamjibu ${escapeHtml(state.chatReplyTo.senderName)}</strong><div>${escapeHtml(state.chatReplyTo.text||"Ujumbe")}</div></div>
        <button id="cancelChatReply" title="Futa reply">×</button>
      </div>` : ""}
      <div class="chat-compose">
        <textarea id="staffChatInput" maxlength="2000" placeholder="Andika ujumbe...">${escapeHtml(state.chatText||"")}</textarea>
        <button class="chat-action send" id="staffSendBtn" title="Tuma">➤</button>
      </div>
    </div>`;
}

async function sendStaffChatText(){
  const input=document.getElementById("staffChatInput");
  const text=String(input?.value||state.chatText||"").trim();
  if(!text) return;
  if(text.length>2000){showToast("Ujumbe ni mrefu sana. Maximum ni characters 2,000.");return;}
  try{
    const now=Date.now();
    const payload={
      type:"text", text,
      senderUid:state.user.uid,
      senderName:state.profile.name||"Staff",
      senderRole:state.profile.role||"",
      clientCreatedAt:now,
      createdAt:serverTimestamp()
    };
    if(state.chatReplyTo){
      payload.replyToMessageId=state.chatReplyTo.messageId;
      payload.replyToSenderUid=state.chatReplyTo.senderUid;
      payload.replyToSenderName=state.chatReplyTo.senderName;
      payload.replyToText=state.chatReplyTo.text;
    }
    const sentRef = await addDoc(collection(db,"staffChat"),payload);

    // The Firestore listener will normally render this again from the server.
    // Keeping a temporary local copy prevents the message from visually
    // disappearing during the short serverTimestamp/snapshot round-trip.
    state.chatMessages = [
      ...state.chatMessages,
      {id:sentRef.id, ...payload}
    ].filter(m=>m.type==="text").slice(-200);

    state.chatText="";
    state.chatReplyTo=null;
    render();
    scrollStaffChatToBottom();
  }catch(e){
    console.error("sendStaffChatText:", e);
    showToast("Ujumbe haukutumwa: " + (e.message||e));
  }
}

function scrollStaffChatToBottom(){
  requestAnimationFrame(()=>{
    const el=document.getElementById("staffChatMessages");
    if(el) el.scrollTop=el.scrollHeight;
  });
}

async function startShift(){

    showToast("Una shift ambayo bado iko wazi.");

  }
  const startCash = Number(state.shiftStartCash)||0;
