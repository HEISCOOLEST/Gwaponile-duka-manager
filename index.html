<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Duka Manager — Sales &amp; Inventory</title>
<style>
  :root{
    --ink:#0f172a; --ink-2:#1e293b; --paper:#fafaf9; --paper-line:#e7e5e4;
    --muted:#78716c; --amber:#fbbf24; --amber-dark:#d97706; --red:#dc2626; --green:#059669;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--paper);color:var(--ink);}
  .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;}
  a{color:inherit;}
  button{font-family:inherit;}

  /* ===== Login screen ===== */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink);padding:20px;}
  .login-card{background:#fff;border-radius:12px;padding:32px 28px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,0.3);}
  .login-logo{width:44px;height:44px;border-radius:10px;background:var(--amber);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
  .login-logo svg{width:22px;height:22px;color:var(--ink);}
  .login-title{text-align:center;font-size:18px;font-weight:800;margin:0 0 4px;}
  .login-sub{text-align:center;font-size:12.5px;color:var(--muted);margin:0 0 22px;}
  .login-error{background:#fef2f2;color:var(--red);font-size:12.5px;padding:9px 12px;border-radius:7px;margin-bottom:14px;display:none;}
  .login-loading{text-align:center;color:var(--muted);font-size:13px;padding:60px 0;}

  /* ===== layout ===== */
  .app{display:flex;min-height:100vh;}
  .sidebar{width:230px;flex-shrink:0;background:var(--ink);display:flex;flex-direction:column;min-height:100vh;}
  .sidebar-head{padding:18px 20px;border-bottom:1px solid #1e293b;display:flex;align-items:center;gap:10px;}
  .logo-badge{width:32px;height:32px;border-radius:7px;background:var(--amber);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .logo-badge svg{width:16px;height:16px;color:var(--ink);}
  .brand-name{color:#fff;font-weight:700;font-size:14px;line-height:1.2;letter-spacing:-0.01em;}
  .brand-sub{color:#64748b;font-size:10px;font-family:monospace;}
  nav.sidebar-nav{flex:1;padding:14px 12px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;}
  .nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;border:none;background:none;border-radius:7px;color:#cbd5e1;font-size:13.5px;font-weight:500;cursor:pointer;text-align:left;}
  .nav-item svg{width:17px;height:17px;flex-shrink:0;}
  .nav-item:hover{background:#1e293b;color:#fff;}
  .nav-item.active{background:var(--amber);color:var(--ink);}
  .nav-badge{margin-left:auto;font-size:10.5px;font-family:monospace;padding:2px 6px;border-radius:5px;background:rgba(220,38,38,0.2);color:#fca5a5;}
  .nav-item.active .nav-badge{background:var(--ink);color:#fbbf24;}
  .sidebar-foot{padding:14px 20px;border-top:1px solid #1e293b;}
  .user-chip{display:flex;align-items:center;gap:9px;margin-bottom:10px;}
  .user-avatar{width:28px;height:28px;border-radius:50%;background:#334155;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;flex-shrink:0;}
  .user-name{color:#fff;font-size:12.5px;font-weight:600;line-height:1.2;}
  .user-role{color:#64748b;font-size:10.5px;}
  .logout-btn{width:100%;background:#1e293b;color:#cbd5e1;border:none;border-radius:6px;padding:7px;font-size:12px;cursor:pointer;}
  .logout-btn:hover{background:#334155;color:#fff;}

  main{flex:1;min-height:100vh;}
  .view{padding:24px;max-width:1100px;}
  .view-header{margin-bottom:22px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .view-header h1{font-size:20px;font-weight:700;margin:0 0 3px;}
  .view-header p{font-size:13px;color:var(--muted);margin:0;}

  .btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:7px;font-size:13.5px;font-weight:600;padding:9px 15px;cursor:pointer;}
  .btn svg{width:15px;height:15px;}
  .btn-dark{background:var(--ink);color:#fff;}
  .btn-dark:hover{background:var(--ink-2);}
  .btn-amber{background:var(--amber);color:var(--ink);}
  .btn-amber:hover{background:#f59e0b;}
  .btn-amber:disabled{background:#e7e5e4;color:#a8a29e;cursor:not-allowed;}
  .btn-block{width:100%;justify-content:center;}
  .btn-outline{background:#fff;border:1px solid #d6d3d1;color:var(--ink);}
  .btn-outline:hover{background:#f5f5f4;}
  .icon-btn{background:none;border:none;cursor:pointer;color:#a8a29e;padding:2px;display:inline-flex;}
  .icon-btn:hover{color:var(--ink);}
  .icon-btn.danger:hover{color:var(--red);}
  .icon-btn svg{width:15px;height:15px;}

  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px;}
  @media(max-width:820px){.kpi-grid{grid-template-columns:repeat(2,1fr);}}
  .kpi-card{background:#fff;border:1px solid var(--paper-line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;text-align:left;}
  .kpi-top{display:flex;align-items:center;justify-content:space-between;}
  .kpi-label{font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);font-weight:700;}
  .kpi-icon{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;}
  .kpi-icon svg{width:14px;height:14px;}
  .kpi-icon.slate{background:#f1f5f9;color:var(--ink);}
  .kpi-icon.green{background:#ecfdf5;color:var(--green);}
  .kpi-icon.amber{background:#fffbeb;color:#b45309;}
  .kpi-icon.red{background:#fef2f2;color:var(--red);}
  .kpi-value{font-family:monospace;font-size:22px;font-weight:700;line-height:1;}
  .kpi-sub{font-size:11.5px;color:var(--muted);}
  .kpi-sub.up{color:var(--green);}
  .kpi-sub.down{color:var(--red);}

  .grid-2{display:grid;grid-template-columns:2fr 1fr;gap:16px;}
  @media(max-width:900px){.grid-2{grid-template-columns:1fr;}}
  .card{background:#fff;border:1px solid var(--paper-line);border-radius:10px;padding:16px;}
  .card h2{font-size:13.5px;font-weight:700;margin:0 0 12px;}

  .ticker{background:var(--ink);border-radius:10px;padding:16px;color:#e2e8f0;}
  .ticker h2{color:#fff;font-size:13.5px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:7px;}
  .ticker h2 svg{width:15px;height:15px;color:var(--amber);}
  .ticker-list{font-family:monospace;font-size:11.5px;display:flex;flex-direction:column;gap:9px;max-height:230px;overflow-y:auto;}
  .ticker-row{border-bottom:1px dashed #334155;padding-bottom:8px;}
  .ticker-row-top{display:flex;justify-content:space-between;color:#64748b;margin-bottom:2px;}
  .ticker-row-bottom{display:flex;justify-content:space-between;}
  .ticker-name{color:#cbd5e1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px;}
  .ticker-amt{color:var(--amber);font-weight:700;}
  .empty-note{color:#64748b;font-size:12px;}

  .search-wrap{position:relative;max-width:280px;margin-bottom:14px;}
  .search-wrap svg{position:absolute;left:10px;top:9px;width:15px;height:15px;color:#a8a29e;}
  input,select,textarea{border:1px solid #d6d3d1;border-radius:7px;padding:8px 12px;font-size:13.5px;font-family:inherit;width:100%;outline:none;background:#fff;color:var(--ink);}
  input:focus,select:focus{border-color:var(--amber);box-shadow:0 0 0 2px rgba(251,191,36,0.35);}
  .search-wrap input{padding-left:32px;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff;}
  .table-card{background:#fff;border:1px solid var(--paper-line);border-radius:10px;overflow:hidden;overflow-x:auto;}
  thead{background:#fafaf9;}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:0.04em;color:var(--muted);font-weight:700;padding:10px 14px;white-space:nowrap;}
  th.right,td.right{text-align:right;}
  tbody tr{border-top:1px solid #f5f5f4;}
  tbody tr:hover{background:#fafaf9;}
  td{padding:10px 14px;vertical-align:middle;}
  .cell-title{font-weight:600;}
  .cell-sub{font-size:11px;color:#a8a29e;font-family:monospace;}
  .pill-low{background:#fef2f2;color:var(--red);padding:1px 7px;border-radius:6px;font-family:monospace;}
  .pill-role{padding:2px 8px;border-radius:5px;font-size:11px;font-weight:700;}
  .pill-Administrator{background:#fef2f2;color:#b91c1c;}
  .pill-Manager{background:#eff6ff;color:#1d4ed8;}
  .pill-Cashier{background:#f0fdf4;color:#15803d;}
  .pill-Inventory{background:#fffbeb;color:#b45309;}
  .pill-disabled{background:#f5f5f4;color:#a8a29e;}
  .empty-row td{text-align:center;color:#a8a29e;padding:34px;font-size:13px;}
  .row-actions{display:flex;justify-content:flex-end;gap:8px;}
  tr.clickable{cursor:pointer;}

  .modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,0.5);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;}
  .modal{background:#fff;border-radius:10px;box-shadow:0 20px 50px rgba(0,0,0,0.25);width:100%;max-width:440px;max-height:85vh;overflow-y:auto;}
  .modal.wide{max-width:680px;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--paper-line);position:sticky;top:0;background:#fff;}
  .modal-head h3{margin:0;font-size:14.5px;font-weight:700;}
  .modal-body{padding:20px;}
  .field{display:block;margin-bottom:12px;}
  .field label{display:block;font-size:11.5px;font-weight:700;color:#57534e;margin-bottom:5px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .field-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:11px 18px;border-radius:8px;box-shadow:0 10px 25px rgba(0,0,0,0.2);z-index:80;max-width:90vw;text-align:center;}

  .sale-grid{display:grid;grid-template-columns:2fr 1fr;gap:18px;}
  @media(max-width:900px){.sale-grid{grid-template-columns:1fr;}}
  .product-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  @media(max-width:640px){.product-grid{grid-template-columns:repeat(2,1fr);}}
  .product-tile{text-align:left;background:#fff;border:1px solid var(--paper-line);border-radius:8px;padding:11px;cursor:pointer;}
  .product-tile:hover{border-color:var(--amber);box-shadow:0 2px 8px rgba(0,0,0,0.06);}
  .product-tile .pt-name{font-size:13px;font-weight:600;line-height:1.25;}
  .product-tile .pt-stock{font-size:11px;color:#a8a29e;font-family:monospace;margin-top:4px;}
  .product-tile .pt-price{font-family:monospace;font-size:13px;font-weight:700;color:var(--amber-dark);margin-top:4px;}

  .cart-panel{background:#fff;border:1px solid var(--paper-line);border-radius:10px;padding:16px;position:sticky;top:16px;height:fit-content;}
  .cart-title{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700;margin:14px 0 8px;}
  .cart-title svg{width:15px;height:15px;}
  .cart-list{max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;margin-bottom:10px;padding-right:2px;}
  .cart-row{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #f5f5f4;padding-bottom:9px;font-size:13px;}
  .cart-row-name{font-weight:600;color:#292524;line-height:1.2;}
  .qty-ctrl{display:flex;align-items:center;gap:6px;margin-top:6px;}
  .qty-btn{width:20px;height:20px;border-radius:5px;background:#f5f5f4;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .qty-btn svg{width:11px;height:11px;}
  .qty-val{font-family:monospace;font-size:12px;width:18px;text-align:center;}
  .discount-box{border-top:1px solid var(--paper-line);padding-top:10px;margin-bottom:10px;}
  .discount-row{display:flex;gap:8px;}
  .discount-row select{flex:0 0 74px;}
  .subtotal-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);padding:3px 0;}
  .cart-total-row{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--paper-line);padding-top:10px;margin-bottom:12px;}
  .cart-total-label{font-size:13.5px;font-weight:700;}
  .cart-total-val{font-family:monospace;font-size:19px;font-weight:800;}

  .chart-wrap{height:230px;}
  svg.chart{width:100%;height:100%;}

  .receipt{font-family:monospace;font-size:13px;}
  .receipt-head{text-align:center;margin-bottom:12px;padding-bottom:12px;border-bottom:1px dashed #d6d3d1;}
  .receipt-head .rname{font-weight:700;}
  .receipt-head .rmeta{font-size:11px;color:var(--muted);}
  .receipt-items{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
  .receipt-item{display:flex;justify-content:space-between;font-size:12px;}
  .receipt-sub{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding-top:6px;border-top:1px dashed #d6d3d1;}
  .receipt-total{display:flex;justify-content:space-between;border-top:1px dashed #d6d3d1;padding-top:8px;font-weight:800;margin-top:4px;}
  .receipt-thanks{text-align:center;font-size:10.5px;color:#a8a29e;margin-top:16px;}

  .locked-note{background:#fffbeb;border:1px solid #fde68a;color:#92400e;font-size:12.5px;padding:10px 13px;border-radius:8px;margin-bottom:16px;}

  .support-card{background:#fff;border:1px solid var(--paper-line);border-radius:10px;padding:16px;display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);margin-bottom:10px;}
  .support-card:hover{border-color:var(--amber);}
  .support-icon{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .support-icon svg{width:18px;height:18px;}
  .support-title{font-size:13.5px;font-weight:700;}
  .support-sub{font-size:12px;color:var(--muted);}

  .role-toggle{display:flex;gap:6px;margin-bottom:14px;}
  .role-chip{padding:6px 12px;border-radius:16px;font-size:12px;font-weight:600;border:1px solid var(--paper-line);background:#fff;cursor:pointer;}
  .role-chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}

  .spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>

  .logo-badge{

    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .logo-badge svg{width:16px;height:16px;color:var(--ink);}
  .brand-name{color:#fff;font-weight:700;font-size:14px;line-height:1.2;letter-spacing:-0.01em;}
  .brand-sub{color:#64748b;font-size:10px;font-family:monospace;}
  nav.sidebar-nav{flex:1;padding:14px 12px;display:flex;flex-direction:column;gap:4px;}
  .nav-item{
    display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;
    border:none;background:none;border-radius:7px;color:#cbd5e1;font-size:13.5px;
    font-weight:500;cursor:pointer;text-align:left;font-family:inherit;
  }
  .nav-item svg{width:17px;height:17px;flex-shrink:0;}
  .nav-item:hover{background:#1e293b;color:#fff;}
  .nav-item.active{background:var(--amber);color:var(--ink);}
  .nav-badge{
    margin-left:auto;font-size:10.5px;font-family:monospace;padding:2px 6px;border-radius:5px;
    background:rgba(220,38,38,0.2);color:#fca5a5;
  }
  .nav-item.active .nav-badge{background:var(--ink);color:#fbbf24;}
  .sidebar-foot{padding:14px 20px;border-top:1px solid #1e293b;color:#64748b;font-size:10.5px;font-family:monospace;}

  main{flex:1;min-height:100vh;}
  .view{padding:24px;max-width:1100px;}
  .view-header{margin-bottom:22px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .view-header h1{font-size:20px;font-weight:700;margin:0 0 3px;color:var(--ink);}
  .view-header p{font-size:13px;color:var(--muted);margin:0;}

  .btn{
    display:inline-flex;align-items:center;gap:6px;border:none;border-radius:7px;
    font-size:13.5px;font-weight:600;padding:9px 15px;cursor:pointer;font-family:inherit;
  }
  .btn svg{width:15px;height:15px;}
  .btn-dark{background:var(--ink);color:#fff;}
  .btn-dark:hover{background:var(--ink-2);}
  .btn-amber{background:var(--amber);color:var(--ink);}
  .btn-amber:hover{background:#f59e0b;}
  .btn-amber:disabled{background:#e7e5e4;color:#a8a29e;cursor:not-allowed;}
  .btn-block{width:100%;justify-content:center;}
  .icon-btn{background:none;border:none;cursor:pointer;color:#a8a29e;padding:2px;display:inline-flex;}
  .icon-btn:hover{color:var(--ink);}
  .icon-btn.danger:hover{color:var(--red);}
  .icon-btn svg{width:15px;height:15px;}

  /* kpi cards */
  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px;}
  @media(max-width:820px){.kpi-grid{grid-template-columns:repeat(2,1fr);}}
  .kpi-card{
    background:#fff;border:1px solid var(--paper-line);border-radius:10px;padding:14px;
    display:flex;flex-direction:column;gap:8px;text-align:left;cursor:default;font-family:inherit;
  }
  .kpi-top{display:flex;align-items:center;justify-content:space-between;}
  .kpi-label{font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);font-weight:700;}
  .kpi-icon{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;}
  .kpi-icon svg{width:14px;height:14px;}
  .kpi-icon.slate{background:#f1f5f9;color:var(--ink);}
  .kpi-icon.green{background:#ecfdf5;color:var(--green);}
  .kpi-icon.amber{background:#fffbeb;color:#b45309;}
  .kpi-icon.red{background:#fef2f2;color:var(--red);}
  .kpi-value{font-family:monospace;font-size:22px;font-weight:700;color:var(--ink);line-height:1;}
  .kpi-sub{font-size:11.5px;color:var(--muted);}

  .grid-2{display:grid;grid-template-columns:2fr 1fr;gap:16px;}
  @media(max-width:900px){.grid-2{grid-template-columns:1fr;}}
  .card{background:#fff;border:1px solid var(--paper-line);border-radius:10px;padding:16px;}
  .card h2{font-size:13.5px;font-weight:700;margin:0 0 12px;color:var(--ink);}

  .ticker{background:var(--ink);border-radius:10px;padding:16px;color:#e2e8f0;}
  .ticker h2{color:#fff;font-size:13.5px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:7px;}
  .ticker h2 svg{width:15px;height:15px;color:var(--amber);}
  .ticker-list{font-family:monospace;font-size:11.5px;display:flex;flex-direction:column;gap:9px;max-height:230px;overflow-y:auto;}
  .ticker-row{border-bottom:1px dashed #334155;padding-bottom:8px;}
  .ticker-row-top{display:flex;justify-content:space-between;color:#64748b;margin-bottom:2px;}
  .ticker-row-bottom{display:flex;justify-content:space-between;}
  .ticker-name{color:#cbd5e1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px;}
  .ticker-amt{color:var(--amber);font-weight:700;}
  .empty-note{color:#64748b;font-size:12px;}

  /* tables */
  .search-wrap{position:relative;max-width:280px;margin-bottom:14px;}
  .search-wrap svg{position:absolute;left:10px;top:9px;width:15px;height:15px;color:#a8a29e;}
  input,select{
    border:1px solid #d6d3d1;border-radius:7px;padding:8px 12px;font-size:13.5px;
    font-family:inherit;width:100%;outline:none;
  }
  input:focus,select:focus{border-color:var(--amber);box-shadow:0 0 0 2px rgba(251,191,36,0.35);}
  .search-wrap input{padding-left:32px;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff;}
  .table-card{background:#fff;border:1px solid var(--paper-line);border-radius:10px;overflow:hidden;}
  thead{background:#fafaf9;}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:0.04em;color:var(--muted);font-weight:700;padding:10px 14px;}
  th.right,td.right{text-align:right;}
  tbody tr{border-top:1px solid #f5f5f4;}
  tbody tr:hover{background:#fafaf9;}
  td{padding:10px 14px;vertical-align:middle;}
  .cell-title{font-weight:600;color:var(--ink);}
  .cell-sub{font-size:11px;color:#a8a29e;font-family:monospace;}
  .pill-low{background:#fef2f2;color:var(--red);padding:1px 7px;border-radius:6px;font-family:monospace;}
  .empty-row td{text-align:center;color:#a8a29e;padding:34px;font-size:13px;}
  .row-actions{display:flex;justify-content:flex-end;gap:8px;}
  tr.clickable{cursor:pointer;}

  /* modal */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(15,23,42,0.5);z-index:60;
    display:flex;align-items:center;justify-content:center;padding:16px;
  }
  .modal{background:#fff;border-radius:10px;box-shadow:0 20px 50px rgba(0,0,0,0.25);width:100%;max-width:440px;max-height:85vh;overflow-y:auto;}
  .modal.wide{max-width:680px;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--paper-line);position:sticky;top:0;background:#fff;}
  .modal-head h3{margin:0;font-size:14.5px;font-weight:700;}
  .modal-body{padding:20px;}
  .field{display:block;margin-bottom:12px;}
  .field label{display:block;font-size:11.5px;font-weight:700;color:#57534e;margin-bottom:5px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .field-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:11px 18px;
    border-radius:8px;box-shadow:0 10px 25px rgba(0,0,0,0.2);z-index:80;
  }

  /* new sale */
  .sale-grid{display:grid;grid-template-columns:2fr 1fr;gap:18px;}
  @media(max-width:900px){.sale-grid{grid-template-columns:1fr;}}
  .product-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  @media(max-width:640px){.product-grid{grid-template-columns:repeat(2,1fr);}}
  .product-tile{
    text-align:left;background:#fff;border:1px solid var(--paper-line);border-radius:8px;padding:11px;
    cursor:pointer;font-family:inherit;
  }
  .product-tile:hover{border-color:var(--amber);box-shadow:0 2px 8px rgba(0,0,0,0.06);}
  .product-tile .pt-name{font-size:13px;font-weight:600;color:var(--ink);line-height:1.25;}
  .product-tile .pt-stock{font-size:11px;color:#a8a29e;font-family:monospace;margin-top:4px;}
  .product-tile .pt-price{font-family:monospace;font-size:13px;font-weight:700;color:var(--amber-dark);margin-top:4px;}

  .cart-panel{background:#fff;border:1px solid var(--paper-line);border-radius:10px;padding:16px;position:sticky;top:16px;height:fit-content;}
  .cart-title{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700;margin:14px 0 8px;}
  .cart-title svg{width:15px;height:15px;}
  .cart-list{max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;margin-bottom:10px;padding-right:2px;}
  .cart-row{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #f5f5f4;padding-bottom:9px;font-size:13px;}
  .cart-row-name{font-weight:600;color:#292524;line-height:1.2;}
  .qty-ctrl{display:flex;align-items:center;gap:6px;margin-top:6px;}
  .qty-btn{width:20px;height:20px;border-radius:5px;background:#f5f5f4;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .qty-btn svg{width:11px;height:11px;}
  .qty-val{font-family:monospace;font-size:12px;width:18px;text-align:center;}
  .cart-total-row{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--paper-line);padding-top:12px;margin-bottom:12px;}
  .cart-total-label{font-size:13.5px;font-weight:700;}
  .cart-total-val{font-family:monospace;font-size:19px;font-weight:800;}

  /* chart */
  .chart-wrap{height:230px;}
  svg.chart{width:100%;height:100%;}

  /* receipt */
  .receipt{font-family:monospace;font-size:13px;}
  .receipt-head{text-align:center;margin-bottom:12px;padding-bottom:12px;border-bottom:1px dashed #d6d3d1;}
  .receipt-head .rname{font-weight:700;color:var(--ink);}
  .receipt-head .rmeta{font-size:11px;color:var(--muted);}
  .receipt-items{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
  .receipt-item{display:flex;justify-content:space-between;font-size:12px;}
  .receipt-total{display:flex;justify-content:space-between;border-top:1px dashed #d6d3d1;padding-top:8px;font-weight:800;color:var(--ink);}
  .receipt-thanks{text-align:center;font-size:10.5px;color:#a8a29e;margin-top:16px;}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="sidebar-head">
      <div class="logo-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1.5-5.5A1 1 0 0 1 5.46 3h13.08a1 1 0 0 1 .96.74L21 9"/><path d="M3 9h18v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9Z"/><path d="M9 13h6"/></svg>
      </div>
      <div>
        <div class="brand-name">Duka Manager</div>
        <div class="brand-sub">sales &amp; inventory</div>
      </div>
    </div>
    <nav class="sidebar-nav" id="nav"></nav>
    <div class="sidebar-foot" id="sidebarDate"></div>
  </aside>

  <main><div class="view" id="view"></div></main>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
/* ===================== ICONS ===================== */
const ICONS = {
  dashboard:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>',
  sale:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>',
  inventory:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="M3.3 7 12 12l8.7-5"/><path d="M12 22V12"/></svg>',
  customers:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  history:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>',
  minus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>',
  alert:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>',
  trend:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>',
  receipt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>',
  chevron:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>',
  cart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 2-1.58l1.65-7.42H5.12"/></svg>',
};

/* ===================== HELPERS ===================== */
const fmt = n => "TZS " + Math.round(Number(n)||0).toLocaleString("en-US");
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36);
const todayISO = () => new Date().toISOString().slice(0,10);

/* ===================== STATE / PERSISTENCE ===================== */
const SEED_PRODUCTS = [
  {id:uid(),name:"Rice (25kg bag)",sku:"GRC-001",category:"Groceries",price:68000,stock:14,reorder:5},
  {id:uid(),name:"Cooking Oil 5L",sku:"GRC-002",category:"Groceries",price:24500,stock:22,reorder:8},
  {id:uid(),name:"Exercise Book (Pack 12)",sku:"STA-010",category:"Stationery",price:9000,stock:3,reorder:10},
  {id:uid(),name:"Airtel Airtime Voucher",sku:"AIR-500",category:"Airtime",price:5000,stock:50,reorder:15},
  {id:uid(),name:"Bar Soap (Carton)",sku:"TOI-004",category:"Toiletries",price:32000,stock:6,reorder:6},
];
const SEED_CUSTOMERS = [
  {id:uid(),name:"Walk-in Customer",phone:"",email:"",totalSpent:0,orders:0},
  {id:uid(),name:"Amina Mushi",phone:"0754 112 233",email:"",totalSpent:0,orders:0},
  {id:uid(),name:"Baraka Mnyonge Traders",phone:"0713 998 812",email:"",totalSpent:0,orders:0},
];

function load(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return fallback;
}
function save(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
}

let state = {
  tab: "dashboard",
  products: load("duka:products", SEED_PRODUCTS),
  customers: load("duka:customers", SEED_CUSTOMERS),
  sales: load("duka:sales", []),
  cart: [],           // {productId, qty}
  saleCustomerId: null,
  productSearch: "",
  invSearch: "",
};
state.saleCustomerId = state.customers[0] ? state.customers[0].id : null;

function persist(){
  save("duka:products", state.products);
  save("duka:customers", state.customers);
  save("duka:sales", state.sales);
}

function showToast(msg){
  const root = document.getElementById("toastRoot");
  root.innerHTML = `<div class="toast">${msg}</div>`;
  setTimeout(()=>{ root.innerHTML=""; }, 2200);
}

/* ===================== NAV ===================== */
const NAV_ITEMS = [
  {key:"dashboard", label:"Dashboard", icon:"dashboard"},
  {key:"sale", label:"New Sale", icon:"sale"},
  {key:"inventory", label:"Inventory", icon:"inventory"},
  {key:"customers", label:"Customers", icon:"customers"},
  {key:"history", label:"Sales History", icon:"history"},
];

function renderNav(){
  const lowStock = state.products.filter(p=>p.stock<=p.reorder).length;
  const nav = document.getElementById("nav");
  nav.innerHTML = NAV_ITEMS.map(item=>{
    const active = state.tab===item.key;
    const badge = item.key==="inventory" && lowStock>0 ? `<span class="nav-badge">${lowStock}</span>` : "";
    return `<button class="nav-item ${active?'active':''}" data-tab="${item.key}">${ICONS[item.icon]}<span>${item.label}</span>${badge}</button>`;
  }).join("");
  nav.querySelectorAll(".nav-item").forEach(btn=>{
    btn.addEventListener("click", ()=>{ state.tab = btn.dataset.tab; state.cart=[]; renderAll(); });
  });
  document.getElementById("sidebarDate").textContent = todayISO();
}

/* ===================== DASHBOARD ===================== */
function renderDashboard(){
  const totalRevenue = state.sales.reduce((s,x)=>s+x.total,0);
  const totalOrders = state.sales.length;
  const avgOrder = totalOrders ? totalRevenue/totalOrders : 0;
  const lowStock = state.products.filter(p=>p.stock<=p.reorder).length;

  // last 14 days chart data
  const days = [...Array(14)].map((_,i)=>{
    const d = new Date(); d.setDate(d.getDate()-(13-i));
    return d.toISOString().slice(0,10);
  });
  const chartData = days.map(d=>({
    date: d.slice(5),
    revenue: state.sales.filter(s=>s.date===d).reduce((sum,s)=>sum+s.total,0)
  }));

  const recent = state.sales.slice(0,8);

  return `
    <div class="view-header">
      <div><h1>Dashboard</h1><p>Overview of sales, stock, and customers.</p></div>
    </div>
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-top"><span class="kpi-label">Total Revenue</span><div class="kpi-icon green">${ICONS.trend}</div></div>
        <div class="kpi-value">${fmt(totalRevenue)}</div>
        <div class="kpi-sub">${totalOrders} sales recorded</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-top"><span class="kpi-label">Avg. Order Value</span><div class="kpi-icon slate">${ICONS.receipt}</div></div>
        <div class="kpi-value">${fmt(avgOrder)}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-top"><span class="kpi-label">Customers</span><div class="kpi-icon amber">${ICONS.customers}</div></div>
        <div class="kpi-value">${state.customers.length}</div>
      </div>
      <button class="kpi-card" id="lowStockCard" style="cursor:pointer;">
        <div class="kpi-top"><span class="kpi-label">Low Stock Items</span><div class="kpi-icon ${lowStock?'red':'slate'}">${ICONS.alert}</div></div>
        <div class="kpi-value">${lowStock}</div>
        <div class="kpi-sub">tap to view inventory</div>
      </button>
    </div>
    <div class="grid-2">
      <div class="card">
        <h2>Revenue — last 14 days</h2>
        <div class="chart-wrap">${renderLineChart(chartData)}</div>
      </div>
      <div class="ticker">
        <h2>${ICONS.receipt} Recent sales</h2>
        <div class="ticker-list">
          ${recent.length===0 ? `<p class="empty-note">No sales yet. Record one from "New Sale".</p>` :
            recent.map(s=>`
              <div class="ticker-row">
                <div class="ticker-row-top"><span>#${s.number}</span><span>${s.date}</span></div>
                <div class="ticker-row-bottom"><span class="ticker-name">${s.customerName}</span><span class="ticker-amt">${fmt(s.total)}</span></div>
              </div>`).join("")}
        </div>
      </div>
    </div>
  `;
}

function renderLineChart(data){
  const w = 560, h = 210, padL = 42, padB = 22, padT = 10, padR = 8;
  const max = Math.max(1, ...data.map(d=>d.revenue));
  const stepX = (w - padL - padR) / (data.length - 1 || 1);
  const points = data.map((d,i)=>{
    const x = padL + i*stepX;
    const y = padT + (h-padT-padB) * (1 - d.revenue/max);
    return {x,y,...d};
  });
  const path = points.map((p,i)=> (i===0?"M":"L") + p.x.toFixed(1) + " " + p.y.toFixed(1)).join(" ");
  const gridY = [0,0.5,1].map(f=> padT + (h-padT-padB)*f );
  return `
  <svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    ${gridY.map(y=>`<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="#e7e2d6" stroke-width="1"/>`).join("")}
    <path d="${path}" fill="none" stroke="#d97706" stroke-width="2.2"/>
    ${points.map((p,i)=> i%2===0 ? `<text x="${p.x}" y="${h-4}" font-size="8.5" fill="#78716c" text-anchor="middle">${p.date}</text>` : "").join("")}
    <text x="${padL-6}" y="${padT+6}" font-size="8.5" fill="#78716c" text-anchor="end">${fmt(max).replace('TZS ','')}</text>
    <text x="${padL-6}" y="${h-padB}" font-size="8.5" fill="#78716c" text-anchor="end">0</text>
  </svg>`;
}

/* ===================== INVENTORY ===================== */
function renderInventory(){
  const q = state.invSearch.toLowerCase();
  const filtered = state.products.filter(p=> p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q));
  return `
    <div class="view-header">
      <div><h1>Inventory</h1><p>${state.products.length} products tracked</p></div>
      <button class="btn btn-dark" id="addProductBtn">${ICONS.plus} Add product</button>
    </div>
    <div class="search-wrap">${ICONS.search}<input id="invSearchInput" placeholder="Search products or SKU" value="${escapeAttr(state.invSearch)}"/></div>
    <div class="table-card">
      <table>
        <thead><tr><th>Product</th><th>Category</th><th class="right">Price</th><th class="right">Stock</th><th></th></tr></thead>
        <tbody>
          ${filtered.length===0 ? `<tr class="empty-row"><td colspan="5">No products match "${escapeHtml(state.invSearch)}".</td></tr>` :
          filtered.map(p=>{
            const low = p.stock<=p.reorder;
            return `<tr>
              <td><div class="cell-title">${escapeHtml(p.name)}</div><div class="cell-sub">${escapeHtml(p.sku)}</div></td>
              <td>${escapeHtml(p.category)}</td>
              <td class="right mono">${fmt(p.price)}</td>
              <td class="right mono">${low?`<span class="pill-low">${p.stock}</span>`:p.stock}</td>
              <td><div class="row-actions">
                <button class="icon-btn" data-edit-product="${p.id}">${ICONS.edit}</button>
                <button class="icon-btn danger" data-del-product="${p.id}">${ICONS.trash}</button>
              </div></td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>
    </div>
  `;
}

/* ===================== CUSTOMERS ===================== */
function renderCustomers(){
  return `
    <div class="view-header">
      <div><h1>Customers</h1><p>${state.customers.length} customers</p></div>
      <button class="btn btn-dark" id="addCustomerBtn">${ICONS.plus} Add customer</button>
    </div>
    <div class="table-card">
      <table>
        <thead><tr><th>Name</th><th>Phone</th><th class="right">Orders</th><th class="right">Total spent</th><th></th></tr></thead>
        <tbody>
          ${state.customers.map(c=>`
            <tr>
              <td class="cell-title">${escapeHtml(c.name)}</td>
              <td class="mono" style="font-size:12px;">${escapeHtml(c.phone||"—")}</td>
              <td class="right mono">${c.orders||0}</td>
              <td class="right mono">${fmt(c.totalSpent||0)}</td>
              <td><div class="row-actions">
                <button class="icon-btn" data-edit-customer="${c.id}">${ICONS.edit}</button>
                <button class="icon-btn danger" data-del-customer="${c.id}">${ICONS.trash}</button>
              </div></td>
            </tr>`).join("")}
        </tbody>
      </table>
    </div>
  `;
}

/* ===================== NEW SALE ===================== */
function renderSale(){
  const q = state.productSearch.toLowerCase();
  const inStock = state.products.filter(p=>p.stock>0);
  const filtered = inStock.filter(p=>p.name.toLowerCase().includes(q));

  const lines = state.cart.map(c=>{
    const p = state.products.find(x=>x.id===c.productId);
    return {...c, product:p, lineTotal: p.price*c.qty};
  });
  const total = lines.reduce((s,l)=>s+l.lineTotal,0);

  return `
    <div class="view-header">
      <div><h1>New Sale</h1><p>Add products to the cart, then complete the sale.</p></div>
    </div>
    <div class="sale-grid">
      <div>
        <div class="search-wrap">${ICONS.search}<input id="saleSearchInput" placeholder="Search product to add..." value="${escapeAttr(state.productSearch)}"/></div>
        <div class="product-grid">
          ${filtered.length===0 ? `<p class="empty-note" style="grid-column:1/-1;text-align:center;padding:24px;">No products found.</p>` :
          filtered.map(p=>`
            <button class="product-tile" data-add-product="${p.id}">
              <div class="pt-name">${escapeHtml(p.name)}</div>
              <div class="pt-stock">${p.stock} in stock</div>
              <div class="pt-price">${fmt(p.price)}</div>
            </button>`).join("")}
        </div>
      </div>
      <div class="cart-panel">
        <div class="field">
          <label>Customer</label>
          <select id="saleCustomerSelect">
            ${state.customers.map(c=>`<option value="${c.id}" ${c.id===state.saleCustomerId?'selected':''}>${escapeHtml(c.name)}</option>`).join("")}
          </select>
        </div>
        <div class="cart-title">${ICONS.cart} Cart</div>
        ${lines.length===0 ? `<p class="empty-note" style="text-align:center;padding:20px 0;">Cart is empty — tap a product to add it.</p>` : ""}
        <div class="cart-list">
          ${lines.map(l=>`
            <div class="cart-row">
              <div>
                <div class="cart-row-name">${escapeHtml(l.product.name)}</div>
                <div class="qty-ctrl">
                  <button class="qty-btn" data-qty-minus="${l.productId}">${ICONS.minus}</button>
                  <span class="qty-val">${l.qty}</span>
                  <button class="qty-btn" data-qty-plus="${l.productId}">${ICONS.plus}</button>
                </div>
              </div>
              <div style="text-align:right;">
                <div class="mono">${fmt(l.lineTotal)}</div>
                <button class="icon-btn danger" data-remove-cart="${l.productId}" style="margin-top:6px;">${ICONS.trash}</button>
              </div>
            </div>`).join("")}
        </div>
        <div class="cart-total-row"><span class="cart-total-label">Total</span><span class="cart-total-val mono">${fmt(total)}</span></div>
        <button class="btn btn-amber btn-block" id="completeSaleBtn" ${lines.length===0?'disabled':''}>Complete sale ${ICONS.chevron}</button>
      </div>
    </div>
  `;
}

/* ===================== SALES HISTORY ===================== */
function renderHistory(){
  return `
    <div class="view-header">
      <div><h1>Sales History</h1><p>${state.sales.length} sales recorded</p></div>
    </div>
    <div class="table-card">
      <table>
        <thead><tr><th>Sale #</th><th>Date</th><th>Customer</th><th class="right">Items</th><th class="right">Total</th><th></th></tr></thead>
        <tbody>
          ${state.sales.length===0 ? `<tr class="empty-row"><td colspan="6">No sales yet. Record your first sale.</td></tr>` :
          state.sales.map(s=>`
            <tr class="clickable" data-view-receipt="${s.id}">
              <td class="mono" style="font-size:12px;color:#78716c;">#${s.number}</td>
              <td>${s.date} <span style="color:#a8a29e;font-size:11px;">${s.time}</span></td>
              <td class="cell-title">${escapeHtml(s.customerName)}</td>
              <td class="right">${s.items.length}</td>
              <td class="right mono" style="font-weight:700;">${fmt(s.total)}</td>
              <td class="right" style="color:#d6d3d1;">${ICONS.chevron}</td>
            </tr>`).join("")}
        </tbody>
      </table>
    </div>
  `;
}

/* ===================== RENDER ROOT ===================== */
function renderAll(){
  renderNav();
  const view = document.getElementById("view");
  if(state.tab==="dashboard") view.innerHTML = renderDashboard();
  else if(state.tab==="inventory") view.innerHTML = renderInventory();
  else if(state.tab==="customers") view.innerHTML = renderCustomers();
  else if(state.tab==="sale") view.innerHTML = renderSale();
  else if(state.tab==="history") view.innerHTML = renderHistory();
  bindViewEvents();
}

function escapeHtml(s){ return String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

/* ===================== EVENT BINDING ===================== */
function bindViewEvents(){
  if(state.tab==="dashboard"){
    const lowCard = document.getElementById("lowStockCard");
    if(lowCard) lowCard.addEventListener("click", ()=>{ state.tab="inventory"; renderAll(); });
  }

  if(state.tab==="inventory"){
    document.getElementById("addProductBtn").addEventListener("click", ()=>openProductModal(null));
    document.getElementById("invSearchInput").addEventListener("input", e=>{ state.invSearch = e.target.value; renderAll(); document.getElementById("invSearchInput").focus(); document.getElementById("invSearchInput").selectionStart = document.getElementById("invSearchInput").value.length; });
    document.querySelectorAll("[data-edit-product]").forEach(b=> b.addEventListener("click", ()=> openProductModal(state.products.find(p=>p.id===b.dataset.editProduct))));
    document.querySelectorAll("[data-del-product]").forEach(b=> b.addEventListener("click", ()=>{
      if(confirm("Remove this product from inventory?")){
        state.products = state.products.filter(p=>p.id!==b.dataset.delProduct);
        persist(); showToast("Product removed"); renderAll();
      }
    }));
  }

  if(state.tab==="customers"){
    document.getElementById("addCustomerBtn").addEventListener("click", ()=>openCustomerModal(null));
    document.querySelectorAll("[data-edit-customer]").forEach(b=> b.addEventListener("click", ()=> openCustomerModal(state.customers.find(c=>c.id===b.dataset.editCustomer))));
    document.querySelectorAll("[data-del-customer]").forEach(b=> b.addEventListener("click", ()=>{
      if(confirm("Remove this customer?")){
        state.customers = state.customers.filter(c=>c.id!==b.dataset.delCustomer);
        persist(); showToast("Customer removed"); renderAll();
      }
    }));
  }

  if(state.tab==="sale"){
    const searchInput = document.getElementById("saleSearchInput");
    searchInput.addEventListener("input", e=>{
      state.productSearch = e.target.value;
      renderAll();
      const el = document.getElementById("saleSearchInput");
      el.focus(); el.selectionStart = el.selectionEnd = el.value.length;
    });
    document.getElementById("saleCustomerSelect").addEventListener("change", e=>{ state.saleCustomerId = e.target.value; });
    document.querySelectorAll("[data-add-product]").forEach(b=> b.addEventListener("click", ()=>{
      const pid = b.dataset.addProduct;
      const p = state.products.find(x=>x.id===pid);
      const existing = state.cart.find(c=>c.productId===pid);
      if(existing){ if(existing.qty < p.stock) existing.qty++; }
      else state.cart.push({productId:pid, qty:1});
      renderAll();
    }));
    document.querySelectorAll("[data-qty-plus]").forEach(b=> b.addEventListener("click", ()=> changeQty(b.dataset.qtyPlus, 1)));
    document.querySelectorAll("[data-qty-minus]").forEach(b=> b.addEventListener("click", ()=> changeQty(b.dataset.qtyMinus, -1)));
    document.querySelectorAll("[data-remove-cart]").forEach(b=> b.addEventListener("click", ()=>{
      state.cart = state.cart.filter(c=>c.productId!==b.dataset.removeCart); renderAll();
    }));
    const completeBtn = document.getElementById("completeSaleBtn");
    if(completeBtn) completeBtn.addEventListener("click", completeSale);
  }

  if(state.tab==="history"){
    document.querySelectorAll("[data-view-receipt]").forEach(row=> row.addEventListener("click", ()=>{
      const sale = state.sales.find(s=>s.id===row.dataset.viewReceipt);
      openReceiptModal(sale);
    }));
  }
}

function changeQty(productId, delta){
  const p = state.products.find(x=>x.id===productId);
  const c = state.cart.find(c=>c.productId===productId);
  if(!c) return;
  c.qty = Math.min(p.stock, Math.max(1, c.qty+delta));
  renderAll();
}

function completeSale(){
  const lines = state.cart.map(c=>{
    const p = state.products.find(x=>x.id===c.productId);
    return {...c, product:p, lineTotal:p.price*c.qty};
  });
  if(lines.length===0) return;
  const customer = state.customers.find(c=>c.id===state.saleCustomerId) || state.customers[0];
  const total = lines.reduce((s,l)=>s+l.lineTotal,0);

  state.products = state.products.map(p=>{
    const line = state.cart.find(c=>c.productId===p.id);
    if(!line) return p;
    return {...p, stock: Math.max(0, p.stock-line.qty)};
  });
  state.customers = state.customers.map(c=>
    c.id===customer.id ? {...c, totalSpent:(c.totalSpent||0)+total, orders:(c.orders||0)+1} : c
  );

  const sale = {
    id: uid(),
    number: Math.floor(1000+Math.random()*9000),
    date: todayISO(),
    time: new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}),
    customerId: customer.id,
    customerName: customer.name,
    items: lines.map(l=>({name:l.product.name, qty:l.qty, price:l.product.price, lineTotal:l.lineTotal})),
    total,
  };
  state.sales = [sale, ...state.sales];
  state.cart = [];
  persist();
  showToast(`Sale #${sale.number} completed — ${fmt(sale.total)}`);
  state.tab = "history";
  renderAll();
  openReceiptModal(sale);
}

/* ===================== MODALS ===================== */
function closeModal(){ document.getElementById("modalRoot").innerHTML = ""; }

function openProductModal(product){
  const isEdit = !!product;
  const p = product || {name:"",sku:"",category:"",price:"",stock:"",reorder:"5"};
  document.getElementById("modalRoot").innerHTML = `
    <div class="modal-overlay" id="overlay">
      <div class="modal">
        <div class="modal-head"><h3>${isEdit?"Edit product":"Add product"}</h3><button class="icon-btn" id="closeModalBtn">${ICONS.close}</button></div>
        <div class="modal-body">
          <form id="productForm">
            <div class="field"><label>Product name</label><input required id="f_name" value="${escapeAttr(p.name)}" placeholder="e.g. Cooking Oil 5L"/></div>
            <div class="field-row">
              <div class="field"><label>SKU / code</label><input id="f_sku" value="${escapeAttr(p.sku)}" placeholder="GRC-002"/></div>
              <div class="field"><label>Category</label><input id="f_category" value="${escapeAttr(p.category)}" placeholder="Groceries"/></div>
            </div>
            <div class="field-row-3">
              <div class="field"><label>Price (TZS)</label><input required type="number" min="0" id="f_price" value="${p.price}"/></div>
              <div class="field"><label>Stock qty</label><input required type="number" min="0" id="f_stock" value="${p.stock}"/></div>
              <div class="field"><label>Reorder at</label><input type="number" min="0" id="f_reorder" value="${p.reorder}"/></div>
            </div>
            <button type="submit" class="btn btn-amber btn-block">${isEdit?"Save changes":"Add product"}</button>
          </form>
        </div>
      </div>
    </div>`;
  document.getElementById("closeModalBtn").addEventListener("click", closeModal);
  document.getElementById("overlay").addEventListener("click", e=>{ if(e.target.id==="overlay") closeModal(); });
  document.getElementById("productForm").addEventListener("submit", e=>{
    e.preventDefault();
    const name = document.getElementById("f_name").value.trim();
    if(!name) return;
    const data = {
      id: product?product.id:uid(),
      name,
      sku: document.getElementById("f_sku").value,
      category: document.getElementById("f_category").value,
      price: Number(document.getElementById("f_price").value)||0,
      stock: Number(document.getElementById("f_stock").value)||0,
      reorder: Number(document.getElementById("f_reorder").value)||0,
    };
    if(isEdit) state.products = state.products.map(x=> x.id===data.id ? data : x);
    else state.products = [data, ...state.products];
    persist();
    showToast(isEdit?"Product updated":"Product added");
    closeModal();
    renderAll();
  });
}

function openCustomerModal(customer){
  const isEdit = !!customer;
  const c = customer || {name:"",phone:"",email:""};
  document.getElementById("modalRoot").innerHTML = `
    <div class="modal-overlay" id="overlay">
      <div class="modal">
        <div class="modal-head"><h3>${isEdit?"Edit customer":"Add customer"}</h3><button class="icon-btn" id="closeModalBtn">${ICONS.close}</button></div>
        <div class="modal-body">
          <form id="customerForm">
            <div class="field"><label>Full name</label><input required id="f_cname" value="${escapeAttr(c.name)}"/></div>
            <div class="field"><label>Phone</label><input id="f_cphone" value="${escapeAttr(c.phone)}" placeholder="07XX XXX XXX"/></div>
            <div class="field"><label>Email (optional)</label><input type="email" id="f_cemail" value="${escapeAttr(c.email)}"/></div>
            <button type="submit" class="btn btn-amber btn-block">${isEdit?"Save changes":"Add customer"}</button>
          </form>
        </div>
      </div>
    </div>`;
  document.getElementById("closeModalBtn").addEventListener("click", closeModal);
  document.getElementById("overlay").addEventListener("click", e=>{ if(e.target.id==="overlay") closeModal(); });
  document.getElementById("customerForm").addEventListener("submit", e=>{
    e.preventDefault();
    const name = document.getElementById("f_cname").value.trim();
    if(!name) return;
    if(isEdit){
      state.customers = state.customers.map(x=> x.id===customer.id ? {...x, name, phone:document.getElementById("f_cphone").value, email:document.getElementById("f_cemail").value} : x);
      showToast("Customer updated");
    } else {
      state.customers = [{id:uid(), name, phone:document.getElementById("f_cphone").value, email:document.getElementById("f_cemail").value, totalSpent:0, orders:0}, ...state.customers];
      showToast("Customer added");
    }
    persist();
    closeModal();
    renderAll();
  });
}

function openReceiptModal(sale){
  document.getElementById("modalRoot").innerHTML = `
    <div class="modal-overlay" id="overlay">
      <div class="modal">
        <div class="modal-head"><h3>Receipt #${sale.number}</h3><button class="icon-btn" id="closeModalBtn">${ICONS.close}</button></div>
        <div class="modal-body">
          <div class="receipt">
            <div class="receipt-head">
              <div class="rname">DUKA MANAGER</div>
              <div class="rmeta">${sale.date} • ${sale.time}</div>
              <div class="rmeta">Customer: ${escapeHtml(sale.customerName)}</div>
            </div>
            <div class="receipt-items">
              ${sale.items.map(it=>`<div class="receipt-item"><span>${escapeHtml(it.name)} x${it.qty}</span><span>${fmt(it.lineTotal)}</span></div>`).join("")}
            </div>
            <div class="receipt-total"><span>TOTAL</span><span>${fmt(sale.total)}</span></div>
            <div class="receipt-thanks">Asante kwa ununuzi wako!</div>
          </div>
        </div>
      </div>
    </div>`;
  document.getElementById("closeModalBtn").addEventListener("click", closeModal);
  document.getElementById("overlay").addEventListener("click", e=>{ if(e.target.id==="overlay") closeModal(); });
}

/* ===================== INIT ===================== */
renderAll();
</script>
</body>
</html>
