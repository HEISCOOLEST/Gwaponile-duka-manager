<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Duka Manager — Sales &amp; Inventory</title>
<style>
  :root{
    --ink:#0f172a; --ink-2:#1e293b; --paper:#fafaf9; --paper-line:#e7e5e4;
    --muted:#78716c; --amber:#fbbf24; --amber-dark:#d97706; --red:#dc2626; --green:#059669;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--paper);color:var(--ink);}
  .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;}
  a{color:inherit;}
  button{font-family:inherit;}

  /* ===== Login screen ===== */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink);padding:20px;}
  .login-card{background:#fff;border-radius:12px;padding:32px 28px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,0.3);}
  .login-logo{width:44px;height:44px;border-radius:10px;background:var(--amber);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
  .login-logo svg{width:22px;height:22px;color:var(--ink);}
  .login-title{text-align:center;font-size:18px;font-weight:800;margin:0 0 4px;}
  .login-sub{text-align:center;font-size:12.5px;color:var(--muted);margin:0 0 22px;}
  .login-error{background:#fef2f2;color:var(--red);font-size:12.5px;padding:9px 12px;border-radius:7px;margin-bottom:14px;display:none;}
  .login-loading{text-align:center;color:var(--muted);font-size:13px;padding:60px 0;}

  /* ===== layout ===== */
  .app{display:flex;min-height:100vh;}
  .sidebar{width:230px;flex-shrink:0;background:var(--ink);display:flex;flex-direction:column;min-height:100vh;}
  .sidebar-head{padding:18px 20px;border-bottom:1px solid #1e293b;display:flex;align-items:center;gap:10px;}
  .logo-badge{width:32px;height:32px;border-radius:7px;background:var(--amber);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .logo-badge svg{width:16px;height:16px;color:var(--ink);}
  .brand-name{color:#fff;font-weight:700;font-size:14px;line-height:1.2;letter-spacing:-0.01em;}
  .brand-sub{color:#64748b;font-size:10px;font-family:monospace;}
  nav.sidebar-nav{flex:1;padding:14px 12px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;}
  .nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;border:none;background:none;border-radius:7px;color:#cbd5e1;font-size:13.5px;font-weight:500;cursor:pointer;text-align:left;}
  .nav-item svg{width:17px;height:17px;flex-shrink:0;}
  .nav-item:hover{background:#1e293b;color:#fff;}
  .nav-item.active{background:var(--amber);color:var(--ink);}
  .nav-badge{margin-left:auto;font-size:10.5px;font-family:monospace;padding:2px 6px;border-radius:5px;background:rgba(220,38,38,0.2);color:#fca5a5;}
  .nav-item.active .nav-badge{background:var(--ink);color:#fbbf24;}
  .sidebar-foot{padding:14px 20px;border-top:1px solid #1e293b;}
  .user-chip{display:flex;align-items:center;gap:9px;margin-bottom:10px;}
  .user-avatar{width:28px;height:28px;border-radius:50%;background:#334155;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;flex-shrink:0;}
  .user-name{color:#fff;font-size:12.5px;font-weight:600;line-height:1.2;}
  .user-role{color:#64748b;font-size:10.5px;}
  .logout-btn{width:100%;background:#1e293b;color:#cbd5e1;border:none;border-radius:6px;padding:7px;font-size:12px;cursor:pointer;}
  .logout-btn:hover{background:#334155;color:#fff;}

  main{flex:1;min-height:100vh;}
  .view{padding:24px;max-width:1100px;}
  .view-header{margin-bottom:22px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .view-header h1{font-size:20px;font-weight:700;margin:0 0 3px;}
  .view-header p{font-size:13px;color:var(--muted);margin:0;}

  .btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:7px;font-size:13.5px;font-weight:600;padding:9px 15px;cursor:pointer;}
  .btn svg{width:15px;height:15px;}
  .btn-dark{background:var(--ink);color:#fff;}
  .btn-dark:hover{background:var(--ink-2);}
  .btn-amber{background:var(--amber);color:var(--ink);}
  .btn-amber:hover{background:#f59e0b;}
  .btn-amber:disabled{background:#e7e5e4;color:#a8a29e;cursor:not-allowed;}
  .btn-block{width:100%;justify-content:center;}
  .btn-outline{background:#fff;border:1px solid #d6d3d1;color:var(--ink);}
  .btn-outline:hover{background:#f5f5f4;}
  .icon-btn{background:none;border:none;cursor:pointer;color:#a8a29e;padding:2px;display:inline-flex;}
  .icon-btn:hover{color:var(--ink);}
  .icon-btn.danger:hover{color:var(--red);}
  .icon-btn svg{width:15px;height:15px;}

  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px;}
  @media(max-width:820px){.kpi-grid{grid-template-columns:repeat(2,1fr);}}
  .kpi-card{background:#fff;border:1px solid var(--paper-line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;text-align:left;}
  .kpi-top{display:flex;align-items:center;justify-content:space-between;}
  .kpi-label{font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);font-weight:700;}
  .kpi-icon{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;}
  .kpi-icon svg{width:14px;height:14px;}
  .kpi-icon.slate{background:#f1f5f9;color:var(--ink);}
  .kpi-icon.green{background:#ecfdf5;color:var(--green);}
  .kpi-icon.amber{background:#fffbeb;color:#b45309;}
  .kpi-icon.red{background:#fef2f2;color:var(--red);}
  .kpi-value{font-family:monospace;font-size:22px;font-weight:700;line-height:1;}
  .kpi-sub{font-size:11.5px;color:var(--muted);}
  .kpi-sub.up{color:var(--green);}
  .kpi-sub.down{color:var(--red);}

  .grid-2{display:grid;grid-template-columns:2fr 1fr;gap:16px;}
  @media(max-width:900px){.grid-2{grid-template-columns:1fr;}}
  .card{background:#fff;border:1px solid var(--paper-line);border-radius:10px;padding:16px;}
  .card h2{font-size:13.5px;font-weight:700;margin:0 0 12px;}

  .ticker{background:var(--ink);border-radius:10px;padding:16px;color:#e2e8f0;}
  .ticker h2{color:#fff;font-size:13.5px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:7px;}
  .ticker h2 svg{width:15px;height:15px;color:var(--amber);}
  .ticker-list{font-family:monospace;font-size:11.5px;display:flex;flex-direction:column;gap:9px;max-height:230px;overflow-y:auto;}
  .ticker-row{border-bottom:1px dashed #334155;padding-bottom:8px;}
  .ticker-row-top{display:flex;justify-content:space-between;color:#64748b;margin-bottom:2px;}
  .ticker-row-bottom{display:flex;justify-content:space-between;}
  .ticker-name{color:#cbd5e1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px;}
  .ticker-amt{color:var(--amber);font-weight:700;}
  .empty-note{color:#64748b;font-size:12px;}

  .search-wrap{position:relative;max-width:280px;margin-bottom:14px;}
  .search-wrap svg{position:absolute;left:10px;top:9px;width:15px;height:15px;color:#a8a29e;}
  input,select,textarea{border:1px solid #d6d3d1;border-radius:7px;padding:8px 12px;font-size:13.5px;font-family:inherit;width:100%;outline:none;background:#fff;color:var(--ink);}
  input:focus,select:focus{border-color:var(--amber);box-shadow:0 0 0 2px rgba(251,191,36,0.35);}
  .search-wrap input{padding-left:32px;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff;}
  .table-card{background:#fff;border:1px solid var(--paper-line);border-radius:10px;overflow:hidden;overflow-x:auto;}
  thead{background:#fafaf9;}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:0.04em;color:var(--muted);font-weight:700;padding:10px 14px;white-space:nowrap;}
  th.right,td.right{text-align:right;}
  tbody tr{border-top:1px solid #f5f5f4;}
  tbody tr:hover{background:#fafaf9;}
  td{padding:10px 14px;vertical-align:middle;}
  .cell-title{font-weight:600;}
  .cell-sub{font-size:11px;color:#a8a29e;font-family:monospace;}
  .pill-low{background:#fef2f2;color:var(--red);padding:1px 7px;border-radius:6px;font-family:monospace;}
  .pill-role{padding:2px 8px;border-radius:5px;font-size:11px;font-weight:700;}
  .pill-Administrator{background:#fef2f2;color:#b91c1c;}
  .pill-Manager{background:#eff6ff;color:#1d4ed8;}
  .pill-Cashier{background:#f0fdf4;color:#15803d;}
  .pill-Inventory{background:#fffbeb;color:#b45309;}
  .pill-disabled{background:#f5f5f4;color:#a8a29e;}
  .empty-row td{text-align:center;color:#a8a29e;padding:34px;font-size:13px;}
  .row-actions{display:flex;justify-content:flex-end;gap:8px;}
  tr.clickable{cursor:pointer;}

  .modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,0.5);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;}
  .modal{background:#fff;border-radius:10px;box-shadow:0 20px 50px rgba(0,0,0,0.25);width:100%;max-width:440px;max-height:85vh;overflow-y:auto;}
  .modal.wide{max-width:680px;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--paper-line);position:sticky;top:0;background:#fff;}
  .modal-head h3{margin:0;font-size:14.5px;font-weight:700;}
  .modal-body{padding:20px;}
  .field{display:block;margin-bottom:12px;}
  .field label{display:block;font-size:11.5px;font-weight:700;color:#57534e;margin-bottom:5px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .field-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:11px 18px;border-radius:8px;box-shadow:0 10px 25px rgba(0,0,0,0.2);z-index:80;max-width:90vw;text-align:center;}

  .sale-grid{display:grid;grid-template-columns:2fr 1fr;gap:18px;}
  @media(max-width:900px){.sale-grid{grid-template-columns:1fr;}}
  .product-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  @media(max-width:640px){.product-grid{grid-template-columns:repeat(2,1fr);}}
  .product-tile{text-align:left;background:#fff;border:1px solid var(--paper-line);border-radius:8px;padding:11px;cursor:pointer;}
  .product-tile:hover{border-color:var(--amber);box-shadow:0 2px 8px rgba(0,0,0,0.06);}
  .product-tile .pt-name{font-size:13px;font-weight:600;line-height:1.25;}
  .product-tile .pt-stock{font-size:11px;color:#a8a29e;font-family:monospace;margin-top:4px;}
  .product-tile .pt-price{font-family:monospace;font-size:13px;font-weight:700;color:var(--amber-dark);margin-top:4px;}

  .cart-panel{background:#fff;border:1px solid var(--paper-line);border-radius:10px;padding:16px;position:sticky;top:16px;height:fit-content;}
  .cart-title{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700;margin:14px 0 8px;}
  .cart-title svg{width:15px;height:15px;}
  .cart-list{max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;margin-bottom:10px;padding-right:2px;}
  .cart-row{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #f5f5f4;padding-bottom:9px;font-size:13px;}
  .cart-row-name{font-weight:600;color:#292524;line-height:1.2;}
  .qty-ctrl{display:flex;align-items:center;gap:6px;margin-top:6px;}
  .qty-btn{width:20px;height:20px;border-radius:5px;background:#f5f5f4;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .qty-btn svg{width:11px;height:11px;}
  .qty-val{font-family:monospace;font-size:12px;width:18px;text-align:center;}
  .discount-box{border-top:1px solid var(--paper-line);padding-top:10px;margin-bottom:10px;}
  .discount-row{display:flex;gap:8px;}
  .discount-row select{flex:0 0 74px;}
  .subtotal-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);padding:3px 0;}
  .cart-total-row{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--paper-line);padding-top:10px;margin-bottom:12px;}
  .cart-total-label{font-size:13.5px;font-weight:700;}
  .cart-total-val{font-family:monospace;font-size:19px;font-weight:800;}

  .chart-wrap{height:230px;}
  svg.chart{width:100%;height:100%;}

  .receipt{font-family:monospace;font-size:13px;}
  .receipt-head{text-align:center;margin-bottom:12px;padding-bottom:12px;border-bottom:1px dashed #d6d3d1;}
  .receipt-head .rname{font-weight:700;}
  .receipt-head .rmeta{font-size:11px;color:var(--muted);}
  .receipt-items{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
  .receipt-item{display:flex;justify-content:space-between;font-size:12px;}
  .receipt-sub{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding-top:6px;border-top:1px dashed #d6d3d1;}
  .receipt-total{display:flex;justify-content:space-between;border-top:1px dashed #d6d3d1;padding-top:8px;font-weight:800;margin-top:4px;}
  .receipt-thanks{text-align:center;font-size:10.5px;color:#a8a29e;margin-top:16px;}

  .locked-note{background:#fffbeb;border:1px solid #fde68a;color:#92400e;font-size:12.5px;padding:10px 13px;border-radius:8px;margin-bottom:16px;}
  .shift-required{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;font-size:12.5px;padding:11px 13px;border-radius:8px;margin-bottom:14px;}
  .shift-required strong{display:block;margin-bottom:3px;}

  .support-card{background:#fff;border:1px solid var(--paper-line);border-radius:10px;padding:16px;display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);margin-bottom:10px;}
  .support-card:hover{border-color:var(--amber);}
  .support-icon{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .support-icon svg{width:18px;height:18px;}
  .support-title{font-size:13.5px;font-weight:700;}
  .support-sub{font-size:12px;color:var(--muted);}

  .role-toggle{display:flex;gap:6px;margin-bottom:14px;}
  .role-chip{padding:6px 12px;border-radius:16px;font-size:12px;font-weight:600;border:1px solid var(--paper-line);background:#fff;cursor:pointer;}
  .role-chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}

  .spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ===== Barcode scanner modal ===== */
  .scanner-wrap{position:relative;background:#000;border-radius:8px;overflow:hidden;aspect-ratio:4/3;}
  .scanner-wrap video{width:100%;height:100%;object-fit:cover;display:block;}
  .scanner-frame{position:absolute;inset:15% 12%;border:2px solid var(--amber);border-radius:8px;pointer-events:none;}
  .scanner-hint{font-size:11.5px;color:var(--muted);text-align:center;margin-top:10px;}

  /* ===== Print receipt ===== */
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{position:absolute;top:0;left:0;width:100%;padding:12px;}
    .modal-head, #refundSaleBtn, #printReceiptBtn{display:none !important;}
  }

  .receipt-center-actions .btn{min-width:38px;padding:8px;}
  .receipt-center-actions{display:flex;flex-wrap:wrap;gap:6px;}

  /* ===== Phase 4 ===== */
  .connection-badge{position:fixed;top:12px;right:16px;z-index:50;padding:6px 10px;border-radius:999px;font-size:10px;font-weight:800;letter-spacing:.04em;background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}.connection-badge.offline{background:#fff7ed;color:#c2410c;border-color:#fed7aa}.card-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.stack{display:flex;flex-wrap:wrap;gap:8px}.muted{color:var(--muted);font-size:13px}@media(max-width:800px){.card-grid{grid-template-columns:1fr}.connection-badge{top:8px;right:8px;font-size:9px}}

  /* ===== Mobile icon sidebar + hamburger instructions ===== */
  .mobile-menu-toggle{display:none;}
  .mobile-menu-overlay{display:none;}

  @media(max-width:700px){
    .app{min-height:100vh;}

    /* Keep only icons in the left navigation. */
    .sidebar{width:62px;min-width:62px;}
    .sidebar-head{height:64px;padding:14px 13px;justify-content:center;}
    .sidebar-head .brand-name,
    .sidebar-head .brand-sub{display:none;}
    .logo-badge{width:36px;height:36px;}

    nav.sidebar-nav{padding:10px 8px;gap:6px;}
    .nav-item{width:46px;height:46px;padding:0;margin:0 auto;justify-content:center;border-radius:9px;position:relative;}
    .nav-item svg{width:20px;height:20px;}
    .nav-item > span{display:none;}
    .nav-badge{position:absolute;top:2px;right:1px;margin:0;min-width:16px;text-align:center;padding:1px 4px;font-size:9px;}

    .sidebar-foot{padding:10px 8px;}
    .user-chip{justify-content:center;margin:0 0 8px;}
    .user-chip > div:not(.user-avatar){display:none;}
    .user-avatar{width:36px;height:36px;font-size:12px;}
    .logout-btn{width:46px;height:38px;padding:0;margin:auto;display:flex;align-items:center;justify-content:center;}
    .logout-btn{font-size:0;}
    .logout-btn svg{width:18px;height:18px;}

    main{min-width:0;width:calc(100% - 62px);overflow-x:hidden;}
    .view{padding:68px 12px 20px;max-width:none;}

    /* Three-line button. It is the only place where navigation names appear. */
    .mobile-menu-toggle{
      display:flex;
      position:fixed;
      top:12px;
      left:74px;
      width:42px;
      height:42px;
      z-index:70;
      align-items:center;
      justify-content:center;
      border:1px solid var(--paper-line);
      border-radius:9px;
      background:#fff;
      color:var(--ink);
      box-shadow:0 2px 8px rgba(15,23,42,.08);
      cursor:pointer;
    }
    .mobile-menu-toggle svg{width:22px;height:22px;}

    /* Instructions / navigation drawer */
    .mobile-menu-overlay{
      display:block;
      position:fixed;
      inset:0;
      z-index:65;
      background:rgba(15,23,42,.38);
    }
    .mobile-menu-overlay[hidden]{display:none !important;}
    .mobile-menu-panel{
      position:absolute;
      top:8px;
      left:72px;
      width:min(280px,calc(100vw - 84px));
      max-height:calc(100vh - 16px);
      overflow-y:auto;
      background:#fff;
      border:1px solid var(--paper-line);
      border-radius:12px;
      box-shadow:0 16px 45px rgba(15,23,42,.24);
      padding:12px;
    }
    .mobile-menu-title{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:4px 6px 10px;
      margin-bottom:6px;
      border-bottom:1px solid #f0eeeb;
    }
    .mobile-menu-title strong{font-size:14px;}
    .mobile-menu-close{
      width:32px;height:32px;border:0;border-radius:7px;background:#f5f5f4;
      color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;
    }
    .mobile-menu-panel .nav-item{
      width:100%;
      height:44px;
      margin:0;
      padding:0 10px;
      justify-content:flex-start;
      gap:10px;
      color:var(--ink);
      border-radius:8px;
      font-size:13px;
    }
    .mobile-menu-panel .nav-item > span{display:block;}
    .mobile-menu-panel .nav-item:hover{background:#f5f5f4;color:var(--ink);}
    .mobile-menu-panel .nav-item.active{background:var(--amber);color:var(--ink);}
    .mobile-menu-panel .nav-item svg{width:19px;height:19px;}
    .mobile-menu-panel .nav-badge{position:static;margin-left:auto;}

    .view-header{margin-bottom:16px;}
    .view-header h1{font-size:19px;}
    .view-header p{font-size:12px;}
    .kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;}
    .kpi-card{padding:12px;min-width:0;}
    .kpi-value{font-size:19px;}
    .card{padding:13px;}
    .table-card{max-width:100%;}
    .sale-grid,.grid-2{grid-template-columns:1fr;}
  }

  @media(max-width:380px){
    .sidebar{width:56px;min-width:56px;}
    main{width:calc(100% - 56px);}
    .view{padding-left:9px;padding-right:9px;}
    .mobile-menu-toggle{left:66px;}
    .mobile-menu-panel{left:64px;width:calc(100vw - 74px);}

  state.user = fbUser;

    const snap = await getDoc(doc(db,"Users",fbUser.uid));
    if(!snap.exists()){
      state.loginError = "Akaunti hii haijasajiliwa kwenye mfumo. Wasiliana na Admin.";
      await signOut(auth);
      state.authReady = true; render();
      return;
    }
    const profile = snap.data();
    // Normalize to tolerate stray whitespace / autocapitalized letters from mobile keyboards
    profile.status = (profile.status || "").toString().trim().toLowerCase();
    const roleRaw = (profile.role || "").toString().trim().toLowerCase();
    const matchedRole = ROLES.find(r => r.toLowerCase() === roleRaw);
    if(matchedRole) profile.role = matchedRole;

    if(profile.status !== "active"){
      state.loginError = "Akaunti yako imezimwa. Wasiliana na Admin.";
      await signOut(auth);
      state.authReady = true; render();
      return;
    }
    if(!matchedRole){
      state.loginError = "Role ya akaunti yako si sahihi. Wasiliana na Admin.";
      await signOut(auth);
      state.authReady = true; render();
      return;
    }
    state.profile = profile;
    state.tab = "dashboard";
    state.authReady = true;
    startListeners();
    requestNotifyPermission();
    render();
  }catch(e){
    console.error(e);
    state.loginError = "DEBUG2: " + (e.code || "") + " " + (e.message || e);
    await signOut(auth);
    state.authReady = true; render();
  }
});

function startListeners(){
  unsubs.push(onSnapshot(collection(db,"products"), snap=>{
    state.products = snap.docs.map(d=>({id:d.id, ...d.data()}));
    checkLowStockNotifications(state.products);
    render();
  }));
  // Rules: suppliers read = Admin/Manager/Inventory only. Cashier must not subscribe.
  if(CAN_MANAGE_SUPPLIERS(state.profile.role)){
    unsubs.push(onSnapshot(collection(db,"suppliers"), snap=>{
      state.suppliers = snap.docs.map(d=>({id:d.id, ...d.data()}));
      render();
    }));
  }
  // Rules: shifts read = Admin/Manager/Cashier only. Inventory must not subscribe.
  if(CAN_TRACK_SHIFT(state.profile.role)){
    unsubs.push(onSnapshot(collection(db,"shifts"), snap=>{
      state.shifts = snap.docs.map(d=>({id:d.id, ...d.data()}));
      render();
    }));
  }
  if(CAN_EXPENSES(state.profile.role)){
    unsubs.push(onSnapshot(query(collection(db,"expenses"), orderBy("createdAt","desc")), snap=>{
      state.expenses = snap.docs.map(d=>({id:d.id, ...d.data()})); render();
    }));
  }
  if(CAN_PURCHASE(state.profile.role)){
    unsubs.push(onSnapshot(query(collection(db,"purchases"), orderBy("createdAt","desc")), snap=>{
      state.purchases = snap.docs.map(d=>({id:d.id, ...d.data()})); render();
    }));
    unsubs.push(onSnapshot(query(collection(db,"stockMoves"), orderBy("createdAt","desc")), snap=>{
      state.stockMoves = snap.docs.map(d=>({id:d.id, ...d.data()})); render();
    }));
  }
  // Rules: customers read = Admin/Manager/Cashier only. Inventory must not subscribe.
  if(CAN_SEE_CUSTOMERS(state.profile.role)){
    unsubs.push(onSnapshot(collection(db,"customers"), snap=>{
      state.customers = snap.docs.map(d=>({id:d.id, ...d.data()}));
      if(!state.saleCustomerId && state.customers[0]) state.saleCustomerId = state.customers[0].id;
      render();
    }));
  }
  // Rules: sales read = Admin/Manager/Cashier only. Inventory must not subscribe.
  if(CAN_SELL(state.profile.role)){
    unsubs.push(onSnapshot(query(collection(db,"sales"), orderBy("createdAt","desc")), snap=>{
      state.sales = snap.docs.map(d=>({id:d.id, ...d.data()}));
      render();
    }));
  }
  // Rules: Users/auditLog read = Admin OR Manager (create/delete stay Admin-only in the UI).
  if(CAN_VIEW_USERS(state.profile.role)){
    unsubs.push(onSnapshot(collection(db,"Users"), snap=>{
      state.users = snap.docs.map(d=>({id:d.id, ...d.data()}));
      render();
    }));
    unsubs.push(onSnapshot(query(collection(db,"auditLog"), orderBy("createdAt","desc")), snap=>{
      state.auditLog = snap.docs.map(d=>({id:d.id, ...d.data()}));
      render();
    }));
  }
}

/* ============================================================
   LOW STOCK BROWSER NOTIFICATIONS
============================================================ */
function requestNotifyPermission(){
  if(typeof Notification === "undefined") return;
  if(Notification.permission === "default") Notification.requestPermission();
}
function checkLowStockNotifications(products){
  if(typeof Notification === "undefined" || Notification.permission !== "granted") return;
  if(!state.profile || !CAN_EDIT_PRODUCTS(state.profile.role)) return;
  products.forEach(p=>{
    const isLow = (p.stock||0) <= (p.reorder||0);
    if(isLow && !notifiedLowStockIds.has(p.id)){
      notifiedLowStockIds.add(p.id);
      try{
        new Notification("Stock ndogo — "+p.name, {
          body: `Kimebaki ${p.stock} tu (reorder ${p.reorder}). Agiza tena.`,
          tag: "lowstock-"+p.id
        });
      }catch(e){ /* ignore notification errors */ }
    } else if(!isLow && notifiedLowStockIds.has(p.id)){
      notifiedLowStockIds.delete(p.id); // stock replenished — allow re-alert if it drops again
    }
  });
}

/* ============================================================
   ROBNEY AI ASSISTANT
   Zero-cost architecture: calls Groq directly from the browser
   using a FREE API key (no credit card, generous daily limits).
   No backend, no Cloud Functions, no billing. Firestore remains
   the single source of truth for shop data (multi-device sync);
   ROBNEY just reads the already-synced `state` in memory — no
   separate IndexedDB/Dexie copy is needed or used.

   (We use Groq instead of Google AI Studio because Google's new
   "AQ." auth keys currently have a widespread, unresolved bug
   rejecting all generateContent calls with 401
   ACCESS_TOKEN_TYPE_UNSUPPORTED — confirmed by many developers
   on Google's own forum as of Aug 2026. Groq uses the standard,
   stable OpenAI-compatible format instead.)

   The key is NEVER written into this file / committed to git.
   Every user enters THEIR OWN key, once, on each device — it is
   saved in that browser's local storage, keyed by that user's
   uid, so several people can share one device without seeing or
   overwriting each other's key, and each person uses their own
   free Groq quota instead of sharing one admin key.

   SETUP (one-time per person, free, ~3 minutes):
   1. Go to https://console.groq.com and sign up (Google/GitHub/
      email — no credit card).
   2. Go to "API Keys" in the left menu -> "Create API Key".
   3. Copy the key (starts with gsk_).
   4. Log in to this app with your own account, open ROBNEY AI,
      and paste the key when prompted (or via the "Weka AI Key
      Yangu" / "Badilisha AI Key Yangu" button).
============================================================ */
const ROBNEY_MODEL = "groq/compound-mini"; // lighter agentic model with built-in web search — uses fewer tokens per request than full groq/compound, so it's less likely to hit the free-tier rate limit
const ROBNEY_API_URL = "https://api.groq.com/openai/v1/chat/completions";
// Each logged-in user keeps their OWN key on this device (keyed by their uid),
// so several people sharing one phone/PC don't overwrite each other's key and
// everyone can use their own free Groq quota instead of one shared/admin key.
// A legacy shared key (set before this per-user change) is kept as a fallback
// for any user who hasn't set a personal key yet.
function getRobneyKey(){
  try{
    const uid = state.user && state.user.uid;
    if(uid){
      const perUser = localStorage.getItem(`robney_api_key_${uid}`);
      if(perUser) return perUser;
    }
    return localStorage.getItem("robney_api_key") || ""; // legacy shared fallback
  }catch(e){ return ""; }
}
function setRobneyKey(key){
  try{
    const uid = state.user && state.user.uid;
    const k = (key || "").trim();
    const storageKey = uid ? `robney_api_key_${uid}` : "robney_api_key";
    if(k) localStorage.setItem(storageKey, k);
    else localStorage.removeItem(storageKey);
  }catch(e){ /* ignore */ }
}

// Conversation memory kept in the browser tab only (not persisted).
let robneyHistory = [];
// Currently staged attachment (one at a time): { kind:'image', name, mime, dataUrl } or { kind:'document', name, text }
let robneyAttachment = null;
// Vision-capable model for image queries (compound/compound-mini are text-only tool-use models).
const ROBNEY_VISION_MODEL = "qwen/qwen3.6-27b";
const ROBNEY_MAX_DOC_CHARS = 6000; // keep extracted document text light enough to avoid 413s

function robneySetAttachment(att){
  robneyAttachment = att;
  renderRobneyAttachChip();
}

function renderRobneyAttachChip(){

// Resize/compress an image client-side before sending, so a multi-MB phone
// photo doesn't blow the request-size or token budget.
function robneyResizeImage(file, maxDim, quality){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=> reject(new Error("Imeshindwa kusoma picha"));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=> reject(new Error("Imeshindwa kufungua picha"));
      img.onload = ()=>{
        let {width,height} = img;
        if(width > maxDim || height > maxDim){
          if(width >= height){ height = Math.round(height * (maxDim/width)); width = maxDim; }
          else{ width = Math.round(width * (maxDim/height)); height = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// Lazy-load pdf.js from cdnjs only when a PDF is actually attached.
let robneyPdfJsLoading = null;
function robneyLoadPdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(robneyPdfJsLoading) return robneyPdfJsLoading;
  robneyPdfJsLoading = new Promise((resolve,reject)=>{
    const script = document.createElement("script");
    script.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.js";
    script.onload = ()=>{
      try{
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.js";
        resolve(window.pdfjsLib);
      }catch(e){ reject(e); }
    };
    script.onerror = ()=> reject(new Error("Imeshindwa kupakua PDF reader"));
    document.head.appendChild(script);
  });
  return robneyPdfJsLoading;
}

async function robneyExtractPdfText(file){
  const pdfjsLib = await robneyLoadPdfJs();
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: buf}).promise;
  let text = "";
  const maxPages = Math.min(pdf.numPages, 15); // keep it light
  for(let p=1; p<=maxPages; p++){
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    text += content.items.map(it=>it.str).join(" ") + "\n";
    if(text.length > ROBNEY_MAX_DOC_CHARS) break;
  }
  return text.trim();
}

async function handleRobneyFileSelect(file){
  if(!file) return;
  try{
    if(file.type.startsWith("image/")){
      const dataUrl = await robneyResizeImage(file, 1024, 0.72);
      robneySetAttachment({kind:"image", name:file.name, mime:"image/jpeg", dataUrl});
    }else if(file.type === "application/pdf" || file.name.toLowerCase().endsWith(".pdf")){
      showToast("Inasoma PDF...");
      let text = await robneyExtractPdfText(file);
      let truncated = false;
      if(text.length > ROBNEY_MAX_DOC_CHARS){ text = text.slice(0, ROBNEY_MAX_DOC_CHARS); truncated = true; }
      if(!text){ showToast("PDF hii haina maandishi yanayosomeka (labda ni picha tu)."); return; }
      robneySetAttachment({kind:"document", name:file.name, text, truncated});
    }else if(file.type === "text/plain" || file.name.toLowerCase().endsWith(".txt")){
      const text = await file.text();
      const truncated = text.length > ROBNEY_MAX_DOC_CHARS;
      robneySetAttachment({kind:"document", name:file.name, text: text.slice(0,ROBNEY_MAX_DOC_CHARS), truncated});
    }else{
      showToast("Aina hii ya faili haitumiki. Tumia picha, .pdf au .txt.");
    }
  }catch(err){
    console.error("ROBNEY attach:",err);
    showToast("Imeshindwa kusoma faili hiyo.");
  }
}

function robneyContext(){
  const role = state.profile.role;
  const mySales = role === "Cashier"
    ? state.sales.filter(s => s.cashierUid === state.user.uid)
    : state.sales;

  const salesTotal = mySales.reduce((n,s)=>n + Number(s.total||0),0);

  // Avoid sending the entire product catalog on every request — large stores
  // (hundreds/thousands of items) can blow past the AI server's request-size
  // limit (413 Request Entity Too Large). Send a capped, useful slice instead:
  // low-stock/reorder items first (most actionable), then fill up to the cap.
  const MAX_PRODUCTS_IN_CONTEXT = 60;
  const allProducts = state.products.map(p => ({
    name:p.name,
    stock:Number(p.stock||0),
    reorder:Number(p.reorder||0),
    price:Number(p.price||0)
  }));
  const lowStock = allProducts.filter(p => p.stock <= p.reorder);
  const rest = allProducts.filter(p => p.stock > p.reorder);
  const productSummary = [...lowStock, ...rest].slice(0, MAX_PRODUCTS_IN_CONTEXT);

  const ctx = {
    assistant:"ROBNEY",
    role,
    language:"sw",
    permissions: role === "Administrator" || role === "Manager"
      ? ["sales","revenue","inventory","customers","purchases","expenses","shifts"]
      : role === "Inventory"
        ? ["inventory","purchases","suppliers","stockMoves"]
        : ["products","customers","ownSales","ownShift"],
    salesCount:mySales.length,
    salesTotal,
    totalProductCount: allProducts.length,
    productsNote: allProducts.length > MAX_PRODUCTS_IN_CONTEXT
      ? `Zimeonyeshwa bidhaa ${MAX_PRODUCTS_IN_CONTEXT} tu (za low-stock kwanza) kati ya ${allProducts.length} zilizopo, ili kupunguza ukubwa wa ujumbe.`
      : undefined,
    products:productSummary
  };

  // Financial data is deliberately excluded from non-finance roles.
  if(role === "Administrator" || role === "Manager"){
    ctx.totalRevenue = state.sales.reduce((n,s)=>n + Number(s.total||0),0);
    ctx.averageSale = state.sales.length ? ctx.totalRevenue/state.sales.length : 0;
    ctx.customerCount = state.customers.length;
    ctx.purchaseCount = state.purchases.length;
    ctx.expenseTotal = state.expenses.reduce((n,e)=>n + Number(e.amount||0),0);
  }

  return ctx;
}

// Lightweight markdown renderer for ROBNEY's AI replies: handles **bold**,
// pipe tables, bullet/numbered lists, and paragraphs. Escapes HTML first so
// nothing from the AI response (or underlying data) can inject markup.
function robneyMarkdownToHtml(raw){
  const text = escapeHtml(String(raw||"")).replace(/\r\n/g,"\n");
  const lines = text.split("\n");
  const isTableRow = l => /^\s*\|.*\|\s*$/.test(l);
  const isTableSep = l => /^\s*\|?[\s:|-]+\|?\s*$/.test(l) && l.includes("-");
  const inline = s => s
    .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
    .replace(/`([^`]+?)`/g,"<code>$1</code>");

  let html = "";
  let i = 0;
  while(i < lines.length){
    const line = lines[i];

    // Markdown table: header row, separator row, then body rows
    if(isTableRow(line) && lines[i+1] && isTableSep(lines[i+1])){
      const splitRow = l => l.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
      const header = splitRow(line);
      let j = i + 2;
      const rows = [];
      while(j < lines.length && isTableRow(lines[j])){
        rows.push(splitRow(lines[j]));
        j++;
      }
      html += "<table><thead><tr>" + header.map(h=>`<th>${inline(h)}</th>`).join("") + "</tr></thead><tbody>" +
        rows.map(r=>"<tr>" + r.map(c=>`<td>${inline(c)}</td>`).join("") + "</tr>").join("") +
        "</tbody></table>";
      i = j;
      continue;
    }

    // Bullet or numbered list block
    if(/^\s*[-*]\s+/.test(line) || /^\s*\d+\.\s+/.test(line)){
      const ordered = /^\s*\d+\.\s+/.test(line);
      const tag = ordered ? "ol" : "ul";
      const items = [];
      while(i < lines.length && (/^\s*[-*]\s+/.test(lines[i]) || /^\s*\d+\.\s+/.test(lines[i]))){
        items.push(lines[i].replace(/^\s*([-*]|\d+\.)\s+/,""));
        i++;
      }
      html += `<${tag}>` + items.map(it=>`<li>${inline(it)}</li>`).join("") + `</${tag}>`;
      continue;
    }

    // Blank line: skip (paragraph breaks handled by grouping below)
    if(line.trim()===""){ i++; continue; }

    // Paragraph: gather consecutive non-blank, non-table, non-list lines
    const paraLines = [];
    while(i < lines.length && lines[i].trim()!=="" &&
          !(isTableRow(lines[i]) && lines[i+1] && isTableSep(lines[i+1])) &&
          !/^\s*[-*]\s+/.test(lines[i]) && !/^\s*\d+\.\s+/.test(lines[i])){
      paraLines.push(lines[i]);
      i++;
    }
    html += `<p>${paraLines.map(inline).join("<br>")}</p>`;
  }
  return html;
}

function appendRobneyMessage(type,text,attachment){
  const chat=document.getElementById("robneyChat");
  if(!chat) return;
  const row=document.createElement("div");
  row.className=`robney-msg ${type}`;
  const bubble=document.createElement("div");
  bubble.className="robney-bubble";
  if(type==="ai"){
    bubble.innerHTML=robneyMarkdownToHtml(text);
  }else{
    bubble.textContent=text;
  }
  if(attachment){
    const wrap=document.createElement("div");
    wrap.className="robney-msg-attachment";
    if(attachment.kind==="image"){
      const img=document.createElement("img");
      img.src=attachment.dataUrl;
      wrap.appendChild(img);
    }else{
      const tag=document.createElement("span");
      tag.className="robney-doc-tag";
      tag.textContent=`📄 ${attachment.name}`;
      wrap.appendChild(tag);
    }
    bubble.appendChild(wrap);
  }
  row.appendChild(bubble);
  chat.appendChild(row);
  chat.scrollTop=chat.scrollHeight;
}

async function askRobney(question, _isRetry, _retryAttachment){
  const q=String(question||"").trim();
  const attachment = _isRetry ? _retryAttachment : robneyAttachment;
  if(!q && !attachment) return;

  const key = getRobneyKey();
  if(!key){
    appendRobneyMessage("user",q||"(faili tu, bila maandishi)",attachment);
    appendRobneyMessage("ai", "Bado hujaweka AI key yako binafsi. Bofya 'Weka AI Key Yangu' juu ya ukurasa huu — huna key? Tembelea console.groq.com kutengeneza account ya bure na kupata key yako mwenyewe.");
    return;
  }

  if(!_isRetry){
    appendRobneyMessage("user",q||"(faili tu, bila maandishi)",attachment);
    const input=document.getElementById("robneyInput");
    if(input) input.value="";
    robneySetAttachment(null); // clear staged attachment now that it's "sent"
    appendRobneyMessage("ai","ROBNEY anachambua...");
  }

  const role = state.profile.role;

  // Build this turn's outgoing user content. Images go to a vision-capable
  // model (compound-mini has no vision support); documents get their
  // extracted text folded into a plain-text turn on the normal model.
  let modelForThisTurn = ROBNEY_MODEL;
  let turnUserContent = q || "Nipe muhtasari.";
  if(attachment && attachment.kind === "image"){
    modelForThisTurn = ROBNEY_VISION_MODEL;
    turnUserContent = [
      { type:"text", text: q || "Eleza kinachoonekana kwenye picha hii, ukizingatia muktadha wa duka." },
      { type:"image_url", image_url:{ url: attachment.dataUrl } }
    ];
  }else if(attachment && attachment.kind === "document"){
    turnUserContent = `Nyaraka iliyoambatanishwa ("${attachment.name}"${attachment.truncated ? ", maudhui yamepunguzwa kwa sababu ni ndefu" : ""}):\n"""\n${attachment.text}\n"""\n\nSwali la mtumiaji: ${q || "Nipe muhtasari wa nyaraka hii."}`;
  }

  try{
    const response=await fetch(ROBNEY_API_URL,{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization": `Bearer ${key}`
      },
      body:JSON.stringify({
        model: modelForThisTurn,
        // groq/compound-mini does NOT support "reasoning_format" (Groq returns a 400
        // invalid_request_error if it's included), so only send it for models that
        // actually emit <think> reasoning blocks that need to be hidden.
        ...(modelForThisTurn === ROBNEY_VISION_MODEL ? { reasoning_format: "hidden" } : {}),
        messages: [
          { role:"system", content: robneySystemInstruction(role) },
          { role:"user", content: `Context ya sasa (JSON, tumia hii tu):\n${JSON.stringify(robneyContext())}` },
          ...robneyHistory.slice(-6), // prior turns only — kept as lightweight text
          { role:"user", content: turnUserContent }
        ]
      })
    });
    if(!response.ok){
      const errBody = await response.text().catch(()=> "");
      const err = new Error(`AI server returned ${response.status} ${errBody.slice(0,200)}`);
      err.status = response.status;
      throw err;
    }
    const data=await response.json();
    // Defensive fallback: if a <think>...</think> block still slips through
    // (some models/params combos leave it inline), strip it before showing it.
    let answer = data?.choices?.[0]?.message?.content || "ROBNEY haikupata jibu.";
    answer = answer.replace(/<think>[\s\S]*?<\/think>/gi,"").trim() || answer;

    // Store a lightweight placeholder for this turn in history — never the
    // raw base64 image or the full document text — so later turns don't
    // keep re-sending (and re-billing) that payload.
    const historyPlaceholder = attachment
      ? `${q || (attachment.kind==="image" ? "[picha imetumwa]" : "[faili imetumwa]")} [ameambatanisha: ${attachment.name}]`
      : q;
    robneyHistory.push({role:"user", content: historyPlaceholder});
    robneyHistory.push({role:"assistant", content: answer});

    const chat=document.getElementById("robneyChat");
    if(chat && chat.lastElementChild) chat.removeChild(chat.lastElementChild);
    appendRobneyMessage("ai",answer);
  }catch(err){
    // Rate limit (429): wait briefly and retry once automatically before giving up.
    if(err && err.status === 429 && !_isRetry){
      await new Promise(r=>setTimeout(r,4000));
      return askRobney(q, true, attachment);
    }

    const chat=document.getElementById("robneyChat");
    if(chat && chat.lastElementChild) chat.removeChild(chat.lastElementChild);

    const msg = err && err.status === 429
      ? "ROBNEY ana maswali mengi kwa dakika hii (free tier ina kikomo). Subiri sekunde chache kisha jaribu tena."
      : "ROBNEY imeshindwa kupata jibu kutoka Groq. Angalia: (1) API key iko sahihi (inaanza na gsk_), (2) huna umeshamaliza free quota ya siku, (3) una internet.\n\nTaarifa ya kiufundi: " + (err && err.message ? err.message : String(err));
    appendRobneyMessage("ai",msg);
    console.error("ROBNEY:",err);
  }
}

function renderTicker(){
  const role = state.profile.role;
  const list = role==="Cashier" ? state.sales.filter(s=>s.cashierUid===state.user.uid) : state.sales;
  const recent = list.slice(0,8);

        ${recent.length===0 ? `<p class="empty-note">Hakuna mauzo bado.</p>` :
          recent.map(s=>`<div class="ticker-row"><div class="ticker-row-top"><span>#${s.number}</span><span>${s.date}</span></div><div class="ticker-row-bottom"><span class="ticker-name">${escapeHtml(s.customerName)}</span><span class="ticker-amt">${fmt(s.total)}</span></div></div>`).join("")}
      </div>
    </div>`;
}
function renderLineChart(data){
  const w=560,h=210,padL=42,padB=22,padT=10,padR=8;
  const max = Math.max(1, ...data.map(d=>d.revenue));
  const stepX = (w-padL-padR)/(data.length-1||1);
  const points = data.map((d,i)=>({x:padL+i*stepX, y:padT+(h-padT-padB)*(1-d.revenue/max), ...d}));
  const path = points.map((p,i)=>(i===0?"M":"L")+p.x.toFixed(1)+" "+p.y.toFixed(1)).join(" ");
  const gridY=[0,0.5,1].map(f=>padT+(h-padT-padB)*f);
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    ${gridY.map(y=>`<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="#e7e2d6" stroke-width="1"/>`).join("")}
    <path d="${path}" fill="none" stroke="#d97706" stroke-width="2.2"/>
    ${points.map((p,i)=> i%2===0 ? `<text x="${p.x}" y="${h-4}" font-size="8.5" fill="#78716c" text-anchor="middle">${p.date}</text>` : "").join("")}
    <text x="${padL-6}" y="${padT+6}" font-size="8.5" fill="#78716c" text-anchor="end">${fmt(max).replace('TZS ','')}</text>
    <text x="${padL-6}" y="${h-padB}" font-size="8.5" fill="#78716c" text-anchor="end">0</text>
  </svg>`;
}

/* ============================================================
   MY SHIFT (Shift Reconciliation)
============================================================ */
function currentOpenShift(){
  return state.shifts.find(s=> s.cashierUid===state.user.uid && s.status==="open");
}
function salesDuringShift(shift){
  if(!shift) return [];
  const start = new Date(shift.startTime).getTime();
  const end = shift.endTime ? new Date(shift.endTime).getTime() : Date.now();
  return state.sales.filter(s=>{
    if(s.cashierUid!==shift.cashierUid || s.status==="refunded") return false;
    const t = s.createdAt && s.createdAt.toDate ? s.createdAt.toDate().getTime() : new Date(s.date+"T"+s.time).getTime();
    return t>=start && t<=end;
  });
}
function renderMyShift(){
  const shift = currentOpenShift();
  if(!shift){
    const lastClosed = state.shifts.filter(s=>s.cashierUid===state.user.uid && s.status==="closed").sort((a,b)=> new Date(b.endTime)-new Date(a.endTime))[0];
    return `
      <div class="view-header"><div><h1>My Shift</h1><p>Anza shift yako kabla ya kuanza kuuza.</p></div></div>
      <div class="card" style="max-width:420px;">
        <h2>Anza Shift Mpya</h2>
        <div class="field"><label>Fedha taslimu mfukoni (Starting Cash)</label>
          <input type="number" min="0" id="startCashInput" placeholder="0" value="${escapeHtml(state.shiftStartCash)}"/></div>
        <button class="btn btn-amber btn-block" id="startShiftBtn">${ICONS.clock} Anza Shift</button>
      </div>
      ${lastClosed ? `
      <div class="card" style="max-width:420px;margin-top:16px;">
        <h2>Shift ya Mwisho</h2>
        <div class="subtotal-row"><span>Ilifungwa</span><span>${new Date(lastClosed.endTime).toLocaleString("en-GB")}</span></div>
        <div class="subtotal-row"><span>Tofauti (Difference)</span><span class="mono" style="color:${Math.abs(lastClosed.difference)<1?'var(--green)':'var(--red)'};">${fmt(lastClosed.difference)}</span></div>
      </div>` : ""}
    `;
  }
  const mySales = salesDuringShift(shift);
  const cashSales = mySales.filter(s=>s.paymentMethod==="Cash").reduce((sum,s)=>sum+s.total,0);
  const otherSales = mySales.reduce((sum,s)=>sum+s.total,0) - cashSales;
  const expectedCash = (shift.startCash||0) + cashSales;
  return `
    <div class="view-header"><div><h1>My Shift</h1><p>Shift ilianza ${new Date(shift.startTime).toLocaleString("en-GB")}</p></div></div>
    <div class="kpi-grid">
      <div class="kpi-card"><div class="kpi-top"><span class="kpi-label">Mauzo (jumla)</span><div class="kpi-icon green">${ICONS.trend}</div></div><div class="kpi-value">${fmt(cashSales+otherSales)}</div><div class="kpi-sub">${mySales.length} sales</div></div>
      <div class="kpi-card"><div class="kpi-top"><span class="kpi-label">Mauzo ya Cash</span><div class="kpi-icon amber">${ICONS.receipt}</div></div><div class="kpi-value">${fmt(cashSales)}</div></div>
      <div class="kpi-card"><div class="kpi-top"><span class="kpi-label">Njia Nyingine</span><div class="kpi-icon slate">${ICONS.report}</div></div><div class="kpi-value">${fmt(otherSales)}</div></div>
      <div class="kpi-card"><div class="kpi-top"><span class="kpi-label">Cash Inayotarajiwa</span><div class="kpi-icon slate">${ICONS.clock}</div></div><div class="kpi-value">${fmt(expectedCash)}</div><div class="kpi-sub">Starting: ${fmt(shift.startCash||0)}</div></div>
    </div>
    <div class="card" style="max-width:420px;">
      <h2>Maliza Shift (Reconciliation)</h2>
      <div class="field"><label>Fedha taslimu ulizohesabu sasa (Counted Cash)</label>
        <input type="number" min="0" id="endCashInput" placeholder="0" value="${escapeHtml(state.shiftEndCash)}"/></div>
      <button class="btn btn-amber btn-block" id="endShiftBtn">${ICONS.clock} Funga Shift</button>
    </div>
  `;
}

function computeSaleLines(){
  const lines = state.cart.map(c=>{
    const p = state.products.find(x=>x.id===c.productId);
    return {...c, product:p, lineTotal: p.price*c.qty};
  });
  const subtotal = lines.reduce((s,l)=>s+l.lineTotal,0);
  let discountAmount = 0;
  if(state.discountType==="percent"){
    const pct = Math.min(100, Math.max(0, Number(state.discountValue)||0));
    discountAmount = subtotal * pct/100;
  } else if(state.discountType==="amount"){
    discountAmount = Math.min(subtotal, Math.max(0, Number(state.discountValue)||0));
  }
  const total = Math.max(0, subtotal - discountAmount);
  return {lines, subtotal, discountAmount, total};
}

function updateDiscountPreview(){
  const {subtotal, discountAmount, total} = computeSaleLines();
  const totalEl = document.querySelector(".cart-total-val");
  if(totalEl) totalEl.textContent = fmt(total);
  const discountRows = document.querySelectorAll(".subtotal-row");
  if(discountRows.length >= 2){
    discountRows[0].querySelector(".mono").textContent = fmt(subtotal);
    discountRows[1].querySelector(".mono").textContent = "−" + fmt(discountAmount);
  }
  const paid = Number(state.amountPaid)||0;
  const changeEl = document.getElementById("changePreview");
  if(changeEl) changeEl.textContent = fmt(Math.max(0, paid-total));
}

/* ============================================================
   MONTHLY REPORT
============================================================ */
function renderReport(){
  const [y,m] = state.reportMonth.split("-").map(Number);
  const prevDate = new Date(y, m-2, 1);
  const prevKey = `${prevDate.getFullYear()}-${String(prevDate.getMonth()+1).padStart(2,"0")}`;

  const salesThis = state.sales.filter(s=>monthKey(s.date)===state.reportMonth);
  const salesPrev = state.sales.filter(s=>monthKey(s.date)===prevKey);

  const calc = (list)=>{
    let revenue=0, cogs=0;
    const productTotals = {};
    list.forEach(s=>{
      revenue += s.total;
      s.items.forEach(it=>{
        const cost = (it.cost||0)*it.qty;
        cogs += cost;
        productTotals[it.name] = (productTotals[it.name]||0) + it.lineTotal;
      });
    });
    const profit = revenue - cogs;
    return {revenue, cogs, profit, productTotals};
  };
  const cur = calc(salesThis);
  const prev = calc(salesPrev);

  const pctChange = (a,b)=> b===0 ? (a===0?0:100) : ((a-b)/b*100);
  const revChange = pctChange(cur.revenue, prev.revenue);
  const profitChange = pctChange(cur.profit, prev.profit);

  const topProducts = Object.entries(cur.productTotals).sort((a,b)=>b[1]-a[1]).slice(0,5);

  const monthOptions = [...Array(12)].map((_,i)=>{
    const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()-i);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
    const label = d.toLocaleDateString("en-GB",{month:"long", year:"numeric"});
    return `<option value="${key}" ${key===state.reportMonth?"selected":""}>${label}</option>`;
  }).join("");

  const trendBadge = (val)=> val>=0
    ? `<span class="kpi-sub up">▲ ${val.toFixed(1)}% vs last month</span>`
    : `<span class="kpi-sub down">▼ ${Math.abs(val).toFixed(1)}% vs last month</span>`;

  return `
    <div class="view-header">
      <div><h1>Monthly Report</h1><p>Faida na mauzo kwa mwezi uliochaguliwa.</p></div>
      <select id="reportMonthSelect" style="max-width:200px;">${monthOptions}</select>
    </div>
    <div class="kpi-grid">
      <div class="kpi-card"><div class="kpi-top"><span class="kpi-label">Revenue</span><div class="kpi-icon green">${ICONS.trend}</div></div><div class="kpi-value">${fmt(cur.revenue)}</div>${trendBadge(revChange)}</div>
      <div class="kpi-card"><div class="kpi-top"><span class="kpi-label">Cost of Goods</span><div class="kpi-icon slate">${ICONS.inventory}</div></div><div class="kpi-value">${fmt(cur.cogs)}</div></div>
      <div class="kpi-card"><div class="kpi-top"><span class="kpi-label">Net Profit</span><div class="kpi-icon amber">${ICONS.profit}</div></div><div class="kpi-value">${fmt(cur.profit)}</div>${trendBadge(profitChange)}</div>
      <div class="kpi-card"><div class="kpi-top"><span class="kpi-label">Sales Count</span><div class="kpi-icon slate">${ICONS.receipt}</div></div><div class="kpi-value">${salesThis.length}</div></div>
    </div>
    <div class="card">
      <h2>Bidhaa zinazouza zaidi (mwezi huu)</h2>
      ${topProducts.length===0 ? `<p class="empty-note">Hakuna mauzo mwezi huu.</p>` :
        `<table><tbody>${topProducts.map(([name,total])=>`<tr><td>${escapeHtml(name)}</td><td class="right mono">${fmt(total)}</td></tr>`).join("")}</tbody></table>`}
    </div>
  `;
}

async function startShift(){
  if(state.profile.role === "Cashier" && currentOpenShift()){
    showToast("Una shift ambayo bado iko wazi.");
    return;
  }
  const startCash = Number(state.shiftStartCash)||0;
  try{
    await addDoc(collection(db,"shifts"), {
      cashierUid: state.user.uid,
      cashierName: state.profile.name,
      startCash,
      startTime: new Date().toISOString(),
      status: "open",
      endTime: null, endCash: null, expectedCash: null, difference: null,
      createdAt: serverTimestamp()
    });
    await logAudit("Shift started", `${state.profile.name} — starting cash ${fmt(startCash)}`);
    state.shiftStartCash = "";
    showToast("Shift imeanza");
    render();
  }catch(e){ showToast("Hitilafu: "+e.message); }
}

async function endShift(){
  const shift = currentOpenShift();
  if(!shift) return;
  const endCash = Number(state.shiftEndCash)||0;
  const mySales = salesDuringShift(shift);
  const cashSales = mySales.filter(s=>s.paymentMethod==="Cash").reduce((sum,s)=>sum+s.total,0);
  const expectedCash = (shift.startCash||0) + cashSales;
  const difference = endCash - expectedCash;
  try{
    await updateDoc(doc(db,"shifts", shift.id), {
      endTime: new Date().toISOString(),
      endCash, expectedCash, difference,
      status: "closed"
    });
    await logAudit("Shift ended", `${state.profile.name} — difference ${fmt(difference)}`);
    state.shiftEndCash = "";
    showToast(`Shift imefungwa. Tofauti: ${fmt(difference)}`);
    render();
  }catch(e){ showToast("Hitilafu: "+e.message); }
}

function changeQty(productId, delta){
  const p = state.products.find(x=>x.id===productId);
  const c = state.cart.find(c=>c.productId===productId);
  if(!c) return;
  c.qty = Math.min(p.stock, Math.max(1, c.qty+delta));
  render();
}

async function completeSale(){
  const isCashier = state.profile.role === "Cashier";
  const activeShift = isCashier ? currentOpenShift() : null;

  // Cashier MUST have an open shift before completing a sale.
  // This is also enforced by Firestore Rules as the final security layer.
  if(isCashier && !activeShift){
    showToast("Anza shift yako kwanza kabla ya kufanya sale.");
    state.tab = "myshift";
    render();
    return;
  }

  const {lines, subtotal, discountAmount, total} = computeSaleLines();
  if(lines.length===0) return;
  const customer = state.customers.find(c=>c.id===state.saleCustomerId) || state.customers[0];
  if(!customer){ showToast("Ongeza mteja kwanza"); return; }
  if(lines.some(l=>l.qty > l.product.stock)){ showToast("Stock haitoshi kwa bidhaa moja au zaidi."); return; }
  const amountPaid = state.paymentMethod === "Cash" ? Number(state.amountPaid) : total;
  if(!Number.isFinite(amountPaid) || amountPaid < total){ showToast(`Kiasi kilicholipwa lazima kiwe angalau ${fmt(total)}.`); return; }
  const change = Math.max(0, amountPaid-total);

  const btn = document.getElementById("completeSaleBtn");
  if(btn){ btn.disabled=true; btn.innerHTML=`<span class="spinner"></span> Inakamilisha...`; }

  try{
    const sale = {
      number:saleNumber(), date:todayISO(),
      time:new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}),
      customerId:customer.id, customerName:customer.name,
      cashierUid:state.user.uid, cashierName:state.profile.name,
      // Cashier sales MUST belong to the currently open shift.
      shiftId: activeShift ? activeShift.id : null,
      items:lines.map(l=>({productId:l.product.id,name:l.product.name,qty:l.qty,cost:l.product.costPrice||0,price:l.product.price,lineTotal:l.lineTotal})),
      subtotal, discountType:state.discountType, discountValue:Number(state.discountValue)||0,
      discountAmount,total,paymentMethod:state.paymentMethod,amountPaid,change,status:"completed",
      createdAt:serverTimestamp()
    };
    const saleRef=doc(collection(db,"sales"));
    const customerRef=doc(db,"customers",customer.id);

    await runTransaction(db, async tx=>{
      const customerSnap=await tx.get(customerRef);
      if(!customerSnap.exists()) throw new Error("Mteja hakupatikana.");

      // Re-read the shift inside the transaction so the client cannot rely
      // only on an old cached state.
      let shiftSnap = null;
      if(isCashier){
        const shiftRef = doc(db,"shifts",activeShift.id);
        shiftSnap = await tx.get(shiftRef);
        if(!shiftSnap.exists()) throw new Error("Shift haikupatikana. Anza shift tena.");
        const liveShift = shiftSnap.data();
        if(liveShift.cashierUid !== state.user.uid || liveShift.status !== "open"){
          throw new Error("Shift yako haiko wazi. Anza shift tena kabla ya kuuza.");
        }
      }

      const productReads=[];
      for(const l of lines){
        const pRef=doc(db,"products",l.product.id);
        const pSnap=await tx.get(pRef);
        productReads.push({line:l,ref:pRef,snap:pSnap});
      }
      for(const x of productReads){
        if(!x.snap.exists()) throw new Error(`Bidhaa ${x.line.product.name} haipo.`);
        const stock=Number(x.snap.data().stock)||0;
        if(stock<x.line.qty) throw new Error(`Stock haitoshi: ${x.line.product.name} (imebaki ${stock}).`);
      }
      for(const x of productReads){
        const stock=Number(x.snap.data().stock)||0;
        tx.update(x.ref,{stock:stock-x.line.qty});
        tx.set(doc(collection(db,"stockMoves")),{
          productId:x.line.product.id,
          productName:x.line.product.name,
          type:"sale",
          qty:-x.line.qty,
          referenceId:saleRef.id,
          shiftId: activeShift ? activeShift.id : null,
          actorUid:state.user.uid,
          actorName:state.profile.name,
          createdAt:serverTimestamp()
        });
      }
      const c=customerSnap.data();
      tx.update(customerRef,{totalSpent:(c.totalSpent||0)+total,orders:(c.orders||0)+1});
      tx.set(saleRef,sale);
    });

    await logAudit("Sale created",`#${sale.number} — ${fmt(sale.total)} (${sale.paymentMethod})`);
    state.cart=[]; state.discountType="none"; state.discountValue=""; state.amountPaid="";
    showToast(`Sale #${sale.number} completed — ${fmt(sale.total)}`);
    state.tab="history"; render(); openReceiptModal({...sale,id:saleRef.id});
  }catch(e){
    console.error(e);
    showToast("Sale haikukamilika: "+e.message);
    render();
  }
}

/* ============================================================
   BARCODE SCANNER
   Uses the native BarcodeDetector API where available (Chrome/Android).
   Falls back to a message telling the user to type the code manually
   on devices/browsers that don't support it (e.g. iOS Safari).
============================================================ */
let scannerStream = null;
function stopScanner(){
  if(scannerStream){ scannerStream.getTracks().forEach(t=>t.stop()); scannerStream=null; }
}
async function openScannerModal(onResult){
  const supported = "BarcodeDetector" in window;
  document.getElementById("modalRoot").innerHTML = `
    <div class="modal-overlay" id="overlay">
      <div class="modal">
        <div class="modal-head"><h3>Scan Barcode</h3><button class="icon-btn" id="closeModalBtn">${ICONS.close}</button></div>
        <div class="modal-body">
          ${supported ? `
            <div class="scanner-wrap"><video id="scannerVideo" playsinline autoplay muted></video><div class="scanner-frame"></div></div>
            <p class="scanner-hint">Elekeza kamera kwenye barcode ya bidhaa.</p>
          ` : `
            <p class="empty-note">Kifaa/kivinjari chako hakina msaada wa kusoma barcode moja kwa moja. Andika namba ya barcode chini.</p>
            <div class="field"><label>Namba ya Barcode</label><input id="manualBarcodeInput" placeholder="Andika barcode"/></div>
            <button class="btn btn-amber btn-block" id="manualBarcodeBtn">Tumia namba hii</button>
          `}
        </div>
      </div>
    </div>`;
  const close = ()=>{ stopScanner(); closeModal(); };
  document.getElementById("closeModalBtn").addEventListener("click", close);
  document.getElementById("overlay").addEventListener("click", e=>{ if(e.target.id==="overlay") close(); });

  if(!supported){
    document.getElementById("manualBarcodeBtn").addEventListener("click", ()=>{
      const val = document.getElementById("manualBarcodeInput").value.trim();
      if(val){ close(); onResult(val); }
    });
    return;
  }

  try{
    scannerStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    const video = document.getElementById("scannerVideo");
    if(!video) { stopScanner(); return; } // modal was closed before camera opened
    video.srcObject = scannerStream;
    const detector = new BarcodeDetector();
    let stopped = false;
    const tick = async ()=>{
      if(stopped) return;
      try{
        const codes = await detector.detect(video);
        if(codes.length>0){
          stopped = true;
          const value = codes[0].rawValue;
          close();
          onResult(value);
          return;
        }
      }catch(e){ /* keep trying */ }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }catch(e){
    document.getElementById("modalRoot").querySelector(".modal-body").innerHTML =
      `<p class="empty-note">Imeshindikana kufungua kamera: ${escapeHtml(e.message)}. Hakikisha umeruhusu ufikiaji wa kamera.</p>`;
  }
}

  const p = product || {name:"",sku:"",category:"",costPrice:"",price:"",stock:"",reorder:"5",barcode:""};
  const canSeeFin = CAN_SEE_FINANCE(state.profile.role);

function normalizePhone(phone){
  let p=String(phone||"").replace(/[^0-9+]/g,"");
  if(p.startsWith("+") ) p=p.slice(1);
  if(p.startsWith("0")) p="255"+p.slice(1);
  return p;
}
function receiptText(sale, whatsapp=false){
  const customer=state.customers.find(c=>c.id===sale.customerId);
  const lines=(sale.items||[]).map(it=>`${it.name} x${it.qty} = ${fmt(it.lineTotal)}`).join("\n");
  const sep=whatsapp?"━━━━━━━━━━━━━━━━": "--------------------------------";
  const bold=whatsapp?"*":"";
  return `${bold}DUKA MANAGER${bold}\nDodoma, Tanzania\nTel: 07XXXXXXXX\n\n${sep}\nRECEIPT: ${sale.number}\nDate: ${sale.date} ${sale.time}\nCashier: ${sale.cashierName||"—"}${customer?.phone?`\nCustomer: ${customer.name} (${customer.phone})`:""}\n${sep}\nITEMS\n${lines}\n${sep}\nSUBTOTAL: ${fmt(sale.subtotal)}\nDISCOUNT: ${fmt(sale.discountAmount||0)}\n${bold}TOTAL: ${fmt(sale.total)}${bold}\n\nPayment: ${sale.paymentMethod||"—"}\nPaid: ${fmt(sale.amountPaid ?? sale.total)}\nChange: ${fmt(sale.change ?? 0)}\n${sep}\n\n${bold}THANK YOU!${bold}\n${bold}Karibu tena.${bold}`;
}
function sendReceiptWhatsApp(sale){
  const customer=state.customers.find(c=>c.id===sale.customerId);
  const phone=normalizePhone(customer?.phone);
  if(!phone){ showToast("Mteja hana namba ya simu."); return; }
  window.open(`https://wa.me/${phone}?text=${encodeURIComponent(receiptText(sale,true))}`,"_blank");
}

async function deleteSalePermanently(sale){
  if(!CAN_DELETE_SALE(state.profile.role)){ showToast("Administrator pekee ndiye anaweza kufuta sale."); return; }
  if(sale.status === "refunded"){
    showToast("Sale hii tayari ime-reverse/refund; haiwezi kufutwa kama sale hai.");
    return;
  }
  const ok=confirm(`DELETE SALE #${sale.number}\n\nHii itaondoa sale kabisa, irudishe stock na isahihishe taarifa za mteja. Hatua hii haiwezi kutenduliwa.\n\nEndelea?`);
  if(!ok) return;
  try{
    const saleRef=doc(db,"sales",sale.id);
    const customerRef=sale.customerId ? doc(db,"customers",sale.customerId) : null;
    await runTransaction(db,async tx=>{
      const saleSnap=await tx.get(saleRef);
      if(!saleSnap.exists()) throw new Error("Sale haipo.");
      const liveSale=saleSnap.data();
      if(liveSale.status === "refunded") throw new Error("Sale tayari ime-refund.");

      const customerSnap=customerRef ? await tx.get(customerRef) : null;
      const productReads=[];
      for(const it of (liveSale.items||[])){
        if(!it.productId) throw new Error(`Sale #${liveSale.number||sale.number} haina productId ya ${it.name}.`);
        const pRef=doc(db,"products",it.productId);
        const pSnap=await tx.get(pRef);
        productReads.push({it,pRef,pSnap});
      }

      if(customerSnap?.exists()){
        const c=customerSnap.data();
        tx.update(customerRef,{
          totalSpent:Math.max(0,(c.totalSpent||0)-(liveSale.total||0)),
          orders:Math.max(0,(c.orders||0)-1)
        });
      }

      for(const x of productReads){
        if(!x.pSnap.exists()) throw new Error(`Bidhaa ${x.it.name} haipo kwenye inventory.`);
        const p=x.pSnap.data();
        tx.update(x.pRef,{stock:(p.stock||0)+x.it.qty});
        tx.set(doc(collection(db,"stockMoves")),{
          productId:x.it.productId,
          productName:x.it.name,
          type:"sale_delete_reversal",
          qty:x.it.qty,
          referenceId:sale.id,
          shiftId:liveSale.shiftId || null,
          actorUid:state.user.uid,
          actorName:state.profile.name,
          createdAt:serverTimestamp()
        });
      }
      tx.delete(saleRef);
    });
    await logAudit("Sale permanently deleted",`#${sale.number} — ${fmt(sale.total)} — stock restored`);
    showToast(`Sale #${sale.number} imefutwa na stock imerudishwa.`);
    closeModal();
    render();
  }catch(e){ showToast("Delete sale haikukamilika: "+e.message); }
}

function auditLogTime(a){
  if(a.createdAt?.toDate) return a.createdAt.toDate().getTime();
  if(a.date){
    const t=String(a.time||"00:00");
    const parsed=new Date(`${a.date}T${t}`);
    if(!Number.isNaN(parsed.getTime())) return parsed.getTime();
  }
  return NaN;
}

async function deleteAuditLogsOlderThan30Days(){
  if(!CAN_MANAGE_USERS(state.profile.role)){ showToast("Administrator pekee ndiye anaweza kufanya audit cleanup."); return; }
  const cutoff=Date.now()-(30*24*60*60*1000);
  const oldLogs=state.auditLog.filter(a=>{ const t=auditLogTime(a); return Number.isFinite(t) && t<cutoff; });
  if(oldLogs.length===0){ showToast("Hakuna audit logs za zaidi ya siku 30."); return; }
  const ok=confirm(`Futa audit logs ${oldLogs.length} za zaidi ya siku 30?\n\nLogs hizi zitaondolewa kabisa na hatua haiwezi kutenduliwa.`);
  if(!ok) return;
  try{
    // Firestore batches support up to 500 writes; use 450 for a safe margin.
    for(let i=0;i<oldLogs.length;i+=450){
      const batch=writeBatch(db);
      oldLogs.slice(i,i+450).forEach(a=>batch.delete(doc(db,"auditLog",a.id)));
      await batch.commit();
    }
    showToast(`${oldLogs.length} audit logs zimefutwa.`);
    render();
  }catch(e){ showToast("Audit cleanup haikukamilika: "+e.message); }
}

async function refundSale(sale){
  if(!confirm(`Una uhakika unataka kurefund Sale #${sale.number} — ${fmt(sale.total)}?`)) return;
  try{
    const saleRef=doc(db,"sales",sale.id);
    const customerRef=doc(db,"customers",sale.customerId);
    await runTransaction(db,async tx=>{
      const saleSnap=await tx.get(saleRef);
      if(!saleSnap.exists()) throw new Error("Sale haipo.");
      const liveSale=saleSnap.data();
      if(liveSale.status==="refunded") throw new Error("Sale tayari ime-refund.");
      const cSnap=await tx.get(customerRef);
      const productReads=[];
      for(const it of (liveSale.items||[])){
        if(!it.productId) throw new Error(`Sale ya zamani haina productId: ${it.name}`);
        const pRef=doc(db,"products",it.productId);
        const pSnap=await tx.get(pRef);
        productReads.push({it,pRef,pSnap});
      }
      if(cSnap.exists()){
        const c=cSnap.data();
        tx.update(customerRef,{totalSpent:Math.max(0,(c.totalSpent||0)-liveSale.total),orders:Math.max(0,(c.orders||0)-1)});
      }
      for(const x of productReads){
        if(x.pSnap.exists()){
          const p=x.pSnap.data();
          tx.update(x.pRef,{stock:(p.stock||0)+x.it.qty});
          tx.set(doc(collection(db,"stockMoves")),{productId:x.it.productId,productName:x.it.name,type:"refund",qty:x.it.qty,referenceId:sale.id,shiftId:liveSale.shiftId || null,actorUid:state.user.uid,actorName:state.profile.name,createdAt:serverTimestamp()});
        }
      }
      tx.update(saleRef,{status:"refunded",refundedAt:serverTimestamp(),refundedBy:state.user.uid});
    });
    await logAudit("Sale refunded",`#${sale.number} — ${fmt(sale.total)}`);
    showToast(`Sale #${sale.number} ime-refund`);
    closeModal();
  }catch(e){ showToast("Refund haikukamilika: "+e.message); }
}

function renderExpenses(){
  const total=state.expenses.reduce((a,e)=>a+(Number(e.amount)||0),0);
  const canDelete = CAN_DELETE_EXPENSE(state.profile.role); // Administrator only, per rules
  return `<div class="view-header"><div><h1>Expenses</h1><p>Gharama za biashara na net profit.</p></div><button class="btn btn-dark" id="addExpenseBtn">${ICONS.plus} Ongeza expense</button></div>
    <div class="kpi-grid"><div class="kpi-card"><div class="kpi-label">Total Expenses</div><div class="kpi-value">${fmt(total)}</div></div></div>
    <div class="table-card"><table><thead><tr><th>Date</th><th>Category</th><th>Description</th><th class="right">Amount</th><th></th></tr></thead><tbody>
    ${state.expenses.length?state.expenses.map(e=>`<tr><td>${escapeHtml(e.date||"")}</td><td>${escapeHtml(e.category||"")}</td><td>${escapeHtml(e.description||"")}</td><td class="right mono">${fmt(e.amount)}</td><td>${canDelete?`<button class="icon-btn danger" data-del-expense="${e.id}">${ICONS.trash}</button>`:""}</td></tr>`).join(""):`<tr class="empty-row"><td colspan="5">Hakuna expenses.</td></tr>`}
    </tbody></table></div>`;
}
function openExpenseModal(){
  document.getElementById("modalRoot").innerHTML=`<div class="modal-overlay" id="overlay"><div class="modal"><div class="modal-head"><h3>Ongeza Expense</h3><button class="icon-btn" id="closeModalBtn">${ICONS.close}</button></div><div class="modal-body"><form id="expenseForm">
  <div class="field"><label>Category</label><select id="exCat">${EXPENSE_CATEGORIES.map(x=>`<option>${x}</option>`).join("")}</select></div>
  <div class="field"><label>Description</label><input required id="exDesc" placeholder="Mf. Umeme wa mwezi"/></div>
  <div class="field"><label>Amount (TZS)</label><input required min="1" type="number" id="exAmount"/></div>
  <button class="btn btn-amber btn-block">Hifadhi Expense</button></form></div></div></div>`;
  document.getElementById("closeModalBtn").onclick=closeModal; document.getElementById("overlay").onclick=e=>{if(e.target.id==="overlay")closeModal()};
  document.getElementById("expenseForm").onsubmit=async e=>{e.preventDefault();
    const amount=Number(document.getElementById("exAmount").value); if(amount<=0){showToast("Weka amount sahihi");return;}
    try{await addDoc(collection(db,"expenses"),{category:document.getElementById("exCat").value,description:document.getElementById("exDesc").value.trim(),amount,date:todayISO(),createdBy:state.user.uid,createdAt:serverTimestamp()});await logAudit("Expense created",`${fmt(amount)} — ${document.getElementById("exCat").value}`);closeModal();showToast("Expense imehifadhiwa");}catch(err){showToast("Hitilafu: "+err.message)}
  };
}
async function deleteExpense(id){
  if(!confirm("Futa expense hii?"))return;
  try{await deleteDoc(doc(db,"expenses",id));await logAudit("Expense deleted",id);showToast("Expense imefutwa");}catch(e){showToast("Hitilafu: "+e.message)}
}
function renderPurchases(){
  const total=state.purchases.reduce((a,p)=>a+(Number(p.total)||0),0);
  return `<div class="view-header"><div><h1>Purchases</h1><p>Receive stock kutoka kwa suppliers.</p></div><button class="btn btn-dark" id="receiveStockBtn">${ICONS.plus} Receive Stock</button></div>
  <div class="kpi-grid"><div class="kpi-card"><div class="kpi-label">Purchase Value</div><div class="kpi-value">${fmt(total)}</div></div><div class="kpi-card"><div class="kpi-label">Purchases</div><div class="kpi-value">${state.purchases.length}</div></div></div>
  <div class="table-card"><table><thead><tr><th>Date</th><th>Supplier</th><th>Items</th><th class="right">Total</th></tr></thead><tbody>
  ${state.purchases.length?state.purchases.map(p=>`<tr><td>${escapeHtml(p.date||"")}</td><td>${escapeHtml(p.supplierName||"—")}</td><td>${(p.items||[]).map(i=>escapeHtml(i.name)+" × "+i.qty).join(", ")}</td><td class="right mono">${fmt(p.total)}</td></tr>`).join(""):`<tr class="empty-row"><td colspan="4">Hakuna purchases.</td></tr>`}
  </tbody></table></div>`;
}
function openPurchaseModal(){
  const options=state.products.map(p=>`<option value="${p.id}">${escapeHtml(p.name)} — ${p.stock} stock</option>`).join("");
  const suppliers=state.suppliers.map(s=>`<option value="${s.id}">${escapeHtml(s.name)}</option>`).join("");
  document.getElementById("modalRoot").innerHTML=`<div class="modal-overlay" id="overlay"><div class="modal"><div class="modal-head"><h3>Receive Stock</h3><button class="icon-btn" id="closeModalBtn">${ICONS.close}</button></div><div class="modal-body"><form id="purchaseForm">
  <div class="field"><label>Supplier</label><select id="puSupplier">${suppliers||"<option value=''>Hakuna supplier</option>"}</select></div>
  <div class="field"><label>Product</label><select id="puProduct">${options}</select></div>
  <div class="field-row"><div class="field"><label>Quantity</label><input type="number" min="1" required id="puQty"/></div><div class="field"><label>Unit Cost (TZS)</label><input type="number" min="0" required id="puCost"/></div></div>
  <button class="btn btn-amber btn-block">Receive & Increase Stock</button></form></div></div></div>`;
  document.getElementById("closeModalBtn").onclick=closeModal; document.getElementById("overlay").onclick=e=>{if(e.target.id==="overlay")closeModal()};
  document.getElementById("purchaseForm").onsubmit=async e=>{e.preventDefault();
    const productId=document.getElementById("puProduct").value, qty=Number(document.getElementById("puQty").value), unitCost=Number(document.getElementById("puCost").value);
    const supplierId=document.getElementById("puSupplier").value, supplier=state.suppliers.find(x=>x.id===supplierId);
    if(!productId||qty<=0||unitCost<0){showToast("Weka taarifa sahihi");return}
    try{
      const pRef=doc(db,"products",productId), purchaseRef=doc(collection(db,"purchases")), moveRef=doc(collection(db,"stockMoves"));
      await runTransaction(db,async tx=>{
        const pSnap=await tx.get(pRef); if(!pSnap.exists())throw new Error("Product haipo");
        const p=pSnap.data(); const item={productId,name:p.name,qty,unitCost,lineTotal:qty*unitCost};
        tx.update(pRef,{stock:(p.stock||0)+qty,costPrice:unitCost});
        tx.set(purchaseRef,{number:`PUR-${todayISO().replaceAll("-","")}-${String(Date.now()).slice(-6)}`,date:todayISO(),supplierId,supplierName:supplier?.name||"—",items:[item],total:qty*unitCost,createdBy:state.user.uid,createdAt:serverTimestamp()});
        tx.set(moveRef,{productId,productName:p.name,type:"purchase",qty,referenceId:purchaseRef.id,actorUid:state.user.uid,actorName:state.profile.name,createdAt:serverTimestamp()});
      });
      await logAudit("Stock received",`${qty} × ${state.products.find(x=>x.id===productId)?.name||productId}`);
      closeModal();showToast("Stock imeongezwa"); 
    }catch(err){showToast("Hitilafu: "+err.message)}
  };
}
function renderBackup(){
  return `<div class="view-header"><div><h1>Backup & Export</h1><p>Pakua data ya biashara yako kabla ya maintenance au migration.</p></div></div>
  <div class="card-grid">
    <div class="card"><h2>CSV Exports</h2><p class="muted">Export data moja moja kwa Excel.</p><div class="stack">
    <button class="btn btn-outline" id="exportSalesBtn">Sales CSV</button><button class="btn btn-outline" id="exportProductsBtn">Inventory CSV</button><button class="btn btn-outline" id="exportCustomersBtn">Customers CSV</button><button class="btn btn-outline" id="exportExpensesBtn">Expenses CSV</button><button class="btn btn-outline" id="exportPurchasesBtn">Purchases CSV</button></div></div>
    <div class="card"><h2>Full JSON Backup</h2><p class="muted">Backup ya data inayopatikana kwenye account hii.</p><button class="btn btn-dark" id="exportJsonBtn">Download Full Backup</button></div>
  </div>`;
}
function exportFullBackup(){
  const backup={version:"Phase4-v1",exportedAt:new Date().toISOString(),products:state.products,customers:state.customers,sales:state.sales,expenses:state.expenses,purchases:state.purchases,stockMoves:state.stockMoves,suppliers:state.suppliers,shifts:state.shifts};
  downloadText(`duka-manager-backup-${todayISO()}.json`,JSON.stringify(backup,null,2),"application/json");
  logAudit("Backup exported","Full JSON backup");
}

function renderAuditLog(){
  return `
    <div class="view-header">
      <div><h1>Audit Log</h1><p>Historia ya matendo muhimu kwenye mfumo</p></div>
      ${CAN_MANAGE_USERS(state.profile.role) ? `<button class="btn btn-outline" id="deleteOldAuditBtn" style="color:var(--red);border-color:#fecaca;">${ICONS.trash} Futa Logs za Siku 30+</button>` : ""}
    </div>
    <div class="card" style="margin-bottom:14px;padding:12px 14px;">
      <strong>Maintenance ya Audit Log</strong>
      <div class="muted" style="margin-top:4px;">Kitufe hiki kinafuta audit logs zenye umri wa zaidi ya siku 30. Administrator pekee ndiye anaweza kufanya cleanup.</div>
    </div>
    <div class="table-card">
      <table>
        <thead><tr><th>Tarehe</th><th>Aliyefanya</th><th>Kitendo</th><th>Maelezo</th></tr></thead>
        <tbody>
          ${state.auditLog.length===0 ? `<tr class="empty-row"><td colspan="4">Hakuna rekodi bado.</td></tr>` :
          state.auditLog.map(a=>`
            <tr>
              <td style="font-size:12px;color:var(--muted);">${a.date} <span style="color:#a8a29e;">${a.time}</span></td>
              <td class="cell-title">${escapeHtml(a.actorName)}</td>
              <td>${escapeHtml(a.action)}</td>
              <td style="font-size:12.5px;color:var(--muted);">${escapeHtml(a.details||"")}</td>
            </tr>`).join("")}
        </tbody>
      </table>
    </div>
  `;
}

render();
